[project]
name = "image2outfit"
version = "0.1.0"
description = "Reproducible Blender-to-Unity/VRChat garment production, verification, and release pipeline."
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
  "Pillow==12.3.0",
]

[dependency-groups]
dev = [
  "ruff",
]
snapshot = [
  "matplotlib",
  "numpy",
  "scipy",
  "trimesh",
]

[tool.uv]
package = false
default-groups = []

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["tools", "tests"]

[tool.image2outfit.garment-geometry]
# Body-conforming garments must derive their primary shell from the target
# avatar topology. Large sampled grids are acceptable for loose garments, but
# not as the accepted bodycon shell because they can bridge shoulders, waist,
# crotch, and other high-curvature regions.
require-source-topology-for-bodycon = true
forbid-sampled-grid-as-bodycon-shell = true

# Offset is measured from the target avatar surface before fabric thickness.
# Values above this threshold require an explicit product-level exception and
# visual/pose evidence; they must not silently become the default construction.
max-default-bodycon-surface-offset-m = 0.012
