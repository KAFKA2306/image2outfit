name: Validate public review console entry
on:
  pull_request:
    paths:
      - "tools/review_console.py"
      - "tools/review_console_ui.py"
      - "tests/test_review_console.py"
      - "tests/test_review_console_ui.py"
      - ".github/workflows/uiux-review-console-runtime.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile tools/review_console.py tools/review_console_ui.py tests/test_review_console.py tests/test_review_console_ui.py
      - run: python -m pytest -q tests/test_review_console.py tests/test_review_console_ui.py
      - run: python tools/review_console_ui.py --root . --output /tmp/image2outfit-review-console
      - name: Verify public entry
        run: |
          grep -q 'id="product-list"' /tmp/image2outfit-review-console/index.html
          test "$(grep -o 'id="products"' /tmp/image2outfit-review-console/index.html | wc -l)" -eq 1
          grep -q 'READ ONLY · RELEASE EVIDENCE' /tmp/image2outfit-review-console/index.html
