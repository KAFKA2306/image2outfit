name: Resumable reference garment pipeline

on:
  pull_request:
    branches: [main]
    paths:
      - src/image2outfit/pipeline.py
      - tools/run_garment_pipeline.py
      - tools/run_reference_product_stage.py
      - tools/siroino_tuxedo_halter_dress_large_build.py
      - tests/test_pipeline_core.py
      - tests/test_pipeline_resume.py
      - tests/test_reference_product_contract.py
      - config/products/siroino-tuxedo-halter-dress-large/**
      - config/pipeline/requests/siroino-tuxedo-halter-dress-large.json
      - .github/workflows/reference-product-pipeline.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  PRODUCT_ID: siroino-tuxedo-halter-dress-large
  JOB_PATH: config/products/siroino-tuxedo-halter-dress-large/job.json
  REQUEST_PATH: config/pipeline/requests/siroino-tuxedo-halter-dress-large.json
  CHECKPOINT_PATH: .image2outfit/products/siroino-tuxedo-halter-dress-large/pipeline-state.json
  PRODUCT_ROOT: Assets/GenWorks/siroino-tuxedo-halter-dress-large

concurrency:
  group: reference-pipeline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: '0.11.32'
          enable-cache: true

      - name: Compile and test checkpoint pipeline
        run: |
          uv run --locked --no-default-groups python -m compileall -q src tools tests
          uv run --locked --no-default-groups python -m unittest tests.test_pipeline_core tests.test_pipeline_audit tests.test_pipeline_resume tests.test_reference_product_contract -v

      - name: Resolve pinned Blender version
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          lock = json.loads(Path('config/toolchain-lock.json').read_text(encoding='utf-8'))
          version = lock['blender']['version']
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as stream:
              stream.write(f"BLENDER_VERSION={version}\n")
              stream.write(f"BLENDER_SERIES={'.'.join(version.split('.')[:2])}\n")
          PY

      - name: Install Blender runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xz-utils libxi6 libxrender1 libxfixes3 libxkbcommon0 \
            libsm6 libgl1 libegl1 libx11-6 libxxf86vm1

      - name: Download pinned Blender
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-all-errors \
            "https://download.blender.org/release/Blender${BLENDER_SERIES}/blender-${BLENDER_VERSION}-linux-x64.tar.xz" \
            --output blender.tar.xz
          mkdir -p .image2outfit/blender
          tar -xJf blender.tar.xz --strip-components=1 -C .image2outfit/blender
          echo "IMAGE2OUTFIT_BLENDER=$PWD/.image2outfit/blender/blender" >> "$GITHUB_ENV"

      - name: Restore pinned Blender Python environment
        run: |
          python - <<'PY'
          import json, os
          from tools.blender_python_env import prepare

          prepared = prepare('.image2outfit/blender/blender')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as stream:
              stream.write(f"PYTHONPATH={prepared.environment['PYTHONPATH']}\n")
          print(json.dumps(prepared.report, ensure_ascii=False, indent=2))
          PY

      - name: Restore latest resumable product state
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: |
            .image2outfit/products/${{ env.PRODUCT_ID }}
            .image2outfit/audit/${{ env.PRODUCT_ID }}
            ${{ env.PRODUCT_ROOT }}
          key: reference-pipeline-${{ github.event.pull_request.number || github.ref_name }}-${{ env.PRODUCT_ID }}-${{ github.run_id }}
          restore-keys: |
            reference-pipeline-${{ github.event.pull_request.number || github.ref_name }}-${{ env.PRODUCT_ID }}-

      - name: Reject stale checkpoint identity
        run: |
          python - <<'PY'
          import json, os, shutil
          from pathlib import Path

          checkpoint = Path(os.environ['CHECKPOINT_PATH'])
          request = json.loads(Path(os.environ['REQUEST_PATH']).read_text(encoding='utf-8'))
          if not checkpoint.is_file():
              print('No prior checkpoint was restored.')
              raise SystemExit(0)
          state = json.loads(checkpoint.read_text(encoding='utf-8'))
          expected = {
              'product_id': request['productId'],
              'target_avatar': request['targetAvatar'],
              'source_reference': request['sourceReference'],
              'revision_id': request.get('revisionId', ''),
          }
          mismatches = {
              key: {'checkpoint': state.get(key), 'request': value}
              for key, value in expected.items()
              if state.get(key) != value
          }
          if mismatches:
              print(f'Removing stale checkpoint: {mismatches}')
              shutil.rmtree(checkpoint.parent, ignore_errors=True)
              shutil.rmtree(Path(os.environ['PRODUCT_ROOT']), ignore_errors=True)
          else:
              print(
                  'Resuming after',
                  len(state.get('completed_stages', [])),
                  'completed stages with status',
                  state.get('status'),
              )
          PY

      - name: Execute or resume canonical 13-stage pipeline
        id: pipeline
        run: |
          set +e
          args=(
            --execute
            --engine deterministic
            --request "$REQUEST_PATH"
            --checkpoint-output "$CHECKPOINT_PATH"
            --output "$CHECKPOINT_PATH"
          )
          if [[ -f "$CHECKPOINT_PATH" ]] && python - "$CHECKPOINT_PATH" <<'PY'
          import json, sys
          state = json.load(open(sys.argv[1], encoding='utf-8'))
          raise SystemExit(0 if state.get('status') == 'EXECUTED' else 1)
          PY
          then
            echo "Checkpoint is already EXECUTED; preserving completed work." | tee ".image2outfit/products/${PRODUCT_ID}/pipeline-console.log"
            code=0
          else
            if [[ -f "$CHECKPOINT_PATH" ]]; then
              cp "$CHECKPOINT_PATH" "${CHECKPOINT_PATH}.resume-input"
              args+=(--resume-state "${CHECKPOINT_PATH}.resume-input")
            fi
            uv run --locked --no-default-groups \
              python tools/run_garment_pipeline.py "${args[@]}" \
              | tee ".image2outfit/products/${PRODUCT_ID}/pipeline-console.log"
            code=${PIPESTATUS[0]}
          fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Summarize checkpoint
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          path = Path(os.environ['CHECKPOINT_PATH'])
          if not path.is_file():
              print('Pipeline did not create a checkpoint.')
              raise SystemExit(0)
          state = json.loads(path.read_text(encoding='utf-8'))
          summary = Path(os.environ['GITHUB_STEP_SUMMARY'])
          completed = state.get('completed_stages', [])
          with summary.open('a', encoding='utf-8') as stream:
              stream.write('## Canonical garment pipeline\n\n')
              stream.write(f"- Status: `{state.get('status')}`\n")
              stream.write(f"- Current stage: `{state.get('current_stage')}`\n")
              stream.write(f"- Completed: `{len(completed)}/13`\n")
              stream.write(f"- Resume count: `{state.get('resume_count', 0)}`\n")
              if state.get('errors'):
                  stream.write(f"- Last error: `{state['errors'][-1]}`\n")
          print(json.dumps(state, ensure_ascii=False, indent=2))
          PY

      - name: Save resumable product state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            .image2outfit/products/${{ env.PRODUCT_ID }}
            .image2outfit/audit/${{ env.PRODUCT_ID }}
            ${{ env.PRODUCT_ROOT }}
          key: reference-pipeline-${{ github.event.pull_request.number || github.ref_name }}-${{ env.PRODUCT_ID }}-${{ github.run_id }}

      - name: Upload current product and audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reference-pipeline-${{ env.PRODUCT_ID }}-${{ github.run_id }}
          path: |
            .image2outfit/products/${{ env.PRODUCT_ID }}
            .image2outfit/audit/${{ env.PRODUCT_ID }}
            ${{ env.PRODUCT_ROOT }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Enforce pipeline completion
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          path = Path(os.environ['CHECKPOINT_PATH'])
          if not path.is_file():
              raise SystemExit('Pipeline checkpoint is missing')
          state = json.loads(path.read_text(encoding='utf-8'))
          if state.get('status') != 'EXECUTED':
              raise SystemExit(
                  f"Pipeline stopped at {state.get('current_stage')}: "
                  f"{state.get('errors', ['unknown error'])[-1]}"
              )
          PY
