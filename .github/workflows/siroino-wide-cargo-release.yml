name: Release Siroino Wide Cargo

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/run/siroino-wide-cargo-release.txt

permissions:
  contents: write

concurrency:
  group: image2outfit-siroino-wide-cargo-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: [self-hosted, windows, x64, image2outfit]
    timeout-minutes: 45

    steps:
      - name: Checkout without deleting candidate and evidence workspace
        uses: actions/checkout@v4
        with:
          clean: false
          persist-credentials: true
          fetch-depth: 0

      - uses: arduino/setup-task@v2

      - name: Prepare release job
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $jobRoot = 'Assets/_Local/Jobs/siroino-wide-cargo'
          New-Item -ItemType Directory -Force -Path $jobRoot | Out-Null
          Copy-Item -LiteralPath 'config/siroino-wide-cargo-job.json' -Destination "$jobRoot/job.json" -Force
          "JOB_PATH=$jobRoot/job.json" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ARTIFACT_DIR=Artifacts/siroino-wide-cargo" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PRODUCT_MANIFEST=Assets/GenWorks/Products/siroino-wide-cargo/ProductManifest.json" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_DIR=Release/siroino-wide-cargo" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Materialize reviewed evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          uv run --no-cache --no-project python tools/materialize_review_evidence.py --job $env:JOB_PATH --approval config/siroino-wide-cargo-approval.json
          if ($LASTEXITCODE -ne 0) { throw 'Review evidence materialization failed' }

      - name: Promote unchanged reviewed candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item Env:GITHUB_SHA -ErrorAction SilentlyContinue
          task release JOB="$env:JOB_PATH"
          if ($LASTEXITCODE -ne 0) { throw 'Release gate returned NO-GO' }
          $audit = Get-Content -LiteralPath "$env:ARTIFACT_DIR/audit.json" -Raw | ConvertFrom-Json
          if ([string]$audit.decision -ne 'GO') { throw "Expected GO, got $($audit.decision)" }

      - name: Mark product released
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          manifest_path = Path('Assets/GenWorks/Products/siroino-wide-cargo/ProductManifest.json')
          approval_path = Path('config/siroino-wide-cargo-approval.json')
          audit_path = Path('Artifacts/siroino-wide-cargo/audit.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8-sig'))
          approval = json.loads(approval_path.read_text(encoding='utf-8-sig'))
          audit = json.loads(audit_path.read_text(encoding='utf-8-sig'))
          manifest['status'] = 'RELEASED'
          manifest['releasedAt'] = datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z')
          manifest['candidateManifestSha256'] = approval['candidateManifestSha256']
          manifest['releaseManifest'] = audit.get('releaseManifest')
          manifest['releaseManifestSha256'] = audit.get('releaseManifestSha256')
          manifest['technicalGates'] = {
              'blender': 'PASS',
              'unityImport': 'PASS',
              'modularAvatar': 'PASS',
              'vrchatBuildAndTest': 'PASS',
              'humanVisualReview': 'PASS',
              'humanPoseReview': 'PASS',
              'humanRuntimeReview': 'PASS',
          }
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          '@ | python -

      - name: Commit release status
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- $env:PRODUCT_MANIFEST
          if (-not (git diff --cached --quiet)) {
            git commit -m 'Release Siroino wide cargo v1.0'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          }

      - name: Upload sale-ready release
        uses: actions/upload-artifact@v4
        with:
          name: siroino-wide-cargo-release-${{ github.run_id }}
          path: |
            Artifacts/siroino-wide-cargo/audit.json
            Release/siroino-wide-cargo
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
