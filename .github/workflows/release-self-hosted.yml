name: Promote reviewed outfit release

on:
  workflow_dispatch:
    inputs:
      job_path:
        description: Repository-relative schemaVersion 2 job.json path
        required: true
        type: string

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: image2outfit-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: [self-hosted, windows, x64, image2outfit]
    timeout-minutes: 30

    steps:
      - name: Checkout tracked policy without deleting reviewed local candidate
        uses: actions/checkout@v4
        with:
          clean: false
          persist-credentials: false
          fetch-depth: 1

      - uses: arduino/setup-task@v2

      - name: Verify release revision provenance
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          uv run --no-cache --locked --no-default-groups --python 3.11 python tools/release_provenance_gate.py `
            --repository "${{ github.repository }}" `
            --ref "${{ github.ref }}" `
            --sha "${{ github.sha }}" `
            --default-branch main `
            --output .image2outfit/release-provenance.json

      - name: Validate release request
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $jobPath = '${{ inputs.job_path }}'
          $localPattern = '^Assets/_Local/Jobs/[A-Za-z0-9._-]+/job\.json$'
          $trackedPattern = '^config/products/[A-Za-z0-9._-]+/job\.json$'
          if ($jobPath -notmatch $localPattern -and $jobPath -notmatch $trackedPattern) {
            throw 'job_path must match Assets/_Local/Jobs/<job-id>/job.json or config/products/<product-id>/job.json'
          }
          if (-not (Test-Path -LiteralPath $jobPath -PathType Leaf)) { throw "Job file was not found: $jobPath" }
          $job = Get-Content -LiteralPath $jobPath -Raw | ConvertFrom-Json
          if ([int]$job.schemaVersion -ne 2) { throw 'Only schemaVersion 2 jobs are accepted' }
          if ([string]::IsNullOrWhiteSpace([string]$job.id)) { throw 'job.id is required' }
          $runtimeRoot = ".image2outfit/products/$($job.id)"
          $candidateManifest = Join-Path "$runtimeRoot/candidate" 'candidate-manifest.json'
          if (-not (Test-Path -LiteralPath $candidateManifest -PathType Leaf)) { throw 'Reviewed candidate-manifest.json is missing' }
          "JOB_PATH=$jobPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "JOB_ID=$($job.id)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "REPORT_DIR=$runtimeRoot/reports" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_DIR=$runtimeRoot/release" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Promote unchanged reviewed candidate
        shell: pwsh
        run: uv run --no-cache --locked --no-default-groups --python 3.11 python tools/production_gate.py --mode release --job "$env:JOB_PATH"

      - name: Assert GO decision
        shell: pwsh
        run: |
          $audit = Get-Content -LiteralPath (Join-Path $env:REPORT_DIR 'audit.json') -Raw | ConvertFrom-Json
          if ([string]$audit.decision -ne 'GO') { throw "Release gate did not return GO: $($audit.decision)" }

      - name: Upload customer release
        uses: actions/upload-artifact@v4
        with:
          name: image2outfit-release-${{ env.JOB_ID }}-${{ github.run_id }}
          path: |
            .image2outfit/release-provenance.json
            ${{ env.REPORT_DIR }}/audit.json
            ${{ env.RELEASE_DIR }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
