name: Publish Siroino Wide Cargo Status

on:
  workflow_run:
    workflows: ["Build Siroino Wide Cargo"]
    types: [requested, in_progress, completed]

permissions:
  contents: write

concurrency:
  group: image2outfit-siroino-wide-cargo-status
  cancel-in-progress: true

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Write workflow status
        env:
          EVENT_ACTION: ${{ github.event.action }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          RUN_STATUS: ${{ github.event.workflow_run.status }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          CREATED_AT: ${{ github.event.workflow_run.created_at }}
          UPDATED_AT: ${{ github.event.workflow_run.updated_at }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          path = Path('.github/status/siroino-wide-cargo.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          data = {
              'schemaVersion': 1,
              'workflow': 'Build Siroino Wide Cargo',
              'eventAction': os.environ['EVENT_ACTION'],
              'runId': int(os.environ['RUN_ID']),
              'runNumber': int(os.environ['RUN_NUMBER']),
              'runAttempt': int(os.environ['RUN_ATTEMPT']),
              'status': os.environ['RUN_STATUS'],
              'conclusion': os.environ['RUN_CONCLUSION'] or None,
              'url': os.environ['RUN_URL'],
              'headSha': os.environ['HEAD_SHA'],
              'headBranch': os.environ['HEAD_BRANCH'],
              'createdAt': os.environ['CREATED_AT'],
              'workflowUpdatedAt': os.environ['UPDATED_AT'],
              'recordedAt': datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z'),
          }
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Commit status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/status/siroino-wide-cargo.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record Siroino wide cargo workflow status"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 2))
          done
          exit 1
