name: One-time materialize LoBoFit artifact

on:
  push:
    branches:
      - fix/lobofit-contract-and-format

permissions:
  actions: read
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/lobofit-contract-and-format
          fetch-depth: 0
      - name: Download the verified hosted Blender artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/lobofit-artifact
          gh api \
            -H "Accept: application/vnd.github+json" \
            /repos/KAFKA2306/image2outfit/actions/artifacts/8900069602/zip \
            > /tmp/lobofit-artifact.zip
          unzip -q /tmp/lobofit-artifact.zip -d /tmp/lobofit-artifact
      - name: Materialize current Blender outputs and truthful review state
        shell: bash
        run: |
          set -euo pipefail
          product="Assets/GenWorks/siroino-heather-hooded-bodysuit"
          source="/tmp/lobofit-artifact/$product"
          test -f "$source/Source/Blender/SiroinoHeatherHoodedBodysuit.blend"
          test -f "$source/Research/lobofit-local-bone-trial.json"
          test -f "$source/Previews/siroino-heather-hooded-bodysuit-pose-review.webp"

          cp "$product/Tests/visual-review.json" /tmp/visual-review.json
          for directory in Documentation Models Prefab Previews Research Source Textures; do
            mkdir -p "$product/$directory"
            rsync -a --delete "$source/$directory/" "$product/$directory/"
          done
          mkdir -p "$product/Tests"
          cp "$source/Tests/fit-audit.json" "$product/Tests/fit-audit.json"
          cp "$source/Tests/geometry-diagnostics.json" "$product/Tests/geometry-diagnostics.json"
          cp /tmp/visual-review.json "$product/Tests/visual-review.json"
          rm -f "$product/Source/Blender/"*.blend1
          cp "$source/ProductManifest.json" "$product/ProductManifest.json"

          python - <<'PY'
          import json
          from pathlib import Path

          product = Path("Assets/GenWorks/siroino-heather-hooded-bodysuit")
          revision = "v23-dama-anchor-lobomap-residual-fit"
          run_id = 30927279567
          artifact_id = 8900069602
          artifact_sha = "432fe8c6a5aa3eab8fa3d4148574488058a67086366371d089fd8c2eb29442db"

          trial_path = product / "Research" / "lobofit-local-bone-trial.json"
          trial = json.loads(trial_path.read_text(encoding="utf-8"))
          before = trial["metrics"]["localResidualEdgeRmsBeforeM"]
          after = trial["metrics"]["localResidualEdgeRmsAfterM"]
          trial["paper"]["officialCode"] = "https://github.com/MengZephyr/LoBoFit"
          trial["paper"]["officialCodeLicense"] = "BSD-3-Clause"
          trial["implementation"]["officialCodeLocated"] = True
          trial["implementation"]["officialCodeExecuted"] = False
          trial["metrics"]["localResidualEdgeRmsReductionPercent"] = (
              (before - after) / before * 100.0
          )
          trial["adoptionDecision"] = "METRIC_SUCCESS_VISUAL_REJECTION"
          trial["visualReview"] = {
              "result": "FAIL",
              "hostedWorkflowRun": run_id,
              "artifactId": artifact_id,
              "evidence": [
                  "Previews/siroino-heather-hooded-bodysuit-multiview.webp",
                  "Previews/siroino-heather-hooded-bodysuit-pose-review.webp",
                  "Tests/visual-review.json",
              ],
              "finding": (
                  "Local residual roughness improved, but the current base shell still "
                  "has long crotch tabs, shoulder protrusions, a loose tunic silhouette, "
                  "unfinished openings, surface defects and pose failures."
              ),
          }
          trial_path.write_text(
              json.dumps(trial, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          manifest_path = product / "ProductManifest.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          manifest["state"] = "WORKING"
          manifest["status"] = "WORKING"
          manifest["designRevision"] = revision
          manifest["handoff"]["lastAttempt"] = {
              "result": "HOSTED_RENDERED_VISUAL_REJECTED",
              "visualRevision": revision,
              "hostedWorkflowRun": run_id,
              "artifactId": artifact_id,
              "artifactSha256": artifact_sha,
          }
          manifest["handoff"]["blockers"] = [
              "Replace the incorrect primary body-region selection and underbody construction.",
              "Remove long front and rear crotch tabs and both shoulder protrusions.",
              "Restore a fitted bodysuit and slim-sleeve silhouette with finished cuffs and hood.",
              "Remove visible dark surface defects and irregular opening boundaries.",
              "Resolve visible pose deformation failures and reframe complete pose evidence.",
              "Pass direct visualAppearanceReview on current five-view and pose images.",
          ]
          manifest["technicalGates"] = {
              "blender": "PASS",
              "editableSource": "PASS",
              "fbx": "PASS",
              "prefabDeclared": "PASS",
              "fiveViewEvidence": "PASS",
              "poseEvidence": "PASS",
              "visualAppearanceReview": "FAIL",
              "researchTrial": "PASS",
              "fitPenetration": "NON_BLOCKING_FAIL",
              "unityImport": "OUT_OF_SCOPE",
              "unitySaveReload": "OUT_OF_SCOPE",
              "prefabReload": "OUT_OF_SCOPE",
              "modularAvatar": "OUT_OF_SCOPE",
              "ndmf": "OUT_OF_SCOPE",
              "vrchatBuildTest": "OUT_OF_SCOPE",
              "vrchatRuntime": "OUT_OF_SCOPE",
              "humanRuntimeReview": "OUT_OF_SCOPE",
          }
          manifest["outputs"]["visualReview"] = (
              "Assets/GenWorks/siroino-heather-hooded-bodysuit/Tests/visual-review.json"
          )
          manifest["outputs"]["geometryDiagnostics"] = (
              "Assets/GenWorks/siroino-heather-hooded-bodysuit/Tests/geometry-diagnostics.json"
          )
          manifest["outputs"]["researchTrial"] = (
              "Assets/GenWorks/siroino-heather-hooded-bodysuit/Research/"
              "lobofit-local-bone-trial.json"
          )
          manifest["research"] = {
              "source": {
                  "title": "LoBoFit: Flexible Garment Refitting via Local Bone Mapping Blending",
                  "submitted": "2026-05-08T08:56:06Z",
                  "arxiv": "https://arxiv.org/abs/2605.07450",
                  "paperLicense": "CC BY-NC-ND 4.0",
                  "officialCode": "https://github.com/MengZephyr/LoBoFit",
                  "officialCodeLicense": "BSD-3-Clause",
                  "officialCodeExecuted": False,
              },
              "result": "PASS",
              "execution": "SUCCESS",
              "decision": "METRIC_SUCCESS_VISUAL_REJECTION",
              "evidence": (
                  "Assets/GenWorks/siroino-heather-hooded-bodysuit/Research/"
                  "lobofit-local-bone-trial.json"
              ),
              "localResidualEdgeRmsBeforeM": before,
              "localResidualEdgeRmsAfterM": after,
              "localResidualEdgeRmsReductionPercent": (before - after) / before * 100.0,
          }
          fit_path = product / "Tests" / "fit-audit.json"
          fit = json.loads(fit_path.read_text(encoding="utf-8"))
          manifest["fitAuditSummary"] = {
              "pass": fit["pass"],
              "posesWithIntersections": [
                  name for name, value in fit["poses"].items() if not value["pass"]
              ],
              "triangleOverlapPairsByPose": {
                  name: value["triangleOverlapPairs"]
                  for name, value in fit["poses"].items()
              },
              "totalTriangleOverlapPairs": sum(
                  value["triangleOverlapPairs"] for value in fit["poses"].values()
              ),
              "completionBlockingByItself": False,
          }
          review = json.loads(
              (product / "Tests" / "visual-review.json").read_text(encoding="utf-8")
          )
          manifest["visualAppearanceReview"] = {
              "result": review["result"],
              "reviewer": review["reviewer"],
              "checkedAt": review["checkedAt"],
              "blockingFindings": review["blockingFindings"],
              "evidence": review["evidence"],
          }
          manifest_path.write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

          python tools/update_product_hashes.py --root "$product"
          rm .github/workflows/zz-materialize-lobofit-artifact-once.yml
          rm -f .materialize-lobofit-trigger

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all "$product" .github/workflows .materialize-lobofit-trigger
          git commit -m "Materialize executed LoBoFit Blender evidence"
          git push origin HEAD:fix/lobofit-contract-and-format
