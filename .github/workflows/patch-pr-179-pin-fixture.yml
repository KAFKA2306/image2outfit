name: Patch PR 179 pinned Cusick fixture

on:
  pull_request:
    paths:
      - ".github/workflows/patch-pr-179-pin-fixture.yml"

permissions:
  contents: write

jobs:
  patch:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/issue-143-material-blender-calibration-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.32"
      - name: Apply audited fixture corrections
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          script_path = Path("tools/material_drape_calibration.py")
          text = script_path.read_text(encoding="utf-8")

          replacements = [
              (
                  '''        actual[name] = (\n            bool(stored)\n            if isinstance(value, bool)\n            else int(stored)\n            if isinstance(value, int)\n            else float(stored)\n        )''',
                  '''        actual[name] = (\n            bool(stored)\n            if isinstance(value, bool)\n            else int(stored)\n            if isinstance(value, int)\n            else str(stored)\n            if isinstance(value, str)\n            else float(stored)\n        )''',
              ),
              (
                  '''    if render_material:\n        cloth.data.materials.append(cloth_material(cloth.name, index, total))\n\n    modifier = cloth.modifiers.new(name="Cloth", type="CLOTH")''',
                  '''    if render_material:\n        cloth.data.materials.append(cloth_material(cloth.name, index, total))\n\n    pin_group = cloth.vertex_groups.new(name="CusickSupportPin")\n    pinned_indices = [\n        vertex.index\n        for vertex in mesh.vertices\n        if math.hypot(vertex.co.x, vertex.co.y) <= SUPPORT_RADIUS_M\n    ]\n    if not pinned_indices:\n        raise RuntimeError("Cusick support pin group is empty")\n    pin_group.add(pinned_indices, 1.0, "REPLACE")\n\n    modifier = cloth.modifiers.new(name="Cloth", type="CLOTH")''',
              ),
              (
                  '''    cloth_values["mass"] = projection.vertex_mass_kg(surface_area, len(mesh.vertices))\n    actual_cloth = set_properties(''',
                  '''    cloth_values["mass"] = projection.vertex_mass_kg(surface_area, len(mesh.vertices))\n    cloth_values["use_pin_cloth"] = True\n    cloth_values["vertex_group_mass"] = pin_group.name\n    cloth_values["pin_stiffness"] = 1.0\n    actual_cloth = set_properties(''',
              ),
              (
                  '''        "vertexCount": len(mesh.vertices),\n        "elasticScale": elastic_scale,''',
                  '''        "vertexCount": len(mesh.vertices),\n        "pinnedVertexCount": len(pinned_indices),\n        "pinGroup": pin_group.name,\n        "elasticScale": elastic_scale,''',
              ),
              (
                  '''    if float(metrics["maximumZ"]) > INITIAL_SPECIMEN_Z_M + 0.015:\n        errors.append("upward-instability")\n    if float(metrics["verticalRange"]) < 0.003:\n        errors.append("no-gravity-response")\n    return errors\n\n\ndef pearson''',
                  '''    if float(metrics["maximumZ"]) > INITIAL_SPECIMEN_Z_M + 0.05:\n        errors.append("gross-upward-instability")\n    if float(metrics["verticalRange"]) < 0.01:\n        errors.append("no-gravity-response")\n    return errors\n\n\ndef plausibility_warnings(metrics: Mapping[str, float | str]) -> list[str]:\n    warnings: list[str] = []\n    if float(metrics["maximumZ"]) > INITIAL_SPECIMEN_Z_M + 0.015:\n        warnings.append("minor-support-surface-rise")\n    return warnings\n\n\ndef pearson''',
              ),
              (
                  '''        + max(0.0, 0.7 - float(comparison["pearsonVsPublishedKes"]))\n        + max(0.0, 0.65 - float(comparison["pearsonVsReal"]))\n        + 5.0 * len(comparison["plausibilityFailures"])''',
                  '''        + 0.5 * max(0.0, 0.7 - float(comparison["pearsonVsPublishedKes"]))\n        + 0.5 * max(0.0, 0.65 - float(comparison["pearsonVsReal"]))\n        + 10.0 * len(comparison["plausibilityFailures"])''',
              ),
              (
                  '''        record["metrics"] = metrics\n        record["plausibilityErrors"] = plausibility_errors(metrics)''',
                  '''        record["metrics"] = metrics\n        record["plausibilityErrors"] = plausibility_errors(metrics)\n        record["plausibilityWarnings"] = plausibility_warnings(metrics)''',
              ),
              (
                  '''    scene.world.color = (0.035, 0.04, 0.055)''',
                  '''    scene.world.color = (0.008, 0.01, 0.015)''',
              ),
              (
                  '''    key.data.energy = 900''',
                  '''    key.data.energy = 80''',
              ),
              (
                  '''    fill.data.energy = 500''',
                  '''    fill.data.energy = 35''',
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one replacement, found {count}: {old[:80]!r}")
              text = text.replace(old, new)
          script_path.write_text(text, encoding="utf-8")

          profile_path = Path("config/materials/blender-4.4-kes-calibration.v1.json")
          profile = json.loads(profile_path.read_text(encoding="utf-8"))
          profile["elasticScaleSearch"] = [0.001, 0.003, 0.01]
          profile["searchPolicy"] = {
              "spacing": "logarithmic-local-refinement",
              "policy": "refine around the coefficient-fit endpoint selected by the first exact Cusick sweep",
              "reason": "the first exact sweep showed scale 0.003 minimized coefficient error; the previous objective incorrectly preferred 0.3 because minor support-surface rise was treated as a hard failure",
          }
          fixture = profile["calibrationFixture"]
          fixture["supportConstraint"] = "vertices inside the 90 mm support radius are pinned with weight 1.0 to represent the fixed Cusick support plate"
          profile_path.write_text(
              json.dumps(profile, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Format and verify
        run: |
          uv run --locked --no-default-groups --group dev ruff check \
            --select E4,E7,E9,F --ignore E402 --fix \
            tools/material_drape_calibration.py
          uv run --locked --no-default-groups --group dev ruff format \
            tools/material_drape_calibration.py
          uv run --locked --no-default-groups --group dev ruff check \
            --select E4,E7,E9,F --ignore E402 \
            tools/material_drape_calibration.py
          python -m json.tool config/materials/blender-4.4-kes-calibration.v1.json >/dev/null
      - name: Commit exact patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tools/material_drape_calibration.py \
            config/materials/blender-4.4-kes-calibration.v1.json
          git commit -m "fix: pin the Cusick support region and select by coefficient fit"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
