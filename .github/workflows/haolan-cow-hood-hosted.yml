name: Build HAOLAN cow hood candidate on hosted runner

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/run/haolan-cow-hood-hosted.txt
  pull_request:
    branches: [main]
    paths:
      - .github/run/haolan-cow-hood-pr.txt
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: haolan-cow-hood-hosted
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install generator dependencies
        run: python -m pip install --disable-pip-version-check numpy pillow trimesh scipy

      - name: Generate FBX, prefab, textures, WebP, and audit
        run: |
          set -euo pipefail
          out='Published/haolan/cow-hood-knit-set-v1'
          rm -rf "$out"
          python tools/haolan_cow_generator_hosted.py --out "$out"
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, zipfile
          root = Path('Published/haolan/cow-hood-knit-set-v1')
          audit = json.loads((root / 'audit.json').read_text(encoding='utf-8'))
          assert audit['decision'] == 'NO-GO'
          assert audit['fbx']['meshObjects'] == 19
          assert audit['fbx']['vertices'] == 4302
          assert audit['fbx']['triangles'] == 7710
          required = [
              'HAOLAN_CowHoodKnitSet.fbx',
              'HAOLAN_CowHoodKnitSet.prefab',
              'HAOLAN_CowHoodKnitSet_preview.webp',
              'HAOLAN_CowHoodKnitSet_preview.glb',
              'audit.json',
              'AUDIT_REPORT.md',
          ]
          for name in required:
              assert (root / name).is_file(), name
          archive = root / 'HAOLAN_CowHoodKnitSet_v1.zip'
          with zipfile.ZipFile(archive, 'w', zipfile.ZIP_DEFLATED, compresslevel=9) as z:
              for path in sorted(root.rglob('*')):
                  if path.is_file() and path != archive:
                      z.write(path, Path('HAOLAN_CowHoodKnitSet_v1') / path.relative_to(root))
          lines = []
          for path in sorted(root.rglob('*')):
              if path.is_file() and path.name != 'SOURCE_HASHES.txt':
                  lines.append(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.relative_to(root).as_posix()}")
          (root / 'SOURCE_HASHES.txt').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          forbidden = {'HAOLAN_Lowpoly.fbx', 'HAOLAN_Lowpoly Variant.prefab', '15841.jpg'}
          assert not [p for p in root.rglob('*') if p.is_file() and p.name in forbidden]
          PY

      - name: Commit generated candidate
        run: |
          set -euo pipefail
          out='Published/haolan/cow-hood-knit-set-v1'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- "$out"
          if git diff --cached --quiet; then
            echo 'Generated candidate already matches main; no commit required.'
            exit 0
          fi
          git commit -m 'Add HAOLAN cow hood knit set candidate'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Upload candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: haolan-cow-hood-knit-set-${{ github.run_id }}
          path: Published/haolan/cow-hood-knit-set-v1
          retention-days: 14
          if-no-files-found: error
