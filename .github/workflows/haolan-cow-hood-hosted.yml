name: Build HAOLAN cow hood legacy snapshot on hosted runner

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/run/haolan-cow-hood-hosted.txt

permissions:
  contents: write

concurrency:
  group: haolan-cow-hood-hosted
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate FBX, prefab, textures, WebP, audit, and package
        run: |
          set -euo pipefail
          out='Assets/GenWorks/Legacy/Snapshots/haolan/cow-hood-knit-set-v1'
          rm -rf "$out"
          uv run --no-project --with numpy --with pillow --with trimesh --with scipy --with matplotlib python tools/haolan_cow_generator_hosted.py --out "$out"
          uv run --no-project python tools/package_snapshot.py --root "$out"
          uv run --no-project python -c "import json; from pathlib import Path; a=json.loads((Path('$out')/'audit.json').read_text()); assert a['decision']=='NO-GO'; assert a['fbx']['meshObjects']==19; assert a['fbx']['vertices']==4302; assert a['fbx']['triangles']==7710"

      - name: Commit generated legacy snapshot
        run: |
          set -euo pipefail
          out='Assets/GenWorks/Legacy/Snapshots/haolan/cow-hood-knit-set-v1'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- "$out"
          if git diff --cached --quiet; then
            echo 'Generated legacy snapshot already matches main; no commit required.'
            exit 0
          fi
          git commit -m 'Update HAOLAN cow hood legacy snapshot'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Upload candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: haolan-cow-hood-knit-set-${{ github.run_id }}
          path: Assets/GenWorks/Legacy/Snapshots/haolan/cow-hood-knit-set-v1
          retention-days: 14
          if-no-files-found: error
