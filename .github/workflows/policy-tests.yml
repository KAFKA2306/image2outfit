name: Release policy tests

on:
  pull_request:
    paths:
      - README.md
      - AGENTS.md
      - docs/**
      - .github/AGENTS.md
      - tools/**
      - tests/**
      - config/**
      - examples/**
      - Packages/*.json
      - ProjectSettings/ProjectVersion.txt
      - Assets/GenWorks/**
      - Taskfile.yml
      - pyproject.toml
      - uv.lock
      - .gitignore
      - .github/workflows/**
  push:
    branches: [main]
    paths:
      - README.md
      - AGENTS.md
      - docs/**
      - .github/AGENTS.md
      - tools/**
      - tests/**
      - config/**
      - examples/**
      - Packages/*.json
      - ProjectSettings/ProjectVersion.txt
      - Assets/GenWorks/**
      - Taskfile.yml
      - pyproject.toml
      - uv.lock
      - .gitignore
      - .github/workflows/**

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile Python
        run: python -m compileall -q tools tests

      - name: Audit pinned toolchain
        run: python tools/audit_toolchain.py

      - name: Audit repository hygiene
        run: python tools/audit_repository_hygiene.py

      - name: Audit GenWorks layout
        run: python tools/audit_genworks_layout.py

      - name: Run release policy tests
        run: python -m unittest discover -s tests -v

      - name: Parse tracked contracts
        run: |
          python - <<'PY'
          import json
          import tomllib
          from pathlib import Path

          roots = (Path('config'), Path('examples'), Path('Packages'), Path('Assets/GenWorks'))
          paths = sorted(path for root in roots if root.exists() for path in root.rglob('*.json'))
          if not paths:
              raise SystemExit('No JSON contracts found')
          for path in paths:
              json.loads(path.read_text(encoding='utf-8-sig'))
              print(f'{path}: PASS')

          with Path('pyproject.toml').open('rb') as stream:
              project = tomllib.load(stream)
          dependencies = project.get('project', {}).get('dependencies', [])
          if 'Pillow==12.3.0' not in dependencies:
              raise SystemExit('Pillow==12.3.0 must be declared in pyproject.toml')
          print('pyproject.toml: PASS')
          PY
