name: Release policy tests

on:
  pull_request:
    paths:
      - README.md
      - AGENTS.md
      - docs/**
      - .github/AGENTS.md
      - tools/**
      - tests/**
      - config/**
      - examples/**
      - Packages/*.json
      - ProjectSettings/ProjectVersion.txt
      - Assets/GenWorks/**
      - Taskfile.yml
      - pyproject.toml
      - uv.lock
      - .gitignore
      - .github/workflows/**
  push:
    branches: [main]
    paths:
      - README.md
      - AGENTS.md
      - docs/**
      - .github/AGENTS.md
      - tools/**
      - tests/**
      - config/**
      - examples/**
      - Packages/*.json
      - ProjectSettings/ProjectVersion.txt
      - Assets/GenWorks/**
      - Taskfile.yml
      - pyproject.toml
      - uv.lock
      - .gitignore
      - .github/workflows/**

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: '0.11.32'
          enable-cache: true

      - name: Verify Python lockfile
        run: uv lock --check

      - name: Compile Python
        run: uv run --locked --no-default-groups python -m compileall -q tools tests

      - name: Audit pinned toolchain
        run: uv run --locked --no-default-groups python tools/audit_toolchain.py

      - name: Audit repository hygiene
        run: uv run --locked --no-default-groups python tools/audit_repository_hygiene.py

      - name: Audit GenWorks layout
        run: uv run --locked --no-default-groups python tools/audit_genworks_layout.py

      - name: Audit 2026 garment research baseline
        run: uv run --locked --no-default-groups python tools/audit_research_baseline.py

      - name: Run release policy tests
        run: uv run --locked --no-default-groups python -m unittest discover -s tests -v

      - name: Parse tracked contracts
        run: |
          uv run --locked --no-default-groups python - <<'PY'
          import json
          import tomllib
          from pathlib import Path

          roots = (Path('config'), Path('examples'), Path('Packages'), Path('Assets/GenWorks'))
          paths = sorted(path for root in roots if root.exists() for path in root.rglob('*.json'))
          if not paths:
              raise SystemExit('No JSON contracts found')
          for path in paths:
              json.loads(path.read_text(encoding='utf-8-sig'))
              print(f'{path}: PASS')

          with Path('pyproject.toml').open('rb') as stream:
              project = tomllib.load(stream)
          dependencies = project.get('project', {}).get('dependencies', [])
          if 'Pillow==12.3.0' not in dependencies:
              raise SystemExit('Pillow==12.3.0 must be declared in pyproject.toml')
          uv = project.get('tool', {}).get('uv', {})
          if uv.get('package') is not False:
              raise SystemExit('image2outfit must remain a non-package uv project')
          if uv.get('default-groups') != []:
              raise SystemExit('dependency groups must remain explicit opt-ins')
          print('pyproject.toml: PASS')
          PY
