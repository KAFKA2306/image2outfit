name: Release policy tests

on:
  pull_request:
    paths:
      - tools/**
      - tests/**
      - config/**
      - examples/**
      - Packages/*.json
      - ProjectSettings/ProjectVersion.txt
      - Assets/GenWorks/**
      - Taskfile.yml
      - .gitignore
      - .github/workflows/**
  push:
    branches: [main]
    paths:
      - tools/**
      - tests/**
      - config/**
      - examples/**
      - Packages/*.json
      - ProjectSettings/ProjectVersion.txt
      - Assets/GenWorks/**
      - Taskfile.yml
      - .gitignore
      - .github/workflows/**

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile Python
        run: python -m compileall -q tools tests

      - name: Audit pinned toolchain
        run: python tools/audit_toolchain.py

      - name: Audit repository hygiene
        run: python tools/audit_repository_hygiene.py

      - name: Audit GenWorks layout
        run: python tools/audit_genworks_layout.py

      - name: Run release policy tests
        run: python -m unittest discover -s tests -v

      - name: Parse tracked JSON contracts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          roots = (Path('config'), Path('examples'), Path('Packages'), Path('Assets/GenWorks'))
          paths = sorted(path for root in roots if root.exists() for path in root.rglob('*.json'))
          if not paths:
              raise SystemExit('No JSON contracts found')
          for path in paths:
              json.loads(path.read_text(encoding='utf-8-sig'))
              print(f'{path}: PASS')
          PY

      - name: Check Blender Python requirements
        run: test -s config/blender-python-requirements.txt
