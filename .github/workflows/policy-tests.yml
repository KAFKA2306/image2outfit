name: PR merge gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: '0.11.32'
          enable-cache: true

      - name: Verify Python lockfile
        run: uv lock --check

      - name: Compile reusable Python
        run: uv run --locked --no-default-groups python -m compileall -q src tools tests

      - name: Audit all repository contracts
        run: uv run --locked --no-default-groups python tools/manage.py audit all

      - name: Run unit and contract tests
        run: uv run --locked --no-default-groups python -m unittest discover -s tests -v

      - name: Parse tracked contracts
        run: |
          uv run --locked --no-default-groups python - <<'PY'
          import json
          import tomllib
          from pathlib import Path

          roots = (
              Path("config"),
              Path("examples"),
              Path("Packages"),
              Path("Assets/GenWorks"),
          )
          paths = sorted(
              path
              for root in roots
              if root.exists()
              for path in root.rglob("*.json")
          )
          if not paths:
              raise SystemExit("No JSON contracts found")
          for path in paths:
              json.loads(path.read_text(encoding="utf-8-sig"))
              print(f"{path}: PASS")

          with Path("pyproject.toml").open("rb") as stream:
              project = tomllib.load(stream)
          dependencies = project.get("project", {}).get("dependencies", [])
          if "Pillow==12.3.0" not in dependencies:
              raise SystemExit("Pillow==12.3.0 must be declared")
          uv = project.get("tool", {}).get("uv", {})
          if uv.get("package") is not False:
              raise SystemExit("image2outfit must remain a non-package uv project")
          if uv.get("default-groups") != []:
              raise SystemExit("dependency groups must remain explicit opt-ins")
          print("pyproject.toml: PASS")
          PY

      - name: Verify merge and product release separation
        run: uv run --locked --no-default-groups python tools/pr_merge_gate.py

      - name: Ruff lint
        run: uv run --locked --no-default-groups --group dev ruff check --ignore S102 src tools tests

      - name: Ruff format check
        run: uv run --locked --no-default-groups --group dev ruff format --check src tools tests
