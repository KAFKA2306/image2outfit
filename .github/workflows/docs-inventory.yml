name: Documentation inventory

on:
  pull_request:
    paths:
      - '.github/workflows/docs-inventory.yml'

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Collect documentation inventory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p inventory
          find docs -type f -print 2>/dev/null | sort > inventory/files.txt || true
          {
            while IFS= read -r path; do
              printf '\n===== %s =====\n' "$path"
              cat "$path"
            done < inventory/files.txt
            for path in README.md AGENTS.md .github/AGENTS.md; do
              if [[ -f "$path" ]]; then
                printf '\n===== %s =====\n' "$path"
                cat "$path"
              fi
            done
          } > inventory/content.txt
          git grep -n -E 'docs/|\.github/AGENTS\.md' -- ':!inventory/**' > inventory/references.txt || true

      - uses: actions/upload-artifact@v4
        with:
          name: documentation-inventory
          path: inventory/
          if-no-files-found: error
