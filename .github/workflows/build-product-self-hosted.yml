name: Build product candidate on self-hosted runner

on:
  workflow_dispatch:
    inputs:
      job_path:
        description: Tracked product job at config/products/<product-id>/job.json
        required: true
        type: string
  pull_request:
    paths:
      - .github/workflows/build-product-self-hosted.yml
      - config/products/**
      - tools/materialize_private_target.py
      - tools/genworks_product_common.py
      - tools/**/*_build.py
      - tools/siroino_wide_cargo_release_refit_v*.py
      - tools/release_gate.py
      - tools/pipeline.py
      - Assets/GenWorks/Shared/**
      - Assets/GenWorks/Products/**
      - config/job.schema.v2.json
      - config/release-policy.json
      - config/toolchain-lock.json
      - Packages/**
      - ProjectSettings/ProjectVersion.txt

permissions:
  contents: read

concurrency:
  group: image2outfit-self-hosted-${{ github.event.pull_request.number || inputs.job_path }}
  cancel-in-progress: true

jobs:
  candidate:
    runs-on: self-hosted
    timeout-minutes: 240
    steps:
      - name: Checkout tracked pipeline without deleting private avatar sources
        uses: actions/checkout@v4
        with:
          clean: false
          persist-credentials: false
          fetch-depth: 0

      - uses: arduino/setup-task@v2

      - name: Resolve product build scope
        shell: pwsh
        env:
          DISPATCH_JOB_PATH: ${{ inputs.job_path }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          $ErrorActionPreference = 'Stop'
          $jobPath = [string]$env:DISPATCH_JOB_PATH
          if ([string]::IsNullOrWhiteSpace($jobPath)) {
            if ([string]::IsNullOrWhiteSpace($env:BASE_REF)) {
              throw 'job_path is required outside a pull request'
            }
            git fetch origin $env:BASE_REF --depth=1
            $changed = @(git diff --name-only "origin/$env:BASE_REF...HEAD" -- 'config/products/*/job.json')
            if ($LASTEXITCODE -ne 0) { throw 'Could not inspect changed product jobs' }
            $changed = @($changed | Where-Object { $_ -match '^config/products/[A-Za-z0-9._-]+/job\.json$' } | Sort-Object -Unique)
            if ($changed.Count -ne 1) {
              "SKIP_PRODUCT_BUILD=true" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
              "BUILD_SCOPE_REASON=changed-product-jobs-$($changed.Count)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
              Write-Host "No unique product job selected: $($changed -join ', '); contract audit only"
              exit 0
            }
            $jobPath = $changed[0]
          }
          if ($jobPath -notmatch '^config/products/[A-Za-z0-9._-]+/job\.json$') {
            throw 'job_path must match config/products/<product-id>/job.json'
          }
          if (-not (Test-Path -LiteralPath $jobPath -PathType Leaf)) {
            throw "Tracked product job not found: $jobPath"
          }
          $job = Get-Content -LiteralPath $jobPath -Raw | ConvertFrom-Json
          if ([int]$job.schemaVersion -ne 2) { throw 'Only schemaVersion 2 jobs are accepted' }
          $productId = Split-Path -Leaf (Split-Path -Parent $jobPath)
          if ([string]$job.id -ne $productId) { throw 'Product job id does not match its namespace' }
          $directRoot = "Assets/GenWorks/$productId"
          $productsRoot = "Assets/GenWorks/Products/$productId"
          $productRoot = [string]$job.productRoot
          if ($productRoot -ne $directRoot -and $productRoot -ne $productsRoot) {
            throw "Product root must be $directRoot or $productsRoot"
          }
          foreach ($field in @('prefabAssetPath', 'integratedPrefabAssetPath')) {
            $value = [string]$job.$field
            $escapedRoot = [regex]::Escape($productRoot)
            if (-not [string]::IsNullOrWhiteSpace($value) -and $value -notmatch "^$escapedRoot/Prefab/[^/]+\.prefab$") {
              throw "$field must match $productRoot/Prefab/*.prefab"
            }
          }
          if ($null -ne $job.automaticBuild -and -not [bool]$job.automaticBuild) {
            "SKIP_PRODUCT_BUILD=true" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "BUILD_SCOPE_REASON=$productId-manual-recovery" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            exit 0
          }
          $localJob = "Assets/_Local/Jobs/$productId/job.json"
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $localJob), $job.artifactDir | Out-Null
          "SKIP_PRODUCT_BUILD=false" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TRACKED_JOB_PATH=$jobPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "JOB_PATH=$localJob" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "JOB_ID=$productId" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PRODUCT_ROOT=$productRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ARTIFACT_DIR=$($job.artifactDir)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CANDIDATE_DIR=$($job.candidateDir)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_DIR=$($job.releaseDir)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "IMAGE2OUTFIT_RUN_ID=$env:GITHUB_RUN_ID" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Audit repository contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          uv run --no-cache --no-project python tools/audit_genworks_layout.py
          if ($LASTEXITCODE -ne 0) { throw 'GenWorks layout audit failed' }
          uv run --no-cache --no-project python tools/audit_repository_hygiene.py
          if ($LASTEXITCODE -ne 0) { throw 'Repository hygiene audit failed' }

      - name: Materialize exact private target
        if: env.SKIP_PRODUCT_BUILD != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          uv run --no-cache --no-project python tools/materialize_private_target.py --job $env:TRACKED_JOB_PATH --output $env:JOB_PATH |
            Tee-Object -FilePath "$env:ARTIFACT_DIR/resolved-target.json"
          if ($LASTEXITCODE -ne 0) { throw 'Private target materialization failed' }

      - name: Restore pinned VPM packages
        if: env.SKIP_PRODUCT_BUILD != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Command vpm -ErrorAction SilentlyContinue)) {
            throw 'The official VPM CLI is required on the image2outfit runner'
          }
          $repoOutput = (& vpm list repos 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) { throw "vpm list repos failed: $repoOutput" }
          foreach ($repo in @('https://vpm.nadena.dev/vpm.json', 'https://vpm.anatawa12.com/vpm.json')) {
            if ($repoOutput -notmatch [regex]::Escape($repo)) {
              & vpm add repo $repo
              if ($LASTEXITCODE -ne 0) { throw "Could not register required VPM repository: $repo" }
            }
          }
          & vpm resolve project .
          if ($LASTEXITCODE -ne 0) { throw 'vpm resolve project failed' }

      - name: Build and validate technical candidate
        if: env.SKIP_PRODUCT_BUILD != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          task candidate JOB="$env:JOB_PATH"
          if ($LASTEXITCODE -ne 0) { throw 'Candidate build or technical gate failed' }

      - name: Assert review boundary
        if: env.SKIP_PRODUCT_BUILD != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path -LiteralPath $env:RELEASE_DIR) {
            throw 'Candidate workflow must not create Release/'
          }
          $audit = Get-Content -LiteralPath "$env:ARTIFACT_DIR/audit.json" -Raw | ConvertFrom-Json
          if ([string]$audit.decision -ne 'REVIEW_REQUIRED') {
            throw "Expected REVIEW_REQUIRED, got $($audit.decision)"
          }

      - name: Upload product, candidate, and evidence
        if: always() && env.SKIP_PRODUCT_BUILD != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: image2outfit-self-hosted-${{ env.JOB_ID }}-${{ github.run_id }}
          path: |
            ${{ env.PRODUCT_ROOT }}
            ${{ env.ARTIFACT_DIR }}
            ${{ env.CANDIDATE_DIR }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
