name: Build product candidate on self-hosted runner

on:
  workflow_dispatch:
    inputs:
      job_path:
        description: Tracked product job at config/products/<product-id>/job.json
        required: true
        type: string
  pull_request:
    paths:
      - .github/workflows/build-product-self-hosted.yml
      - config/products/**
      - tools/materialize_private_target.py
      - tools/genworks_product_common.py
      - tools/**/*_build.py
      - tools/production_gate.py
      - tools/production_gate_core.py
      - tools/release_gate.py
      - tools/runtime_paths.py
      - tools/pipeline.py
      - tools/resolve_product_build_scope.py
      - Assets/GenWorks/Shared/**
      - config/job.schema.v2.json
      - config/release-policy.json
      - config/toolchain-lock.json
      - Packages/**
      - ProjectSettings/ProjectVersion.txt

permissions:
  contents: read
  actions: write

concurrency:
  group: image2outfit-self-hosted-${{ github.event.pull_request.number || inputs.job_path }}
  cancel-in-progress: true

jobs:
  candidate:
    runs-on: self-hosted
    timeout-minutes: 240

    steps:
      - name: Checkout tracked pipeline without deleting private avatar sources
        uses: actions/checkout@v4
        with:
          clean: false
          persist-credentials: false
          fetch-depth: 0

      - uses: arduino/setup-task@v2

      - name: Resolve product build scope
        shell: pwsh
        env:
          DISPATCH_JOB_PATH: ${{ inputs.job_path }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          uv run --no-cache --no-project python tools/resolve_product_build_scope.py `
            --job-path "$env:DISPATCH_JOB_PATH" `
            --event-name "$env:EVENT_NAME" `
            --base-sha "$env:BASE_SHA" `
            --head-sha "$env:HEAD_SHA" `
            --github-env "$env:GITHUB_ENV" `
            --materialize-job
          if ($LASTEXITCODE -ne 0) { throw 'Product build scope resolution failed' }
          "IMAGE2OUTFIT_RUN_ID=$env:GITHUB_RUN_ID" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Audit repository contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          uv run --no-cache --no-project python tools/audit_genworks_layout.py
          if ($LASTEXITCODE -ne 0) { throw 'GenWorks layout audit failed' }
          uv run --no-cache --no-project python tools/audit_repository_hygiene.py
          if ($LASTEXITCODE -ne 0) { throw 'Repository hygiene audit failed' }

      - name: Materialize exact private target
        if: env.SKIP_PRODUCT_BUILD != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path $env:REPORT_DIR | Out-Null
          uv run --no-cache --no-project python tools/materialize_private_target.py --job $env:TRACKED_JOB_PATH --output $env:JOB_PATH |
            Tee-Object -FilePath "$env:REPORT_DIR/resolved-target.json"
          if ($LASTEXITCODE -ne 0) { throw 'Private target materialization failed' }

      - name: Restore pinned VPM packages
        if: env.SKIP_PRODUCT_BUILD != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Command vpm -ErrorAction SilentlyContinue)) {
            throw 'The official VPM CLI is required on the image2outfit runner'
          }
          $repoOutput = (& vpm list repos 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) { throw "vpm list repos failed: $repoOutput" }
          foreach ($repo in @('https://vpm.nadena.dev/vpm.json', 'https://vpm.anatawa12.com/vpm.json')) {
            if ($repoOutput -notmatch [regex]::Escape($repo)) {
              & vpm add repo $repo
              if ($LASTEXITCODE -ne 0) { throw "Could not register required VPM repository: $repo" }
            }
          }
          & vpm resolve project .
          if ($LASTEXITCODE -ne 0) { throw 'vpm resolve project failed' }

      - name: Build and validate technical candidate
        if: env.SKIP_PRODUCT_BUILD != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          uv run --no-cache --locked --no-default-groups --python 3.11 python tools/production_gate.py --mode candidate --job "$env:JOB_PATH"
          if ($LASTEXITCODE -ne 0) { throw 'Candidate build or technical gate failed' }

      - name: Assert review boundary
        if: env.SKIP_PRODUCT_BUILD != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path -LiteralPath $env:RELEASE_DIR) {
            throw 'Candidate workflow must not create a runtime release package'
          }
          $audit = Get-Content -LiteralPath "$env:REPORT_DIR/audit.json" -Raw | ConvertFrom-Json
          if ([string]$audit.decision -ne 'REVIEW_REQUIRED') {
            throw "Expected REVIEW_REQUIRED, got $($audit.decision)"
          }

      - name: Delete previous self-hosted artifact
        if: always() && env.SKIP_PRODUCT_BUILD != 'true' && env.JOB_ID != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-cache --locked --no-default-groups --python 3.11 python tools/delete_previous_artifacts.py "image2outfit-self-hosted-$env:JOB_ID"

      - name: Upload product, candidate, and evidence
        if: always() && env.SKIP_PRODUCT_BUILD != 'true' && env.JOB_ID != ''
        uses: actions/upload-artifact@v4
        with:
          name: image2outfit-self-hosted-${{ env.JOB_ID }}
          path: |
            ${{ env.PRODUCT_ROOT }}/Models/**/*.fbx
            ${{ env.PRODUCT_ROOT }}/Prefab/**/*.prefab
            ${{ env.PRODUCT_ROOT }}/Previews/**/*.webp
            ${{ env.PRODUCT_ROOT }}/Textures/**/*.webp
            ${{ env.PRODUCT_ROOT }}/Source/Blender/*.blend
            ${{ env.PRODUCT_ROOT }}/ProductManifest.json
            ${{ env.PRODUCT_ROOT }}/SOURCE_HASHES.txt
            ${{ env.REPORT_DIR }}/**/*.json
            ${{ env.CANDIDATE_DIR }}/**/*.json
            ${{ env.CANDIDATE_DIR }}/**/*.zip
            ${{ env.CANDIDATE_DIR }}/**/*.unitypackage
            ${{ env.CANDIDATE_DIR }}/**/*.fbx
            ${{ env.CANDIDATE_DIR }}/**/*.prefab
            ${{ env.CANDIDATE_DIR }}/**/*.webp
            ${{ env.CANDIDATE_DIR }}/**/*.blend
            ${{ env.CANDIDATE_DIR }}/**/*.txt
            ${{ env.CANDIDATE_DIR }}/**/*.md
          if-no-files-found: error
          overwrite: true
          retention-days: 1
          compression-level: 6
