name: Fix PR 179 lint

on:
  pull_request:
    paths:
      - ".github/workflows/fix-pr-179-lint.yml"
      - "src/image2outfit/material_blender.py"
      - "tools/material_drape_calibration.py"
      - "tests/test_material_blender.py"

permissions:
  contents: write

jobs:
  fix:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/issue-143-material-blender-calibration-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.32"
      - name: Apply exact safe fixes
        run: |
          files=(
            src/image2outfit/material_blender.py
            tools/material_drape_calibration.py
            tests/test_material_blender.py
          )
          uv run --locked --no-default-groups --group dev ruff check \
            --select E4,E7,E9,F --ignore E402 --fix "${files[@]}"
          uv run --locked --no-default-groups --group dev ruff format "${files[@]}"
          uv run --locked --no-default-groups --group dev ruff check \
            --select E4,E7,E9,F --ignore E402 "${files[@]}"
      - name: Commit only formatter output
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/image2outfit/material_blender.py \
            tools/material_drape_calibration.py \
            tests/test_material_blender.py
          git commit -m "style: apply Ruff to MaterialSpec calibration"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
