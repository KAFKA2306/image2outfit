name: Temporary issue 143 Ruff formatter

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/material_drape_calibration.py"
      - ".github/workflows/tmp-issue-143-ruff-format.yml"

permissions:
  contents: write

jobs:
  format:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/issue-143-material-blender-calibration-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.32"
      - name: Format only the issue 143 calibration script
        run: uv run --locked --no-default-groups --group dev ruff format tools/material_drape_calibration.py
      - name: Commit the formatter-only change
        run: |
          if git diff --quiet -- tools/material_drape_calibration.py; then
            echo "No formatter change required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/material_drape_calibration.py
          git commit -m "style(material): apply Ruff formatting"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
