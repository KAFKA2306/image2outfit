name: One-time closed PR branch cleanup

on:
  push:
    paths:
      - .github/workflows/one-time-closed-pr-branch-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete closed experiment branches
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          for branch in \
            agent/cyber-kawaii-render-pass-2 \
            agent/siroino-v21-clean-base
          do
            if gh api "repos/${REPOSITORY}/git/ref/heads/${branch}" >/dev/null 2>&1; then
              gh api --method DELETE "repos/${REPOSITORY}/git/refs/heads/${branch}"
              echo "deleted ${branch}"
            else
              echo "already absent ${branch}"
            fi
          done
