name: Consolidate root and environment contracts from PR

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: consolidate-root-environment-pr
  cancel-in-progress: false

jobs:
  consolidate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/consolidate-root-and-environment-contracts'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/consolidate-root-and-environment-contracts
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: astral-sh/setup-uv@v6

      - name: Apply consolidation
        shell: bash
        run: |
          python .github/scripts/consolidate_root_environment.py
          python .github/scripts/consolidate_environment_tests.py

      - name: Resolve lockfile
        run: uv lock

      - name: Remove temporary automation before validation
        shell: bash
        run: |
          git rm -f \
            .github/consolidate-trigger.txt \
            .github/scripts/consolidate_root_environment.py \
            .github/scripts/consolidate_environment_tests.py \
            .github/workflows/one-time-consolidate-root-environment.yml \
            .github/workflows/one-time-consolidate-root-environment-pr.yml
          rmdir .github/scripts 2>/dev/null || true

      - name: Validate consolidated repository
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q tools tests
          python tools/audit_repository_hygiene.py
          python tools/audit_genworks_layout.py
          python -m unittest discover -s tests -v
          uv run --group dev ruff check \
            --ignore S102,EXE001,UP017,BLE001,SIM103,I001,RUF100 \
            tools/audit_repository_hygiene.py \
            tools/audit_toolchain.py \
            tools/blender_python_env.py \
            tools/release_gate.py \
            tools/siroino_wide_cargo_release_refit_v23.py \
            tests/test_release_gate.py \
            tests/test_toolchain.py
          git diff --check

      - name: Commit validated result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: consolidate review and Python environment contracts'
          git push origin HEAD:agent/consolidate-root-and-environment-contracts
