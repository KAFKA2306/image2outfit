name: Build HAOLAN cow hood v1.1 branch candidate

on:
  push:
    branches:
      - agent/fix-haolan-cow-hood-v11
    paths:
      - .github/run/haolan-cow-v11.txt
  pull_request:
    branches:
      - main
    paths:
      - .github/run/haolan-cow-v11.txt
      - .github/workflows/haolan-cow-v11-branch-build.yml
      - tools/haolan_cow_generator_hosted.py
      - tools/haolan_cow_hood_generator.py
      - tools/haolan_cow_v11_overrides.b85
      - tools/package_haolan_cow_v11.py

permissions:
  contents: write

concurrency:
  group: haolan-cow-v11-branch-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-haolan-cow-hood-v11
          fetch-depth: 1
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install generator dependencies
        run: python -m pip install --disable-pip-version-check numpy pillow trimesh scipy matplotlib

      - name: Generate and validate canonical product
        run: |
          set -euo pipefail
          rm -rf /tmp/cow-hood-knit-set-v11
          python -m py_compile tools/haolan_cow_generator_hosted.py tools/package_haolan_cow_v11.py
          python tools/haolan_cow_generator_hosted.py --out /tmp/cow-hood-knit-set-v11
          python tools/package_haolan_cow_v11.py --generated /tmp/cow-hood-knit-set-v11 --repo .
          test -s Assets/GenWorks/cow-hood-knit-set-v1/Previews/back.png
          test -s Assets/GenWorks/cow-hood-knit-set-v1/Prefab/HAOLAN_CowHoodKnitSet.prefab
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('Assets/GenWorks/cow-hood-knit-set-v1')
          audit = json.loads((root / 'audit.json').read_text(encoding='utf-8'))
          manifest = json.loads((root / 'ProductManifest.json').read_text(encoding='utf-8'))
          assert audit['pathReview']['canonicalRoot'] == 'PASS'
          assert audit['pathReview']['frontBackLabelsCorrected'] is True
          assert audit['staticGeometry']['passed'] is True
          assert manifest['metrics']['meshObjects'] == 24
          assert manifest['metrics']['vertices'] == 18394
          assert manifest['metrics']['triangles'] == 34778
          assert manifest['qualityGates']['staticGeometry'] == 'PASS'
          assert manifest['qualityGates']['unityImport'] == 'NOT_RUN'
          PY

      - name: Commit generated checkpoint to branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- Assets/GenWorks/cow-hood-knit-set-v1 Assets/GenWorks/OutfitCatalog.json config/products/cow-hood-knit-set-v1
          if git diff --cached --quiet; then
            echo 'No generated changes'
            exit 0
          fi
          git commit -m 'Generate canonical HAOLAN cow hood v1.1 checkpoint'
          git push origin HEAD:agent/fix-haolan-cow-hood-v11

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: haolan-cow-hood-v11-${{ github.run_id }}
          path: |
            Assets/GenWorks/cow-hood-knit-set-v1/Previews
            Assets/GenWorks/cow-hood-knit-set-v1/audit.json
            Assets/GenWorks/cow-hood-knit-set-v1/ProductManifest.json
          retention-days: 14
          if-no-files-found: error
