name: Render validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/siroino_wide_cargo_release_refit.py
      - config/products/siroino-wide-cargo/job.json
      - .github/workflows/render-validation.yml

env:
  SIROINO_RENDER_REVISION: v17-single-shell-wide-cargo-2
  STATUS_CONTEXT: render-validation/siroino-wide-cargo

permissions:
  contents: read
  statuses: write

concurrency:
  group: render-validation-siroino-wide-cargo
  cancel-in-progress: false

jobs:
  siroino-wide-cargo:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Publish pending commit status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/status.json
          import json, os
          print(json.dumps({
              'state': 'pending',
              'target_url': f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              'description': f"Run {os.environ['GITHUB_RUN_ID']} · {os.environ['SIROINO_RENDER_REVISION']}",
              'context': os.environ['STATUS_CONTEXT'],
          }))
          PY
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --data-binary @/tmp/status.json

      - name: Install Blender runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xz-utils libxi6 libxrender1 libxfixes3 libxkbcommon0 libsm6 \
            libgl1 libegl1 libx11-6 libxxf86vm1
          curl --fail --location --retry 4 --retry-all-errors \
            https://download.blender.org/release/Blender4.4/blender-4.4.3-linux-x64.tar.xz \
            --output blender.tar.xz
          mkdir -p .image2outfit/blender
          tar -xJf blender.tar.xz --strip-components=1 -C .image2outfit/blender
          python_exe=.image2outfit/blender/4.4/python/bin/python3.11
          "$python_exe" -m ensurepip
          "$python_exe" -m pip install --disable-pip-version-check --no-deps --only-binary=:all: \
            -r config/blender-python-requirements.txt

      - name: Generate five-view evidence
        id: generate
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p Artifacts/siroino-wide-cargo
          .image2outfit/blender/blender \
            --background --factory-startup --python-exit-code 1 \
            --python tools/siroino_wide_cargo_release_refit.py \
            -- --job config/products/siroino-wide-cargo/job.json \
            2>&1 | tee Artifacts/siroino-wide-cargo/hosted-blender.log

      - name: Generate pose evidence
        id: poses
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          blend=Assets/GenWorks/Products/siroino-wide-cargo/Source/Blender/SiroinoWideCargo.blend
          if [ ! -f "$blend" ]; then exit 1; fi
          .image2outfit/blender/blender \
            --background "$blend" --python-exit-code 1 \
            --python tools/siroino_required_pose_entry.py \
            -- --job config/products/siroino-wide-cargo/job.json \
            2>&1 | tee Artifacts/siroino-wide-cargo/hosted-poses.log

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-validation-${{ github.run_id }}
          path: |
            Artifacts/siroino-wide-cargo
            Assets/GenWorks/Products/siroino-wide-cargo
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Publish final commit status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GENERATE_OUTCOME: ${{ steps.generate.outcome }}
          POSES_OUTCOME: ${{ steps.poses.outcome }}
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/status.json
          import json, os
          passed = os.environ['GENERATE_OUTCOME'] == 'success' and os.environ['POSES_OUTCOME'] == 'success'
          print(json.dumps({
              'state': 'success' if passed else 'failure',
              'target_url': f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              'description': f"Run {os.environ['GITHUB_RUN_ID']} · render={os.environ['GENERATE_OUTCOME']} · poses={os.environ['POSES_OUTCOME']}",
              'context': os.environ['STATUS_CONTEXT'],
          }))
          PY
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --data-binary @/tmp/status.json

      - name: Enforce generation result
        if: always()
        shell: bash
        run: |
          test '${{ steps.generate.outcome }}' = success
          test '${{ steps.poses.outcome }}' = success
