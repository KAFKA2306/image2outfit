name: One-time finalize LoBoFit trial

on:
  push:
    branches:
      - fix/lobofit-contract-and-format

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/lobofit-contract-and-format
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.32"
      - name: Align revision, format Python, and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("tools/siroino_heather_lobomap_fit.py")
          text = path.read_text(encoding="utf-8")
          old = 'DESIGN_REVISION = "v22-lobomap-local-residual-fit"'
          new = 'DESIGN_REVISION = "v23-dama-anchor-lobomap-residual-fit"'
          if old not in text and new not in text:
              raise SystemExit("LoBoFit design revision anchor not found")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          uv run --locked --no-default-groups --group dev ruff format \
            tools/siroino_heather_hooded_v21_patch.py \
            tools/siroino_heather_lobomap_fit.py \
            tools/siroino_heather_hooded_product.py \
            tests/test_siroino_lobomap_fit.py
          rm .github/workflows/zz-finalize-lobofit-once.yml
          rm -f .lobofit-finalize-trigger
          uv run --locked --no-default-groups --group dev ruff check \
            --select E4,E7,E9,F --ignore E402 \
            tools/siroino_heather_hooded_v21_patch.py \
            tools/siroino_heather_lobomap_fit.py \
            tools/siroino_heather_hooded_product.py \
            tests/test_siroino_lobomap_fit.py
          uv run --locked --no-default-groups --group dev ruff format --check \
            tools/siroino_heather_hooded_v21_patch.py \
            tools/siroino_heather_lobomap_fit.py \
            tools/siroino_heather_hooded_product.py \
            tests/test_siroino_lobomap_fit.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Finalize LoBoFit research trial integration"
          git push origin HEAD:fix/lobofit-contract-and-format
