name: Materialize military romper checkpoint

on:
  push:
    branches:
      - feat/siroino-military-sheer-romper-large
    paths:
      - .github/workflows/materialize-military-romper.yml
      - config/products/siroino-military-sheer-romper-large/job.json
      - tools/siroino_military_sheer_romper_build.py
      - tools/siroino_military_sheer_romper_smooth.py
      - tools/siroino_military_sheer_romper_pose.py

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/siroino-military-sheer-romper-large
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Blender runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xz-utils libxi6 libxrender1 libxfixes3 libxkbcommon0 libsm6 libgl1 libegl1 libx11-6 libxxf86vm1

      - name: Download pinned Blender
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-all-errors \
            https://download.blender.org/release/Blender4.4/blender-4.4.3-linux-x64.tar.xz \
            --output blender.tar.xz
          mkdir -p .image2outfit/blender
          tar -xJf blender.tar.xz --strip-components=1 -C .image2outfit/blender

      - uses: astral-sh/setup-uv@v6

      - name: Restore Blender Python environment
        run: |
          python - <<'PY'
          import json, os
          from tools.blender_python_env import prepare
          prepared = prepare('.image2outfit/blender/blender')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as stream:
              stream.write(f"PYTHONPATH={prepared.environment['PYTHONPATH']}\n")
          print(json.dumps(prepared.report, ensure_ascii=False, indent=2))
          PY

      - name: Generate Blend, FBX, Prefabs, textures, and five-view evidence
        run: |
          set -euo pipefail
          BUILD_SCRIPT="$(python -c 'import json; print(json.load(open("config/products/siroino-military-sheer-romper-large/job.json"))["buildScript"])')"
          .image2outfit/blender/blender --python-use-system-env --background --factory-startup --python-exit-code 1 \
            --python "$BUILD_SCRIPT" -- \
            --job config/products/siroino-military-sheer-romper-large/job.json

      - name: Render pose evidence
        run: |
          set -euo pipefail
          .image2outfit/blender/blender --python-use-system-env --background \
            Assets/GenWorks/siroino-military-sheer-romper-large/Source/Blender/SiroinoMilitarySheerRomperLarge.blend \
            --python-exit-code 1 --python tools/siroino_military_sheer_romper_pose.py -- \
            --job config/products/siroino-military-sheer-romper-large/job.json

      - name: Refresh hashes and commit generated checkpoint
        run: |
          set -euo pipefail
          python tools/update_product_hashes.py --root Assets/GenWorks/siroino-military-sheer-romper-large
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Assets/GenWorks/siroino-military-sheer-romper-large
          git diff --cached --stat
          git commit -m "Materialize smooth military sheer-back romper checkpoint"
          git push origin HEAD:feat/siroino-military-sheer-romper-large
