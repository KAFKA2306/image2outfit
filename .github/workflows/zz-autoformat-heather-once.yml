name: One-time Ruff format for heather integration

on:
  push:
    branches:
      - wip/heather-pre-unity-v10

permissions:
  contents: write

jobs:
  format-and-remove-self:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wip/heather-pre-unity-v10
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.32"
      - name: Format changed Python and remove this temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          mapfile -t files < <(git diff --name-only origin/main...HEAD -- '*.py')
          uv run --locked --no-default-groups --group dev ruff format "${files[@]}"
          rm .github/workflows/zz-autoformat-heather-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Format heather integration Python"
          git push origin HEAD:wip/heather-pre-unity-v10
