name: Ruff format diagnostic

on:
  push:
    branches:
      - fix/issue-429-candidate-manifest-schema

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: '0.11.32'
      - name: Format changed Python files
        run: |
          uv run --locked --no-default-groups --group dev ruff format \
            tests/test_candidate_manifest.py \
            tests/test_production_gate.py \
            tests/test_release_packager.py \
            tools/audit_repository_hygiene.py \
            tools/candidate_manifest.py \
            tools/contract_io.py
      - name: Upload exact formatted files
        uses: actions/upload-artifact@v4
        with:
          name: ruff-formatted-python
          path: |
            tests/test_candidate_manifest.py
            tests/test_production_gate.py
            tests/test_release_packager.py
            tools/audit_repository_hygiene.py
            tools/candidate_manifest.py
            tools/contract_io.py
          retention-days: 1
