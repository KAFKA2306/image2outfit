name: Fix review console import

on:
  push:
    branches:
      - agent/uiux-2026-review-console-v2
    paths:
      - ".github/workflows/fix-review-console-import.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/uiux-2026-review-console-v2
      - name: Remove unused import and self-delete
        run: |
          sed -i '/^import html$/d' tools/review_console.py
          rm .github/workflows/fix-review-console-import.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/review_console.py .github/workflows/fix-review-console-import.yml
          git commit -m "Remove unused review console import"
          git push origin HEAD:agent/uiux-2026-review-console-v2
