name: Archive every blue happi render artifact

on:
  push:
    branches:
      - chore/196-archive-all-blue-happi-renders
    paths:
      - .github/workflows/archive-all-blue-happi-render-artifacts.yml

permissions:
  actions: read
  contents: write

concurrency:
  group: archive-all-blue-happi-render-artifacts
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/196-archive-all-blue-happi-renders
          fetch-depth: 0

      - name: Enumerate and archive every render-bearing artifact
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_BRANCH: feat/196-siroino-blue-happi
          WORKFLOW_ID: '325326995'
          PRODUCT_ID: siroino-blue-happi
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          import shutil
          import subprocess
          import tempfile
          import urllib.parse
          import urllib.request
          import zipfile
          from pathlib import Path, PurePosixPath
          from typing import Any

          repository = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          source_branch = os.environ['SOURCE_BRANCH']
          workflow_id = os.environ['WORKFLOW_ID']
          product_id = os.environ['PRODUCT_ID']
          api_root = f'https://api.github.com/repos/{repository}'
          root = Path.cwd()
          evidence_root = root / f'Assets/GenWorks/{product_id}/Evidence'
          rejected_root = evidence_root / 'Rejected'
          rejected_root.mkdir(parents=True, exist_ok=True)
          artifact_prefix = f'image2outfit-hosted-{product_id}-'
          image_suffixes = {'.png', '.webp', '.jpg', '.jpeg'}

          def api_get(url: str) -> dict[str, Any]:
              request = urllib.request.Request(
                  url,
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'image2outfit-render-archive',
                  },
              )
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)

          def paged_values(url: str, key: str) -> list[dict[str, Any]]:
              values: list[dict[str, Any]] = []
              page = 1
              while True:
                  separator = '&' if '?' in url else '?'
                  payload = api_get(f'{url}{separator}per_page=100&page={page}')
                  batch = payload.get(key, [])
                  values.extend(batch)
                  if len(batch) < 100:
                      return values
                  page += 1

          def safe_extract(zip_path: Path, destination: Path) -> None:
              destination_resolved = destination.resolve()
              with zipfile.ZipFile(zip_path) as archive:
                  for member in archive.infolist():
                      target = (destination / member.filename).resolve()
                      if destination_resolved not in target.parents and target != destination_resolved:
                          raise RuntimeError(f'unsafe archive member: {member.filename}')
                  archive.extractall(destination)

          def digest(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          query = urllib.parse.urlencode({'branch': source_branch})
          runs = paged_values(
              f'{api_root}/actions/workflows/{workflow_id}/runs?{query}',
              'workflow_runs',
          )
          runs.sort(key=lambda run: int(run['id']))

          index_entries: list[dict[str, Any]] = []
          archived_count = 0
          existing_count = 0
          no_image_count = 0
          expired_count = 0

          with tempfile.TemporaryDirectory(prefix='blue-happi-render-archive-') as temporary:
              temporary_root = Path(temporary)
              for run in runs:
                  run_id = int(run['id'])
                  artifacts = paged_values(
                      f'{api_root}/actions/runs/{run_id}/artifacts?',
                      'artifacts',
                  )
                  matching = [
                      artifact
                      for artifact in artifacts
                      if str(artifact.get('name', '')).startswith(artifact_prefix)
                  ]
                  if not matching:
                      index_entries.append(
                          {
                              'runId': run_id,
                              'headSha': run.get('head_sha'),
                              'workflowConclusion': run.get('conclusion'),
                              'archiveStatus': 'NO_MATCHING_ARTIFACT',
                          }
                      )
                      continue

                  for artifact_number, artifact in enumerate(matching, start=1):
                      artifact_id = int(artifact['id'])
                      if artifact.get('expired'):
                          expired_count += 1
                          index_entries.append(
                              {
                                  'runId': run_id,
                                  'headSha': run.get('head_sha'),
                                  'workflowConclusion': run.get('conclusion'),
                                  'artifactId': artifact_id,
                                  'artifactName': artifact.get('name'),
                                  'archiveStatus': 'ARTIFACT_EXPIRED',
                              }
                          )
                          continue

                      archive_path = temporary_root / f'{run_id}-{artifact_id}.zip'
                      extraction_root = temporary_root / f'{run_id}-{artifact_id}'
                      extraction_root.mkdir()
                      subprocess.run(
                          [
                              'curl',
                              '--fail-with-body',
                              '--location',
                              '--retry',
                              '4',
                              '--retry-all-errors',
                              '-H',
                              f'Authorization: Bearer {token}',
                              '-H',
                              'Accept: application/vnd.github+json',
                              '-H',
                              'X-GitHub-Api-Version: 2022-11-28',
                              f'{api_root}/actions/artifacts/{artifact_id}/zip',
                              '--output',
                              str(archive_path),
                          ],
                          check=True,
                      )
                      safe_extract(archive_path, extraction_root)

                      product_root = extraction_root / f'Assets/GenWorks/{product_id}'
                      previews = product_root / 'Previews'
                      image_files = (
                          sorted(
                              path
                              for path in previews.rglob('*')
                              if path.is_file() and path.suffix.lower() in image_suffixes
                          )
                          if previews.is_dir()
                          else []
                      )
                      if not image_files:
                          no_image_count += 1
                          index_entries.append(
                              {
                                  'runId': run_id,
                                  'headSha': run.get('head_sha'),
                                  'workflowConclusion': run.get('conclusion'),
                                  'artifactId': artifact_id,
                                  'artifactName': artifact.get('name'),
                                  'artifactDigest': artifact.get('digest'),
                                  'archiveStatus': 'NO_RENDER_IMAGES_IN_ARTIFACT',
                              }
                          )
                          continue

                      suffix = '' if len(matching) == 1 else f'-artifact-{artifact_number}'
                      destination = rejected_root / f'run-{run_id}{suffix}'
                      if destination.exists():
                          existing_count += 1
                          status = 'ALREADY_ARCHIVED'
                      else:
                          destination.mkdir(parents=True)
                          shutil.copytree(previews, destination / 'Previews')
                          build_evidence = product_root / 'Evidence/Build'
                          if build_evidence.is_dir():
                              shutil.copytree(build_evidence, destination / 'Build')

                          copied_files = sorted(
                              path for path in destination.rglob('*') if path.is_file()
                          )
                          hashes = {
                              path.relative_to(destination).as_posix(): digest(path)
                              for path in copied_files
                          }
                          checkpoint = {
                              'schemaVersion': 1,
                              'productId': product_id,
                              'status': 'ARCHIVED_UNREVIEWED',
                              'releaseCandidate': False,
                              'sourceWorkflow': {
                                  'workflowId': int(workflow_id),
                                  'runId': run_id,
                                  'runAttempt': run.get('run_attempt'),
                                  'event': run.get('event'),
                                  'conclusion': run.get('conclusion'),
                                  'headBranch': run.get('head_branch'),
                                  'headSha': run.get('head_sha'),
                                  'createdAt': run.get('created_at'),
                                  'updatedAt': run.get('updated_at'),
                              },
                              'sourceArtifact': {
                                  'id': artifact_id,
                                  'name': artifact.get('name'),
                                  'digest': artifact.get('digest'),
                                  'sizeInBytes': artifact.get('size_in_bytes'),
                                  'createdAt': artifact.get('created_at'),
                                  'expiresAt': artifact.get('expires_at'),
                              },
                              'renderEvidence': {
                                  'imageCount': len(image_files),
                                  'images': [
                                      path.relative_to(previews).as_posix()
                                      for path in image_files
                                  ],
                                  'fileSha256': hashes,
                              },
                              'reviewDisposition': {
                                  'status': 'UNREVIEWED_ARCHIVED',
                                  'note': (
                                      'This historical render is committed for complete provenance. '
                                      'It is not approved and must not satisfy the active visual-review gate.'
                                  ),
                              },
                          }
                          (destination / 'render-checkpoint.json').write_text(
                              json.dumps(checkpoint, ensure_ascii=False, indent=2) + '\n',
                              encoding='utf-8',
                          )
                          (destination / 'README.md').write_text(
                              f'# Historical render checkpoint: run {run_id}\n\n'
                              f'- Workflow conclusion: `{run.get("conclusion")}`\n'
                              f'- Source commit: `{run.get("head_sha")}`\n'
                              f'- Artifact: `{artifact.get("name")}` (`{artifact_id}`)\n'
                              f'- Render image count: `{len(image_files)}`\n\n'
                              'This directory preserves a historical Blender render set that '
                              'previously existed only as a GitHub Actions artifact. It is '
                              '**unreviewed archived evidence**, not an approved preview or release candidate.\n',
                              encoding='utf-8',
                          )
                          archived_count += 1
                          status = 'ARCHIVED_NOW'

                      index_entries.append(
                          {
                              'runId': run_id,
                              'headSha': run.get('head_sha'),
                              'workflowConclusion': run.get('conclusion'),
                              'artifactId': artifact_id,
                              'artifactName': artifact.get('name'),
                              'artifactDigest': artifact.get('digest'),
                              'renderImageCount': len(image_files),
                              'repositoryPath': destination.relative_to(root).as_posix(),
                              'archiveStatus': status,
                          }
                      )

          index = {
              'schemaVersion': 1,
              'productId': product_id,
              'sourceWorkflowId': int(workflow_id),
              'sourceBranch': source_branch,
              'workflowRunCount': len(runs),
              'summary': {
                  'artifactsArchivedNow': archived_count,
                  'artifactsAlreadyArchived': existing_count,
                  'artifactsWithoutRenderImages': no_image_count,
                  'expiredArtifacts': expired_count,
              },
              'entries': index_entries,
          }
          (evidence_root / 'render-run-index.json').write_text(
              json.dumps(index, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(index['summary'], indent=2))
          if archived_count == 0:
              print('No omitted render-bearing artifacts required archival.')
          PY

      - name: Remove one-time workflow and commit archive
        run: |
          set -euo pipefail
          rm .github/workflows/archive-all-blue-happi-render-artifacts.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            Assets/GenWorks/siroino-blue-happi/Evidence \
            .github/workflows/archive-all-blue-happi-render-artifacts.yml
          git diff --cached --stat
          git commit -m 'Archive every historical blue happi render artifact'
          git push origin HEAD:chore/196-archive-all-blue-happi-renders
