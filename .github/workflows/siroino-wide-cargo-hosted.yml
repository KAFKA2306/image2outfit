name: Build Siroino Wide Cargo Hosted

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/run/siroino-wide-cargo-hosted.txt

permissions:
  contents: write

concurrency:
  group: image2outfit-siroino-wide-cargo-hosted
  cancel-in-progress: true

jobs:
  blender:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Blender runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xz-utils libxi6 libxrender1 libxfixes3 libxkbcommon0 libsm6 \
            libgl1 libegl1 libx11-6 libxxf86vm1

      - name: Download pinned Blender 4.4.3
        run: |
          set -euo pipefail
          url="https://download.blender.org/release/Blender4.4/blender-4.4.3-linux-x64.tar.xz"
          curl --fail --location --retry 4 --retry-all-errors "$url" --output blender.tar.xz
          mkdir -p .image2outfit/blender
          tar -xJf blender.tar.xz --strip-components=1 -C .image2outfit/blender
          .image2outfit/blender/blender --background --factory-startup --python-expr \
            "import bpy,platform; assert bpy.app.version_string.split()[0]=='4.4.3'; assert platform.python_version()=='3.11.11'; print(bpy.app.version_string, platform.python_version())"

      - name: Restore pinned Blender Python packages
        run: |
          set -euo pipefail
          python_exe=".image2outfit/blender/4.4/python/bin/python3.11"
          "$python_exe" -m ensurepip
          "$python_exe" -m pip install --disable-pip-version-check --no-deps --only-binary=:all: -r config/blender-python-requirements.txt
          "$python_exe" -c "import PIL,importlib.metadata; assert importlib.metadata.version('Pillow')=='12.3.0'; print(PIL.__version__)"

      - name: Generate actual product meshes and previews
        run: |
          set -euo pipefail
          mkdir -p Artifacts/siroino-wide-cargo
          .image2outfit/blender/blender \
            --background \
            --factory-startup \
            --python-exit-code 1 \
            --python tools/siroino_wide_cargo_entry.py \
            -- \
            --job config/siroino-wide-cargo-job.json \
            | tee Artifacts/siroino-wide-cargo/hosted-blender.log

      - name: Render exact-body release-policy poses
        run: |
          set -euo pipefail
          .image2outfit/blender/blender \
            --background Assets/GenWorks/Products/siroino-wide-cargo/Source/Blender/SiroinoWideCargo.blend \
            --python-exit-code 1 \
            --python tools/siroino_required_pose_render.py \
            -- \
            --job config/siroino-wide-cargo-job.json \
            | tee Artifacts/siroino-wide-cargo/hosted-poses.log

      - name: Mark hosted Blender gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('Assets/GenWorks/Products/siroino-wide-cargo/ProductManifest.json')
          data = json.loads(path.read_text(encoding='utf-8-sig'))
          data['status'] = 'MODELED'
          data['technicalGates'] = {
              'blender': 'PASS',
              'uvMapping': 'PASS',
              'exactBodyPoseRenders': 'PASS',
              'unityImport': 'PENDING',
              'modularAvatar': 'PENDING',
              'vrchatBuildAndTest': 'PENDING',
              'humanVisualReview': 'PENDING',
              'humanPoseReview': 'PENDING',
              'humanRuntimeReview': 'PENDING',
          }
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          python tools/update_product_hashes.py --root Assets/GenWorks/Products/siroino-wide-cargo

      - name: Commit modeled product assets
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f Assets/GenWorks/Products/siroino-wide-cargo
          git commit -m "Model Siroino wide cargo outfit"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 3))
          done
          exit 1

      - name: Upload modeled product evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: siroino-wide-cargo-hosted-${{ github.run_id }}
          path: |
            Artifacts/siroino-wide-cargo
            Assets/GenWorks/Products/siroino-wide-cargo
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
