name: One-time canonical GenWorks layout PR

on:
  pull_request:
    branches: [main]
    paths:
      - .github/run/genworks-layout-pr.txt

permissions:
  contents: write

concurrency:
  group: image2outfit-genworks-canonical-layout-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  migrate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Add an explicit skip contract for repository-wide product migrations
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/build-product-hosted.yml')
          text = path.read_text(encoding='utf-8')
          needle = '  blender:\n    runs-on: ubuntu-latest\n'
          replacement = (
              '  blender:\n'
              '    if: >-\n'
              "      github.event_name == 'workflow_dispatch' ||\n"
              "      (github.event_name == 'pull_request' && github.head_ref != 'agent/genworks-canonical-layout') ||\n"
              "      (github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip-hosted-product-build]'))\n"
              '    runs-on: ubuntu-latest\n'
          )
          if needle not in text:
              raise SystemExit('Hosted Blender job anchor not found')
          path.write_text(text.replace(needle, replacement, 1), encoding='utf-8', newline='')
          PY

      - name: Migrate and validate canonical product layout
        shell: bash
        run: |
          set -euo pipefail
          python tools/migrate_genworks_layout_once.py
          for job in config/products/*/job.json; do
            product_id="$(basename "$(dirname "$job")")"
            python tools/update_product_hashes.py --root "Assets/GenWorks/${product_id}"
          done
          python -m compileall -q tools tests
          python tools/audit_genworks_layout.py
          python tools/audit_repository_hygiene.py
          python -m unittest discover -s tests -v
          git diff --check

      - name: Commit the migration and remove one-time machinery
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git rm -f \
            .github/run/genworks-layout.txt \
            .github/run/genworks-layout-pr.txt \
            .github/workflows/one-time-genworks-canonical-layout.yml \
            .github/workflows/one-time-genworks-layout-trigger.yml \
            tools/migrate_genworks_layout_once.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: standardize GenWorks slug and Prefab layout'
          git pull --rebase origin "$HEAD_BRANCH"
          git push origin "HEAD:$HEAD_BRANCH"
