name: One-time format rendered completion scope

on:
  push:
    branches:
      - policy/render-visual-completion-merge

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: policy/render-visual-completion-merge
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.32"
      - name: Format changed Python and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          uv run --locked --no-default-groups --group dev ruff format \
            tools/production_contract.py \
            tests/test_production_contract.py \
            tests/test_final_repository_state.py
          rm .github/workflows/zz-format-render-scope-once.yml
          rm -f .format-render-scope-trigger
          uv run --locked --no-default-groups --group dev ruff format --check \
            tools/production_contract.py \
            tests/test_production_contract.py \
            tests/test_final_repository_state.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Format rendered completion scope"
          git push origin HEAD:policy/render-visual-completion-merge
