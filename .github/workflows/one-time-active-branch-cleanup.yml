name: One-time active branch cleanup

on:
  push:
    paths:
      - .github/workflows/one-time-active-branch-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete branches without unique commits
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          branches=(
            'fix/modular-avatar-prefab-output'
            'agent/siroino-lace-halter-large-final'
            'fix/generated-prefab-modular-avatar'
          )
          for branch in "${branches[@]}"; do
            if gh api "repos/${REPOSITORY}/git/ref/heads/${branch}" >/dev/null 2>&1; then
              gh api --method DELETE "repos/${REPOSITORY}/git/refs/heads/${branch}"
              echo "deleted ${branch}"
            else
              echo "already absent ${branch}"
            fi
          done
