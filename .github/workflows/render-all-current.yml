name: Render all current products to Pages

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/render-all-current.yml
      - config/products/**
      - config/pipeline/**
      - config/toolchain-lock.json
      - Assets/GenWorks/**/ProductManifest.json
      - Assets/GenWorks/**/Source/**
      - Assets/GenWorks/**/Previews/**
      - Assets/GenWorks/**/Evidence/Rejected/**/Previews/**
      - src/image2outfit/**
      - tools/**
      - pyproject.toml
      - uv.lock
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  pages: write
  id-token: write

jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      render_required: ${{ steps.scope.outputs.render_required }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: scope
        name: Classify Pages change
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "render_required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only HEAD^ HEAD > /tmp/pages-changed.txt
          if grep -Eq '^(config/products/|config/pipeline/|config/toolchain-lock\.json$|Assets/GenWorks/[^/]+/(ProductManifest\.json|Source/|Previews/|Evidence/Rejected/)|src/image2outfit/|tools/(?!review_console\.py$|render_all_current\.py$))' /tmp/pages-changed.txt; then
            echo "render_required=true" >> "$GITHUB_OUTPUT"
          else
            echo "render_required=false" >> "$GITHUB_OUTPUT"
          fi
          cat /tmp/pages-changed.txt

  render-and-deploy:
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: '0.11.32'
          enable-cache: true
      - name: Install Blender runtime libraries
        if: needs.classify.outputs.render_required == 'true'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xz-utils libxi6 libxrender1 libxfixes3 libxkbcommon0 libsm6 libgl1 libegl1 libx11-6 libxxf86vm1
      - name: Download pinned Blender
        if: needs.classify.outputs.render_required == 'true'
        run: |
          BLENDER_VERSION="$(python -c "import json; print(json.load(open('config/toolchain-lock.json'))['blender']['version'])")"
          BLENDER_SERIES="${BLENDER_VERSION%.*}"
          curl --fail --location --retry 4 --retry-all-errors "https://download.blender.org/release/Blender${BLENDER_SERIES}/blender-${BLENDER_VERSION}-linux-x64.tar.xz" -o blender.tar.xz
          mkdir -p .image2outfit/blender
          tar -xJf blender.tar.xz --strip-components=1 -C .image2outfit/blender
          echo "IMAGE2OUTFIT_BLENDER=$PWD/.image2outfit/blender/blender" >> "$GITHUB_ENV"
      - name: Prepare Blender Python environment
        if: needs.classify.outputs.render_required == 'true'
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from tools.blender_python_env import prepare
          p = prepare('.image2outfit/blender/blender')
          paths = [str((Path.cwd()/'tools').resolve()), str((Path.cwd()/'src').resolve()), p.environment['PYTHONPATH']]
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f"PYTHONPATH={os.pathsep.join(paths)}\n")
          PY
      - name: Render and capture every canonical product
        if: needs.classify.outputs.render_required == 'true'
        run: python tools/render_all_current.py --blender "$IMAGE2OUTFIT_BLENDER" --summary .image2outfit/render-current-summary.json --site _site
      - name: Build Pages from tracked canonical evidence
        if: needs.classify.outputs.render_required != 'true'
        run: python tools/render_all_current.py --site-only --summary .image2outfit/render-current-summary.json --site _site
      - name: Audit repository contracts
        run: |
          python tools/audit_genworks_layout.py
          python tools/audit_repository_hygiene.py
      - name: Delete previous render evidence artifact
        if: needs.classify.outputs.render_required == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const name = 'image2outfit-current-all-products';
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            for (const artifact of artifacts) {
              if (artifact.name === name) {
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id,
                });
              }
            }
      - name: Upload render evidence
        if: needs.classify.outputs.render_required == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: image2outfit-current-all-products
          path: |
            .image2outfit/render-current-summary.json
            Assets/GenWorks/**/ProductManifest.json
            Assets/GenWorks/**/Previews/**
            Assets/GenWorks/**/Evidence/Rejected/**/Previews/**
          if-no-files-found: error
          overwrite: true
          retention-days: 1
      - name: Report io WebP coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          catalog = json.loads(Path('_site/io/catalog.json').read_text(encoding='utf-8'))
          missing = [p['productId'] for p in catalog['products'] if p['webpCount'] == 0]
          print(f"io_products={catalog['productCount']} io_webp={catalog['webpCount']} missing={missing}")
          if missing:
              raise SystemExit(f"io WebP coverage incomplete: {missing}")
          for product in catalog['products']:
              for asset in product['assets']:
                  if not asset['href'].endswith('.webp'):
                      raise SystemExit(f"non-WebP io asset: {asset}")
                  if not (Path('_site') / asset['href']).is_file():
                      raise SystemExit(f"missing io asset: {asset['href']}")
          PY
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
