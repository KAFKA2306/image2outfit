name: Build product renders on hosted runner

on:
  workflow_dispatch:
    inputs:
      job_path:
        description: Tracked product job at config/products/<product-id>/job.json
        required: true
        type: string
  pull_request:
    paths:
      - .github/workflows/build-product-hosted.yml
      - config/products/**
      - tools/build_product_from_seed_blend.py
      - tools/genworks_product_common.py
      - tools/**/*_build.py
      - config/blender-python-requirements.txt

permissions:
  contents: read

concurrency:
  group: image2outfit-hosted-${{ github.event.pull_request.number || inputs.job_path }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tracked product job and seed
        shell: bash
        env:
          DISPATCH_JOB_PATH: ${{ inputs.job_path }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          job_path="${DISPATCH_JOB_PATH:-}"
          if [[ -z "$job_path" ]]; then
            git fetch origin "$BASE_REF" --depth=1
            mapfile -t changed < <(git diff --name-only "origin/$BASE_REF...HEAD" -- 'config/products/*/job.json' | sort -u)
            if [[ ${#changed[@]} -ne 1 ]]; then
              printf 'Pull request must change exactly one product job; found %s: %s\n' "${#changed[@]}" "${changed[*]}" >&2
              exit 1
            fi
            job_path="${changed[0]}"
          fi
          [[ "$job_path" =~ ^config/products/[A-Za-z0-9._-]+/job\.json$ ]] || {
            echo 'job_path must match config/products/<product-id>/job.json' >&2
            exit 1
          }
          test -f "$job_path"
          product_dir="$(dirname "$job_path")"
          seed_path="$product_dir/hosted-seed.json"
          test -f "$seed_path" || {
            echo "Hosted seed config not found: $seed_path" >&2
            exit 1
          }
          python - "$job_path" "$seed_path" >> "$GITHUB_ENV" <<'PY'
          import json
          import sys
          from pathlib import Path
          job_path = Path(sys.argv[1])
          seed_path = Path(sys.argv[2])
          job = json.loads(job_path.read_text(encoding='utf-8-sig'))
          product_id = job_path.parent.name
          if job.get('schemaVersion') != 2 or job.get('id') != product_id:
              raise SystemExit('Invalid product namespace or schemaVersion')
          if job.get('productRoot') != f'Assets/GenWorks/Products/{product_id}':
              raise SystemExit('productRoot does not match product namespace')
          print(f'TRACKED_JOB_PATH={job_path.as_posix()}')
          print(f'SEED_CONFIG_PATH={seed_path.as_posix()}')
          print(f'JOB_ID={product_id}')
          print(f'PRODUCT_ROOT={job["productRoot"]}')
          print(f'ARTIFACT_DIR={job["artifactDir"]}')
          PY

      - name: Install Blender runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xz-utils libxi6 libxrender1 libxfixes3 libxkbcommon0 libsm6 \
            libgl1 libegl1 libx11-6 libxxf86vm1

      - name: Download pinned Blender 4.4.3
        run: |
          set -euo pipefail
          url='https://download.blender.org/release/Blender4.4/blender-4.4.3-linux-x64.tar.xz'
          curl --fail --location --retry 4 --retry-all-errors "$url" --output blender.tar.xz
          mkdir -p .image2outfit/blender
          tar -xJf blender.tar.xz --strip-components=1 -C .image2outfit/blender
          .image2outfit/blender/blender --background --factory-startup --python-expr \
            "import bpy,platform; assert bpy.app.version_string.split()[0]=='4.4.3'; assert platform.python_version()=='3.11.11'; print(bpy.app.version_string, platform.python_version())"

      - name: Restore pinned Blender Python packages
        run: |
          set -euo pipefail
          python_exe='.image2outfit/blender/4.4/python/bin/python3.11'
          "$python_exe" -m ensurepip
          "$python_exe" -m pip install --disable-pip-version-check --no-deps --only-binary=:all: -r config/blender-python-requirements.txt
          "$python_exe" -c "import PIL,importlib.metadata; assert importlib.metadata.version('Pillow')=='12.3.0'; print(PIL.__version__)"

      - name: Build FBX, Prefab, five views, and pose renders
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT_DIR"
          .image2outfit/blender/blender \
            --background \
            --factory-startup \
            --python-exit-code 1 \
            --python tools/build_product_from_seed_blend.py \
            -- \
            --job "$TRACKED_JOB_PATH" \
            --seed-config "$SEED_CONFIG_PATH" \
            | tee "$ARTIFACT_DIR/hosted-build.log"

      - name: Verify generated evidence
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          job = json.loads(Path(os.environ['TRACKED_JOB_PATH']).read_text(encoding='utf-8-sig'))
          artifact = Path(job['artifactDir'])
          report = json.loads((artifact / 'product-build-report.json').read_text(encoding='utf-8-sig'))
          if not report.get('passed'):
              raise SystemExit('product-build-report.json is not PASS')
          root = Path(job['productRoot'])
          required = [
              Path(job['fbxAssetPath']),
              Path(job['prefabAssetPath']),
              root / 'Previews' / f"{job['id']}-multiview.webp",
              root / 'Previews' / f"{job['id']}-pose-review.webp",
          ]
          for path in required:
              if not path.is_file() or path.stat().st_size <= 0:
                  raise SystemExit(f'Missing generated evidence: {path}')
          evidence = json.loads((artifact / 'hosted-target-evidence.json').read_text(encoding='utf-8-sig'))
          if evidence.get('profile') != 'Siroino _Large':
              raise SystemExit('Hosted build did not verify Siroino _Large')
          print(json.dumps({'passed': True, 'required': [str(path) for path in required]}, indent=2))
          PY

      - name: Upload product and render evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image2outfit-hosted-${{ env.JOB_ID }}-${{ github.run_id }}
          path: |
            ${{ env.PRODUCT_ROOT }}
            ${{ env.ARTIFACT_DIR }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
