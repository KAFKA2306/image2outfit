name: Build product with hosted Blender

on:
  workflow_dispatch:
    inputs:
      job_path:
        description: Tracked product job at config/products/<product-id>/job.json
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - config/products/**/job.json
      - config/pipeline/requests/**
      - Assets/GenWorks/**/Source/Patterns/**
      - .github/workflows/build-product-hosted.yml
  pull_request:
    branches: [main]
    paths:
      - config/products/**
      - config/pipeline/requests/**
      - Assets/GenWorks/**/Source/Patterns/**
      - src/image2outfit/**
      - tools/**
      - tests/test_pipeline_*.py
      - tests/test_reference_product_contract.py
      - .github/workflows/build-product-hosted.yml
      - pyproject.toml
      - uv.lock

env:
  STATUS_CONTEXT: image2outfit-hosted

permissions:
  actions: write
  contents: read
  statuses: write

concurrency:
  group: image2outfit-hosted-${{ inputs.job_path || github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  blender:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Publish pending commit status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' > /tmp/status.json
          import json, os
          print(json.dumps({
              'state': 'pending',
              'target_url': f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              'description': f"Hosted Blender run {os.environ['GITHUB_RUN_ID']}",
              'context': os.environ['STATUS_CONTEXT'],
          }))
          PY
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --data-binary @/tmp/status.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: '0.11.32'
          enable-cache: true

      - name: Resolve product build scope
        env:
          JOB_PATH_INPUT: ${{ inputs.job_path }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python tools/resolve_product_build_scope.py \
            --job-path "$JOB_PATH_INPUT" \
            --event-name "$EVENT_NAME" \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            --github-env "$GITHUB_ENV" \
            --include-pipeline-request

      - name: Compile and test pipeline contracts
        if: env.SKIP_PRODUCT_BUILD != 'true' && env.PIPELINE_MODE == 'true'
        run: |
          uv run --locked --no-default-groups python -m compileall -q src tools tests
          uv run --locked --no-default-groups python -m unittest \
            tests.test_pipeline_core \
            tests.test_pipeline_audit \
            tests.test_pipeline_resume \
            tests.test_reference_product_contract -v

      - name: Install Blender runtime libraries
        if: env.SKIP_PRODUCT_BUILD != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xz-utils libxi6 libxrender1 libxfixes3 libxkbcommon0 \
            libsm6 libgl1 libegl1 libx11-6 libxxf86vm1

      - name: Download pinned Blender
        if: env.SKIP_PRODUCT_BUILD != 'true'
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-all-errors \
            "https://download.blender.org/release/Blender${BLENDER_SERIES}/blender-${BLENDER_VERSION}-linux-x64.tar.xz" \
            --output blender.tar.xz
          mkdir -p .image2outfit/blender
          tar -xJf blender.tar.xz --strip-components=1 -C .image2outfit/blender
          echo "IMAGE2OUTFIT_BLENDER=$PWD/.image2outfit/blender/blender" >> "$GITHUB_ENV"

      - name: Restore pinned Blender Python environment
        if: env.SKIP_PRODUCT_BUILD != 'true'
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from tools.blender_python_env import prepare

          prepared = prepare('.image2outfit/blender/blender')
          paths = [
              str((Path.cwd() / 'tools').resolve()),
              str((Path.cwd() / 'src').resolve()),
              prepared.environment['PYTHONPATH'],
          ]
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as stream:
              stream.write(f"PYTHONPATH={os.pathsep.join(paths)}\n")
          print(json.dumps(prepared.report, ensure_ascii=False, indent=2))
          PY

      - name: Restore latest resumable state
        if: env.SKIP_PRODUCT_BUILD != 'true' && env.PIPELINE_MODE == 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.PRODUCT_RUNTIME }}
            ${{ env.PRODUCT_AUDIT }}
            ${{ env.PRODUCT_ROOT }}
          key: image2outfit-pipeline-${{ github.event.pull_request.number || github.ref_name }}-${{ env.JOB_ID }}-${{ github.run_id }}
          restore-keys: |
            image2outfit-pipeline-${{ github.event.pull_request.number || github.ref_name }}-${{ env.JOB_ID }}-

      - name: Reject stale checkpoint identity
        if: env.SKIP_PRODUCT_BUILD != 'true' && env.PIPELINE_MODE == 'true'
        run: |
          python - <<'PY'
          import json, os, shutil, subprocess
          from pathlib import Path

          checkpoint = Path(os.environ['CHECKPOINT_PATH'])
          if not checkpoint.is_file():
              print('No prior checkpoint restored.')
              raise SystemExit(0)
          request = json.loads(Path(os.environ['REQUEST_PATH']).read_text(encoding='utf-8'))
          state = json.loads(checkpoint.read_text(encoding='utf-8'))
          expected = {
              'product_id': request['productId'],
              'target_avatar': request['targetAvatar'],
              'source_reference': request['sourceReference'],
              'revision_id': request.get('revisionId', ''),
          }
          mismatches = {
              key: {'checkpoint': state.get(key), 'request': value}
              for key, value in expected.items()
              if state.get(key) != value
          }
          if not mismatches:
              print(
                  f"Restored {len(state.get('completed_stages', []))}/13 stages "
                  f"at {state.get('current_stage')} ({state.get('status')})."
              )
              raise SystemExit(0)
          print(f'Removing stale generated state: {mismatches}')
          shutil.rmtree(Path(os.environ['PRODUCT_RUNTIME']), ignore_errors=True)
          shutil.rmtree(Path(os.environ['PRODUCT_AUDIT']), ignore_errors=True)
          shutil.rmtree(Path(os.environ['PRODUCT_ROOT']), ignore_errors=True)
          subprocess.run(['git', 'checkout', '--', os.environ['PRODUCT_ROOT']], check=True)
          PY

      - name: Execute or resume canonical pipeline
        if: env.SKIP_PRODUCT_BUILD != 'true' && env.PIPELINE_MODE == 'true'
        id: pipeline
        run: |
          set +e
          mkdir -p "$PRODUCT_RUNTIME"
          args=(
            --execute
            --engine deterministic
            --request "$REQUEST_PATH"
            --checkpoint-output "$CHECKPOINT_PATH"
            --output "$CHECKPOINT_PATH"
          )
          if [[ -f "$CHECKPOINT_PATH" ]]; then
            cp "$CHECKPOINT_PATH" "${CHECKPOINT_PATH}.resume-input"
            args+=(--resume-state "${CHECKPOINT_PATH}.resume-input")
          fi
          uv run --locked --no-default-groups \
            python tools/run_garment_pipeline.py "${args[@]}" \
            | tee "$PRODUCT_RUNTIME/pipeline-console.log"
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Generate product assets directly
        if: env.SKIP_PRODUCT_BUILD != 'true' && env.PIPELINE_MODE != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$REPORT_DIR"
          .image2outfit/blender/blender --python-use-system-env --background \
            --factory-startup --python-exit-code 1 --python "$BUILD_SCRIPT" \
            -- --job "$JOB_PATH" | tee "$REPORT_DIR/hosted-blender.log"

      - name: Render configured verification poses
        if: env.SKIP_PRODUCT_BUILD != 'true' && env.PIPELINE_MODE != 'true' && env.HOSTED_POSE_SCRIPT != ''
        run: |
          set -euo pipefail
          .image2outfit/blender/blender --python-use-system-env --background \
            "$BLEND_PATH" --python-exit-code 1 --python "$HOSTED_POSE_SCRIPT" \
            -- --job "$JOB_PATH" | tee "$REPORT_DIR/hosted-poses.log"

      - name: Update generated product hashes
        if: env.SKIP_PRODUCT_BUILD != 'true' && always()
        run: |
          if [[ -d "$PRODUCT_ROOT" ]]; then
            python tools/update_product_hashes.py --root "$PRODUCT_ROOT"
          fi

      - name: Audit repository contracts
        if: always()
        run: |
          python tools/audit_genworks_layout.py
          python tools/audit_repository_hygiene.py

      - name: Summarize pipeline checkpoint
        if: env.SKIP_PRODUCT_BUILD != 'true' && env.PIPELINE_MODE == 'true' && always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          path = Path(os.environ['CHECKPOINT_PATH'])
          if not path.is_file():
              print('Pipeline did not create a checkpoint.')
              raise SystemExit(0)
          state = json.loads(path.read_text(encoding='utf-8'))
          completed = state.get('completed_stages', [])
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a', encoding='utf-8') as stream:
              stream.write('## Canonical garment pipeline\n\n')
              stream.write(f"- Product: `{state.get('product_id')}`\n")
              stream.write(f"- Status: `{state.get('status')}`\n")
              stream.write(f"- Current stage: `{state.get('current_stage')}`\n")
              stream.write(f"- Completed: `{len(completed)}/13`\n")
              stream.write(f"- Resume count: `{state.get('resume_count', 0)}`\n")
              if state.get('errors'):
                  stream.write(f"- Last error: `{state['errors'][-1]}`\n")
          print(json.dumps(state, ensure_ascii=False, indent=2))
          PY

      - name: Save resumable pipeline state
        if: env.SKIP_PRODUCT_BUILD != 'true' && env.PIPELINE_MODE == 'true' && always()
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.PRODUCT_RUNTIME }}
            ${{ env.PRODUCT_AUDIT }}
            ${{ env.PRODUCT_ROOT }}
          key: image2outfit-pipeline-${{ github.event.pull_request.number || github.ref_name }}-${{ env.JOB_ID }}-${{ github.run_id }}

      - name: Delete previous hosted artifact
        if: always() && env.SKIP_PRODUCT_BUILD != 'true' && env.JOB_ID != ''
        uses: actions/github-script@v7
        env:
          ARTIFACT_NAME: image2outfit-hosted-${{ env.JOB_ID }}
        with:
          script: |
            const current = process.env.ARTIFACT_NAME;
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            for (const artifact of artifacts) {
              const suffix = artifact.name.startsWith(`${current}-`)
                ? artifact.name.slice(current.length + 1)
                : '';
              if (artifact.name === current || /^\d+$/.test(suffix)) {
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id,
                });
              }
            }

      - name: Upload generated product and evidence
        if: always() && env.SKIP_PRODUCT_BUILD != 'true' && env.JOB_ID != ''
        uses: actions/upload-artifact@v4
        with:
          name: image2outfit-hosted-${{ env.JOB_ID }}
          path: |
            ${{ env.REPORT_DIR }}/**/*.json
            ${{ env.PRODUCT_RUNTIME }}/**/*.json
            ${{ env.PRODUCT_AUDIT }}/**/*.json
            ${{ env.PRODUCT_ROOT }}/Models/**/*.fbx
            ${{ env.PRODUCT_ROOT }}/Prefab/**/*.prefab
            ${{ env.PRODUCT_ROOT }}/Previews/**/*.webp
            ${{ env.PRODUCT_ROOT }}/Textures/**/*.webp
            ${{ env.PRODUCT_ROOT }}/Source/Blender/*.blend
            ${{ env.PRODUCT_ROOT }}/ProductManifest.json
            ${{ env.PRODUCT_ROOT }}/SOURCE_HASHES.txt
          if-no-files-found: error
          overwrite: true
          retention-days: 1
          compression-level: 6

      - name: Enforce valid pipeline boundary
        if: env.SKIP_PRODUCT_BUILD != 'true' && env.PIPELINE_MODE == 'true' && always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          path = Path(os.environ['CHECKPOINT_PATH'])
          if not path.is_file():
              raise SystemExit('Pipeline checkpoint is missing')
          state = json.loads(path.read_text(encoding='utf-8'))
          if state.get('status') == 'EXECUTED':
              print('All thirteen stages executed.')
              raise SystemExit(0)
          completed = state.get('completed_stages', [])
          expected_review_boundary = (
              state.get('status') == 'FAILED'
              and state.get('current_stage') == 'visual-review'
              and len(completed) == 11
              and completed[-1:] == ['audit-geometry']
              and 'direct visual review' in state.get('errors', [''])[-1]
          )
          if expected_review_boundary:
              print(
                  'Technical generation reached the direct-image review boundary. '
                  'Artifacts are preserved for exact inspection and resume.'
              )
              raise SystemExit(0)
          raise SystemExit(
              f"Pipeline stopped unexpectedly at {state.get('current_stage')}: "
              f"{state.get('errors', ['unknown error'])[-1]}"
          )
          PY

      - name: Publish final commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          python - <<'PY' > /tmp/status.json
          import json, os
          passed = os.environ['JOB_STATUS'] == 'success'
          print(json.dumps({
              'state': 'success' if passed else 'failure',
              'target_url': f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              'description': f"Hosted Blender run {os.environ['GITHUB_RUN_ID']} · {os.environ['JOB_STATUS']}",
              'context': os.environ['STATUS_CONTEXT'],
          }))
          PY
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --data-binary @/tmp/status.json
  render-all-current:
    if: >-
      github.event_name == 'push' &&
      contains(github.event.head_commit.message, '[render-all-current]')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out canonical main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: '0.11.32'
          enable-cache: true

      - name: Install Blender runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xz-utils libxi6 libxrender1 libxfixes3 libxkbcommon0 \
            libsm6 libgl1 libegl1 libx11-6 libxxf86vm1

      - name: Download pinned Blender
        run: |
          set -euo pipefail
          BLENDER_VERSION="$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path('config/toolchain-lock.json').read_text())['blender']['version'])
          PY
          )"
          BLENDER_SERIES="${BLENDER_VERSION%.*}"
          curl --fail --location --retry 4 --retry-all-errors \
            "https://download.blender.org/release/Blender${BLENDER_SERIES}/blender-${BLENDER_VERSION}-linux-x64.tar.xz" \
            --output blender.tar.xz
          mkdir -p .image2outfit/blender
          tar -xJf blender.tar.xz --strip-components=1 -C .image2outfit/blender
          echo "IMAGE2OUTFIT_BLENDER=$PWD/.image2outfit/blender/blender" >> "$GITHUB_ENV"

      - name: Restore pinned Blender Python environment
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from tools.blender_python_env import prepare

          prepared = prepare('.image2outfit/blender/blender')
          paths = [
              str((Path.cwd() / 'tools').resolve()),
              str((Path.cwd() / 'src').resolve()),
              prepared.environment['PYTHONPATH'],
          ]
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as stream:
              stream.write(f"PYTHONPATH={os.pathsep.join(paths)}\n")
          PY

      - name: Render every canonical product at current completion
        run: |
          python tools/render_all_current.py \
            --blender "$IMAGE2OUTFIT_BLENDER" \
            --summary .image2outfit/render-current-summary.json \
            --site _site

      - name: Audit repository contracts
        run: |
          python tools/audit_genworks_layout.py
          python tools/audit_repository_hygiene.py

      - name: Upload current render evidence
        uses: actions/upload-artifact@v4
        with:
          name: image2outfit-current-all-products
          path: |
            .image2outfit/render-current-summary.json
            Assets/GenWorks/**/ProductManifest.json
            Assets/GenWorks/**/Previews/**
          if-no-files-found: warn
          overwrite: true
          retention-days: 1
          compression-level: 6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

