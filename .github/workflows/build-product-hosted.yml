name: Build product with hosted Blender

on:
  workflow_dispatch:
    inputs:
      job_path:
        description: Tracked product job at config/products/<product-id>/job.json
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - config/products/**/job.json
  pull_request:
    branches: [main]
    paths:
      - config/products/**/job.json
      - .github/workflows/build-product-hosted.yml
      - pyproject.toml
      - uv.lock
      - tools/blender_python_env.py
      - tools/siroino_wide_cargo_parametric_v*.py
      - Assets/GenWorks/Products/**

env:
  STATUS_CONTEXT: image2outfit-hosted

permissions:
  contents: read
  statuses: write

concurrency:
  group: image2outfit-hosted-${{ inputs.job_path || github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  blender:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish pending commit status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' > /tmp/status.json
          import json, os
          print(json.dumps({
              'state': 'pending',
              'target_url': f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              'description': f"Hosted Blender run {os.environ['GITHUB_RUN_ID']}",
              'context': os.environ['STATUS_CONTEXT'],
          }))
          PY
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --data-binary @/tmp/status.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve product build scope
        env:
          JOB_PATH_INPUT: ${{ inputs.job_path }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path

          root = Path.cwd().resolve()
          job_path_text = (os.environ.get('JOB_PATH_INPUT') or '').strip()
          if not job_path_text:
              if os.environ.get('EVENT_NAME') == 'pull_request':
                  command = ['git', 'diff', '--name-only', os.environ['PR_BASE_SHA'], os.environ['PR_HEAD_SHA']]
              else:
                  before = os.environ.get('EVENT_BEFORE', '')
                  sha = os.environ['EVENT_SHA']
                  command = ['git', 'diff', '--name-only', before, sha] if before and before != '0' * 40 else ['git', 'show', '--pretty=', '--name-only', sha]
              changed = sorted({
                  line.strip()
                  for line in subprocess.check_output(command, text=True).splitlines()
                  if re.fullmatch(r'config/products/[a-z0-9][a-z0-9._-]*/job\.json', line.strip())
              })
              if len(changed) != 1:
                  with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as stream:
                      stream.write('SKIP_PRODUCT_BUILD=true\n')
                  print(f'No unique product job selected: {changed}')
                  raise SystemExit(0)
              job_path_text = changed[0]

          if not re.fullmatch(r'config/products/[a-z0-9][a-z0-9._-]*/job\.json', job_path_text):
              raise SystemExit('job_path must match config/products/<product-id>/job.json')
          job_path = (root / job_path_text).resolve()
          if root not in job_path.parents or not job_path.is_file():
              raise SystemExit(f'product job not found: {job_path_text}')
          job = json.loads(job_path.read_text(encoding='utf-8-sig'))
          if job.get('schemaVersion') != 2:
              raise SystemExit('Only schemaVersion 2 jobs are accepted')
          product_id = job_path.parent.name
          product_root = str(job.get('productRoot', ''))
          allowed_roots = {
              f'Assets/GenWorks/{product_id}',
              f'Assets/GenWorks/Products/{product_id}',
          }
          if job.get('id') != product_id or product_root not in allowed_roots:
              raise SystemExit(f'product identity/root mismatch: {product_root}')
          prefab_pattern = re.compile(rf'^{re.escape(product_root)}/Prefab/[^/]+\.prefab$')
          for field in ('prefabAssetPath', 'integratedPrefabAssetPath'):
              value = str(job.get(field, ''))
              if value and not prefab_pattern.fullmatch(value):
                  raise SystemExit(f'{field} must match {product_root}/Prefab/*.prefab')
          required = ('artifactDir', 'buildScript', 'blendPath')
          missing = [name for name in required if not job.get(name)]
          if missing:
              raise SystemExit('job is missing: ' + ', '.join(missing))
          paths = {
              'SKIP_PRODUCT_BUILD': 'false',
              'JOB_PATH': job_path_text,
              'JOB_ID': product_id,
              'PRODUCT_ROOT': product_root,
              'ARTIFACT_DIR': job['artifactDir'],
              'BUILD_SCRIPT': job['buildScript'],
              'BLEND_PATH': job['blendPath'],
              'HOSTED_POSE_SCRIPT': job.get('hostedPoseScript', ''),
          }
          lock = json.loads(Path('config/toolchain-lock.json').read_text(encoding='utf-8'))
          version = lock['blender']['version']
          paths['BLENDER_VERSION'] = version
          paths['BLENDER_SERIES'] = '.'.join(version.split('.')[:2])
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as stream:
              for name, value in paths.items():
                  stream.write(f'{name}={value}\n')
          PY

      - name: Install Blender runtime libraries
        if: env.SKIP_PRODUCT_BUILD != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xz-utils libxi6 libxrender1 libxfixes3 libxkbcommon0 libsm6 libgl1 libegl1 libx11-6 libxxf86vm1

      - name: Download pinned Blender
        if: env.SKIP_PRODUCT_BUILD != 'true'
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-all-errors \
            "https://download.blender.org/release/Blender${BLENDER_SERIES}/blender-${BLENDER_VERSION}-linux-x64.tar.xz" \
            --output blender.tar.xz
          mkdir -p .image2outfit/blender
          tar -xJf blender.tar.xz --strip-components=1 -C .image2outfit/blender

      - uses: astral-sh/setup-uv@v6
        if: env.SKIP_PRODUCT_BUILD != 'true'

      - name: Restore pinned Blender Python environment
        if: env.SKIP_PRODUCT_BUILD != 'true'
        run: |
          python - <<'PY'
          import json, os
          from tools.blender_python_env import prepare
          prepared = prepare('.image2outfit/blender/blender')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as stream:
              stream.write(f"PYTHONPATH={prepared.environment['PYTHONPATH']}\n")
          print(json.dumps(prepared.report, ensure_ascii=False, indent=2))
          PY

      - name: Generate product assets and previews
        if: env.SKIP_PRODUCT_BUILD != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT_DIR"
          .image2outfit/blender/blender --python-use-system-env --background --factory-startup --python-exit-code 1 --python "$BUILD_SCRIPT" -- --job "$JOB_PATH" | tee "$ARTIFACT_DIR/hosted-blender.log"

      - name: Render configured verification poses
        if: env.SKIP_PRODUCT_BUILD != 'true' && env.HOSTED_POSE_SCRIPT != ''
        run: |
          set -euo pipefail
          .image2outfit/blender/blender --python-use-system-env --background "$BLEND_PATH" --python-exit-code 1 --python "$HOSTED_POSE_SCRIPT" -- --job "$JOB_PATH" | tee "$ARTIFACT_DIR/hosted-poses.log"

      - name: Update generated product hashes
        if: env.SKIP_PRODUCT_BUILD != 'true'
        run: python tools/update_product_hashes.py --root "$PRODUCT_ROOT"

      - name: Audit repository contracts
        run: |
          python tools/audit_genworks_layout.py
          python tools/audit_repository_hygiene.py

      - name: Upload generated product and evidence
        if: always() && env.SKIP_PRODUCT_BUILD != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: image2outfit-hosted-${{ env.JOB_ID }}-${{ github.run_id }}
          path: |
            ${{ env.ARTIFACT_DIR }}
            ${{ env.PRODUCT_ROOT }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Publish final commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          python - <<'PY' > /tmp/status.json
          import json, os
          passed = os.environ['JOB_STATUS'] == 'success'
          print(json.dumps({
              'state': 'success' if passed else 'failure',
              'target_url': f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              'description': f"Hosted Blender run {os.environ['GITHUB_RUN_ID']} · {os.environ['JOB_STATUS']}",
              'context': os.environ['STATUS_CONTEXT'],
          }))
          PY
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --data-binary @/tmp/status.json
