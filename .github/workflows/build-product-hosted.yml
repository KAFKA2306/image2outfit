name: Build product with hosted Blender

on:
  workflow_dispatch:
    inputs:
      job_path:
        description: Tracked product job at config/products/<product-id>/job.json
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - config/products/*/job.json

permissions:
  contents: read

concurrency:
  group: image2outfit-hosted-${{ inputs.job_path || github.ref }}
  cancel-in-progress: false

jobs:
  blender:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve, validate, and expose product job
        env:
          JOB_PATH_INPUT: ${{ inputs.job_path }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path

          root = Path.cwd().resolve()
          job_path_text = (os.environ.get('JOB_PATH_INPUT') or '').strip()
          if not job_path_text:
              before = os.environ.get('EVENT_BEFORE', '')
              sha = os.environ['EVENT_SHA']
              if before and before != '0' * 40:
                  command = ['git', 'diff', '--name-only', before, sha, '--', 'config/products/*/job.json']
              else:
                  command = ['git', 'show', '--pretty=', '--name-only', sha, '--', 'config/products/*/job.json']
              changed = [
                  line.strip()
                  for line in subprocess.check_output(command, text=True).splitlines()
                  if line.strip()
              ]
              changed = sorted(set(changed))
              if len(changed) != 1:
                  raise SystemExit(
                      'Push-triggered hosted build requires exactly one changed product job; '
                      f'found {changed}'
                  )
              job_path_text = changed[0]

          if not re.fullmatch(r'config/products/[a-z0-9][a-z0-9._-]*/job\.json', job_path_text):
              raise SystemExit('job_path must match config/products/<product-id>/job.json')
          job_path = (root / job_path_text).resolve()
          if root not in job_path.parents or not job_path.is_file():
              raise SystemExit(f'product job not found: {job_path_text}')
          job = json.loads(job_path.read_text(encoding='utf-8-sig'))
          if job.get('schemaVersion') != 2:
              raise SystemExit('Only schemaVersion 2 jobs are accepted')
          required = ('id', 'productRoot', 'artifactDir', 'buildScript', 'blendPath')
          missing = [name for name in required if not job.get(name)]
          if missing:
              raise SystemExit('job is missing: ' + ', '.join(missing))
          product_id = job_path.parent.name
          expected_root = f'Assets/GenWorks/Products/{product_id}'
          if job['id'] != product_id or job['productRoot'] != expected_root:
              raise SystemExit('product job identity does not match its namespace')
          paths = {
              'JOB_PATH': job_path_text,
              'JOB_ID': job['id'],
              'PRODUCT_ROOT': job['productRoot'],
              'ARTIFACT_DIR': job['artifactDir'],
              'BUILD_SCRIPT': job['buildScript'],
              'BLEND_PATH': job['blendPath'],
              'HOSTED_POSE_SCRIPT': job.get('hostedPoseScript', ''),
          }
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as stream:
              for name, value in paths.items():
                  stream.write(f'{name}={value}\n')
          lock = json.loads(Path('config/toolchain-lock.json').read_text(encoding='utf-8'))
          version = lock['blender']['version']
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as stream:
              stream.write(f'BLENDER_VERSION={version}\n')
              stream.write(f'BLENDER_SERIES={".".join(version.split(".")[:2])}\n')
          PY

      - name: Install Blender runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xz-utils libxi6 libxrender1 libxfixes3 libxkbcommon0 libsm6 libgl1 libegl1 libx11-6 libxxf86vm1

      - name: Download pinned Blender
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-all-errors \
            "https://download.blender.org/release/Blender${BLENDER_SERIES}/blender-${BLENDER_VERSION}-linux-x64.tar.xz" \
            --output blender.tar.xz
          mkdir -p .image2outfit/blender
          tar -xJf blender.tar.xz --strip-components=1 -C .image2outfit/blender

      - name: Restore Blender Python packages
        run: |
          python_exe=".image2outfit/blender/${BLENDER_SERIES}/python/bin/python3.11"
          "$python_exe" -m ensurepip
          "$python_exe" -m pip install --disable-pip-version-check --no-deps --only-binary=:all: -r config/blender-python-requirements.txt

      - name: Generate product assets and previews
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT_DIR"
          .image2outfit/blender/blender --background --factory-startup --python-exit-code 1 --python "$BUILD_SCRIPT" -- --job "$JOB_PATH" | tee "$ARTIFACT_DIR/hosted-blender.log"

      - name: Render configured verification poses
        if: env.HOSTED_POSE_SCRIPT != ''
        run: |
          set -euo pipefail
          .image2outfit/blender/blender --background "$BLEND_PATH" --python-exit-code 1 --python "$HOSTED_POSE_SCRIPT" -- --job "$JOB_PATH" | tee "$ARTIFACT_DIR/hosted-poses.log"

      - name: Audit generated product
        run: |
          python tools/update_product_hashes.py --root "$PRODUCT_ROOT"
          python tools/audit_genworks_layout.py
          python tools/audit_repository_hygiene.py

      - name: Upload generated product and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image2outfit-hosted-${{ env.JOB_ID }}-${{ github.run_id }}
          path: |
            ${{ env.ARTIFACT_DIR }}
            ${{ env.PRODUCT_ROOT }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
