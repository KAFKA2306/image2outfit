name: Query Siroino Workflow Status

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/run/query-siroino-status.txt

permissions:
  actions: read
  contents: write

concurrency:
  group: image2outfit-query-siroino-status
  cancel-in-progress: true

jobs:
  query:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Query recent runs and runners
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .github/status
          for workflow in siroino-wide-cargo-self-hosted.yml haolan-cow-hood.yml; do
            name="${workflow%.yml}"
            gh api \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?per_page=10" \
              --jq '{queriedAt: now | todate, runs: [.workflow_runs[] | {id, run_number, run_attempt, event, status, conclusion, head_sha, created_at, updated_at, html_url}]}' \
              > ".github/status/${name}-runs.json"
          done
          if gh api \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${GITHUB_REPOSITORY}/actions/runners?per_page=100" \
            --jq '{queriedAt: now | todate, total_count, runners: [.runners[] | {id, name, os, status, busy, labels: [.labels[].name]}]}' \
            > .github/status/self-hosted-runners.json; then
            true
          else
            printf '{"queriedAt":"%s","error":"runner inventory endpoint was unavailable to GITHUB_TOKEN"}\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .github/status/self-hosted-runners.json
          fi

      - name: Commit query result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/status/*-runs.json .github/status/self-hosted-runners.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Query Windows self-hosted workflow status"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 2))
          done
          exit 1
