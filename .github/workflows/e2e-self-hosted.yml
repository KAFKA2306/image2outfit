name: Build outfit candidate

on:
  workflow_dispatch:
    inputs:
      job_path:
        description: Repository-relative schemaVersion 2 job.json path
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: image2outfit-candidate-${{ github.repository }}
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: [self-hosted, windows, x64, image2outfit]
    timeout-minutes: 120

    steps:
      - name: Checkout tracked pipeline files without deleting licensed local sources
        uses: actions/checkout@v4
        with:
          clean: false
          persist-credentials: false
          fetch-depth: 1

      - uses: arduino/setup-task@v2

      - name: Validate v2 job
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $jobPath = '${{ inputs.job_path }}'
          $localPattern = '^Assets/_Local/Jobs/[A-Za-z0-9._-]+/job\.json$'
          $trackedPattern = '^config/products/[A-Za-z0-9._-]+/job\.json$'
          if ($jobPath -notmatch $localPattern -and $jobPath -notmatch $trackedPattern) {
            throw 'job_path must match Assets/_Local/Jobs/<job-id>/job.json or config/products/<product-id>/job.json'
          }
          if (-not (Test-Path -LiteralPath $jobPath -PathType Leaf)) { throw "Job file was not found: $jobPath" }
          $job = Get-Content -LiteralPath $jobPath -Raw | ConvertFrom-Json
          if ([int]$job.schemaVersion -ne 2) { throw 'Only schemaVersion 2 jobs are accepted' }
          foreach ($field in @('id', 'artifactDir', 'candidateDir', 'releaseDir', 'licenseEvidence')) {
            if ([string]::IsNullOrWhiteSpace([string]$job.$field)) { throw "job.json is missing required field: $field" }
          }
          "JOB_PATH=$jobPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "JOB_ID=$($job.id)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ARTIFACT_DIR=$($job.artifactDir)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CANDIDATE_DIR=$($job.candidateDir)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_DIR=$($job.releaseDir)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "IMAGE2OUTFIT_RUN_ID=$env:GITHUB_RUN_ID" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Restore pinned VPM packages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Command vpm -ErrorAction SilentlyContinue)) { throw 'The official VPM CLI is required on the image2outfit runner' }
          $repoOutput = (& vpm list repos 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) { throw "vpm list repos failed: $repoOutput" }
          foreach ($repo in @('https://vpm.nadena.dev/vpm.json', 'https://vpm.anatawa12.com/vpm.json')) {
            if ($repoOutput -notmatch [regex]::Escape($repo)) {
              & vpm add repo $repo
              if ($LASTEXITCODE -ne 0) { throw "Could not register required VPM repository: $repo" }
            }
          }
          & vpm resolve project .
          if ($LASTEXITCODE -ne 0) { throw 'vpm resolve project failed' }

      - name: Build technical candidate
        shell: pwsh
        run: task candidate JOB="$env:JOB_PATH"

      - name: Assert review boundary
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath $env:RELEASE_DIR) { throw 'Candidate workflow must not create Release/' }
          $audit = Get-Content -LiteralPath (Join-Path $env:ARTIFACT_DIR 'audit.json') -Raw | ConvertFrom-Json
          if ([string]$audit.decision -ne 'REVIEW_REQUIRED') { throw "Expected REVIEW_REQUIRED after technical build, got $($audit.decision)" }

      - name: Upload candidate and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image2outfit-candidate-${{ env.JOB_ID }}-${{ github.run_id }}
          path: |
            ${{ env.ARTIFACT_DIR }}
            ${{ env.CANDIDATE_DIR }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
