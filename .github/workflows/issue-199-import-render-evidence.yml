name: Restore Issue 199 Unity metadata

on:
  push:
    branches: [fix/issue-199-render-evidence-metadata]
    paths:
      - '.github/workflows/issue-199-import-render-evidence.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Restore tracked Unity metadata from pre-import parent
        run: |
          set -euo pipefail
          base=6b0a7b548b54e996d2b47bb6652f92b61ad6a31f
          mapfile -t paths < <(
            git ls-tree -r --name-only "$base" -- Assets/GenWorks/siroino-wide-cargo/Previews \
              | grep '\.meta$'
          )
          test "${#paths[@]}" -gt 0
          git checkout "$base" -- "${paths[@]}"
          git add Assets/GenWorks/siroino-wide-cargo/Previews
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: restore Unity metadata after render evidence import"
          git push origin HEAD:fix/issue-199-render-evidence-metadata
