name: One-time GenWorks canonical layout migration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-genworks-canonical-layout.yml

permissions:
  contents: write

concurrency:
  group: image2outfit-genworks-canonical-layout
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pause automatic hosted product builds during the multi-product move
        shell: bash
        run: |
          set -euo pipefail
          hosted='.github/workflows/build-product-hosted.yml'
          cp "$hosted" /tmp/build-product-hosted.original.yml
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/build-product-hosted.yml')
          text = path.read_text(encoding='utf-8')
          start = text.index('on:\n')
          end = text.index('\nenv:\n', start)
          dispatch = '''on:
            workflow_dispatch:
              inputs:
                job_path:
                  description: Tracked product job at config/products/<product-id>/job.json
                  required: true
                  type: string
          '''
          dispatch = '\n'.join(line[10:] if line.startswith('          ') else line for line in dispatch.splitlines()) + '\n'
          path.write_text(text[:start] + dispatch + text[end + 1:], encoding='utf-8', newline='')
          PY
          git add "$hosted"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ci: pause hosted builds for GenWorks layout migration'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Move every configured product to Assets/GenWorks/{slug}/Prefab
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          import re
          import shutil
          import subprocess
          from pathlib import Path

          ROOT = Path.cwd()
          jobs = sorted(Path('config/products').glob('*/job.json'))
          if not jobs:
              raise SystemExit('No configured products found')

          def git(*args: str) -> None:
              subprocess.run(['git', *args], check=True)

          replacements: dict[str, str] = {}
          product_ids: list[str] = []

          for job_path in jobs:
              job = json.loads(job_path.read_text(encoding='utf-8-sig'))
              product_id = job_path.parent.name
              if job.get('id') != product_id:
                  raise SystemExit(f'job identity mismatch: {job_path}')
              product_ids.append(product_id)

              old_root = Path(f'Assets/GenWorks/Products/{product_id}')
              new_root = Path(f'Assets/GenWorks/{product_id}')
              declared_root = Path(str(job.get('productRoot', '')))
              source_root = old_root if old_root.exists() else declared_root

              if source_root != new_root:
                  if not source_root.is_dir():
                      raise SystemExit(f'configured product root missing: {source_root}')
                  if new_root.exists():
                      raise SystemExit(f'canonical product root already exists: {new_root}')
                  git('mv', source_root.as_posix(), new_root.as_posix())
                  old_meta = Path(source_root.as_posix() + '.meta')
                  new_meta = Path(new_root.as_posix() + '.meta')
                  if old_meta.exists():
                      git('mv', old_meta.as_posix(), new_meta.as_posix())
                  replacements[source_root.as_posix()] = new_root.as_posix()
                  replacements[old_root.as_posix()] = new_root.as_posix()

              prefab_dir = new_root / 'Prefab'
              prefab_dir.mkdir(parents=True, exist_ok=True)
              old_prefabs_dir = new_root / 'Prefabs'
              old_prefabs_meta = Path(old_prefabs_dir.as_posix() + '.meta')
              new_prefab_meta = Path(prefab_dir.as_posix() + '.meta')
              if old_prefabs_meta.exists() and not new_prefab_meta.exists():
                  git('mv', old_prefabs_meta.as_posix(), new_prefab_meta.as_posix())

              prefab_files = sorted(
                  path for path in new_root.rglob('*.prefab')
                  if path.parent != prefab_dir
              )
              if not prefab_files:
                  existing = sorted(prefab_dir.glob('*.prefab'))
                  if not existing:
                      raise SystemExit(f'product has no prefab: {product_id}')

              for source in prefab_files:
                  destination = prefab_dir / source.name
                  if destination.exists():
                      raise SystemExit(f'prefab basename collision: {destination}')
                  source_current = source.as_posix()
                  source_original = source_current.replace(
                      new_root.as_posix(), old_root.as_posix(), 1
                  )
                  git('mv', source_current, destination.as_posix())
                  replacements[source_current] = destination.as_posix()
                  replacements[source_original] = destination.as_posix()

                  source_meta = Path(source_current + '.meta')
                  destination_meta = Path(destination.as_posix() + '.meta')
                  if source_meta.exists():
                      source_meta_original = source_meta.as_posix().replace(
                          new_root.as_posix(), old_root.as_posix(), 1
                      )
                      git('mv', source_meta.as_posix(), destination_meta.as_posix())
                      replacements[source_meta.as_posix()] = destination_meta.as_posix()
                      replacements[source_meta_original] = destination_meta.as_posix()

              if old_prefabs_dir.exists():
                  remaining = sorted(path for path in old_prefabs_dir.rglob('*') if path.is_file())
                  for path in remaining:
                      git('rm', '-f', path.as_posix())
                  shutil.rmtree(old_prefabs_dir)

          products_root = Path('Assets/GenWorks/Products')
          if products_root.exists():
              leftovers = list(products_root.iterdir())
              if leftovers:
                  raise SystemExit('Unmigrated entries remain under Products: ' + ', '.join(p.as_posix() for p in leftovers))
              products_root.rmdir()
          products_meta = Path('Assets/GenWorks/Products.meta')
          if products_meta.exists():
              git('rm', '-f', products_meta.as_posix())

          generic_replacements = {
              'Assets/GenWorks/Products/<product-id>': 'Assets/GenWorks/<product-id>',
              'Assets/GenWorks/Products/<product-slug>': 'Assets/GenWorks/<product-slug>',
              'Assets/GenWorks/Products': 'Assets/GenWorks',
          }
          replacements.update(generic_replacements)

          skip_suffixes = {
              '.blend', '.fbx', '.png', '.jpg', '.jpeg', '.webp', '.zip', '.glb', '.obj',
              '.dll', '.so', '.a', '.exe', '.xz', '.tar', '.woff', '.woff2'
          }
          ordered = sorted(replacements.items(), key=lambda item: len(item[0]), reverse=True)
          changed_text: list[str] = []
          for path in ROOT.rglob('*'):
              if not path.is_file() or '.git' in path.parts or path.suffix.lower() in skip_suffixes:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              updated = text
              for old, new in ordered:
                  updated = updated.replace(old, new)
                  updated = updated.replace(old.replace('/', '\\\\'), new.replace('/', '\\\\'))
              if updated != text:
                  path.write_text(updated, encoding='utf-8', newline='')
                  changed_text.append(path.as_posix())

          layout_path = Path('config/genworks-layout.json')
          layout = json.loads(layout_path.read_text(encoding='utf-8-sig'))
          layout['productRoot'] = 'Assets/GenWorks'
          layout['requiredProductDirectories'] = [
              'Prefab' if value == 'Prefabs' else value
              for value in layout['requiredProductDirectories']
          ]
          layout_path.write_text(
              json.dumps(layout, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8', newline=''
          )

          policy_path = Path('config/genworks-handoff-policy.json')
          policy = json.loads(policy_path.read_text(encoding='utf-8-sig'))
          policy['canonicalWorkspacePattern'] = 'Assets/GenWorks/<product-id>'
          policy['canonicalPrefabPattern'] = 'Assets/GenWorks/<product-id>/Prefab/*.prefab'
          policy_path.write_text(
              json.dumps(policy, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8', newline=''
          )

          active_catalog = []
          for job_path in jobs:
              job = json.loads(job_path.read_text(encoding='utf-8-sig'))
              product_id = job_path.parent.name
              product_root = Path(f'Assets/GenWorks/{product_id}')
              manifest_path = product_root / 'ProductManifest.json'
              manifest = json.loads(manifest_path.read_text(encoding='utf-8-sig'))
              active_catalog.append({
                  'productId': product_id,
                  'productName': manifest.get('productName', product_id),
                  'status': manifest.get('status', 'UNKNOWN'),
                  'productRoot': product_root.as_posix(),
                  'prefabs': sorted(path.as_posix() for path in (product_root / 'Prefab').glob('*.prefab')),
              })

          legacy_root = Path('Assets/GenWorks/Legacy')
          legacy_roots: set[Path] = set()
          if legacy_root.exists():
              for prefab in legacy_root.rglob('*.prefab'):
                  selected = prefab.parent
                  for parent in prefab.parents:
                      if parent == legacy_root:
                          break
                      if any((parent / marker).exists() for marker in (
                          'audit.json', 'audit-summary.json', 'AUDIT_REPORT.md', 'ProductManifest.json'
                      )):
                          selected = parent
                          break
                  legacy_roots.add(selected)

          legacy_catalog = []
          for product_root in sorted(legacy_roots):
              legacy_catalog.append({
                  'snapshotId': product_root.name,
                  'status': 'LEGACY_SNAPSHOT',
                  'productRoot': product_root.as_posix(),
                  'prefabs': sorted(path.as_posix() for path in product_root.rglob('*.prefab')),
              })

          catalog = {
              'schemaVersion': 1,
              'canonicalPattern': 'Assets/GenWorks/{slug}/Prefab/*.prefab',
              'activeProductCount': len(active_catalog),
              'legacySnapshotCount': len(legacy_catalog),
              'assetBackedOutfitCount': len(active_catalog) + len(legacy_catalog),
              'activeProducts': active_catalog,
              'legacySnapshots': legacy_catalog,
          }
          Path('Assets/GenWorks/OutfitCatalog.json').write_text(
              json.dumps(catalog, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8', newline=''
          )

          residuals: list[str] = []
          for path in ROOT.rglob('*'):
              if not path.is_file() or '.git' in path.parts or path.suffix.lower() in skip_suffixes:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              if 'Assets/GenWorks/Products' in text:
                  residuals.append(f'{path}: old Products root')
              if re.search(r'Assets/GenWorks/[a-z0-9][a-z0-9._-]*/Prefabs(?:/|\\\\)', text):
                  residuals.append(f'{path}: old Prefabs path')
          if residuals:
              raise SystemExit('Stale GenWorks paths remain:\n' + '\n'.join(residuals))

          for job_path in jobs:
              job = json.loads(job_path.read_text(encoding='utf-8-sig'))
              product_id = job_path.parent.name
              expected_root = f'Assets/GenWorks/{product_id}'
              if job.get('productRoot') != expected_root:
                  raise SystemExit(f'noncanonical productRoot: {job_path}: {job.get("productRoot")}')
              for field in ('prefabAssetPath', 'integratedPrefabAssetPath'):
                  value = str(job.get(field, ''))
                  pattern = rf'^Assets/GenWorks/{re.escape(product_id)}/Prefab/[^/]+\\.prefab$'
                  if not re.fullmatch(pattern, value):
                      raise SystemExit(f'noncanonical {field}: {job_path}: {value}')
                  if not Path(value).is_file():
                      raise SystemExit(f'missing configured prefab: {value}')
              product_root = Path(expected_root)
              for prefab in product_root.rglob('*.prefab'):
                  if prefab.parent != product_root / 'Prefab':
                      raise SystemExit(f'prefab outside canonical flat directory: {prefab}')

          print(json.dumps(catalog, ensure_ascii=False, indent=2))
          print('updated text files:', len(changed_text))
          PY

          for job in config/products/*/job.json; do
            product_id="$(basename "$(dirname "$job")")"
            python tools/update_product_hashes.py --root "Assets/GenWorks/${product_id}"
          done

          python -m compileall -q tools tests
          python tools/audit_genworks_layout.py
          python tools/audit_repository_hygiene.py
          python -m unittest discover -s tests -v
          git diff --check

          git add -A
          git commit -m 'refactor: standardize GenWorks slug and Prefab layout'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Restore automatic hosted triggers and remove this migration workflow
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          hosted = Path('.github/workflows/build-product-hosted.yml')
          current = hosted.read_text(encoding='utf-8')
          original = Path('/tmp/build-product-hosted.original.yml').read_text(encoding='utf-8')
          current_start = current.index('on:\n')
          current_end = current.index('\nenv:\n', current_start)
          original_start = original.index('on:\n')
          original_end = original.index('\nenv:\n', original_start)
          original_on = original[original_start:original_end]
          hosted.write_text(
              current[:current_start] + original_on + current[current_end:],
              encoding='utf-8', newline=''
          )
          PY
          git rm -f .github/workflows/one-time-genworks-canonical-layout.yml
          git add .github/workflows/build-product-hosted.yml
          git commit -m 'chore: finalize canonical GenWorks layout migration'
          git pull --rebase origin main
          git push origin HEAD:main
