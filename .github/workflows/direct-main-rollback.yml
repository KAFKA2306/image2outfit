name: Restore unauthorized main pushes

on:
  push:
    branches: [main]

permissions:
  contents: "write"
  pull-requests: "read"

concurrency:
  group: direct-main-rollback-${{ github.repository }}
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    # Covers the retry window below (10 attempts x 30 seconds) plus API time.
    timeout-minutes: 12
    steps:
      - name: Restore the last verified merge commit
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const defaultBranch = context.payload.repository.default_branch;
            const before = String(context.payload.before || "");
            const after = String(context.payload.after || "");

            // GitHub indexes PR <-> merge-commit associations with a lag right
            // after a merge. A single lookup can miss a legitimate merge, so
            // re-query before deciding that a push was unauthorized.
            const maxAttempts = 10;
            const retryDelayMs = 30_000;

            const isMergedPullFor = (pr, sha) =>
              Boolean(pr.merged_at) &&
              pr.base?.ref === defaultBranch &&
              pr.merge_commit_sha === sha;

            async function mergedPullFor(sha) {
              const byCommit = await github.paginate(
                github.rest.repos.listPullRequestsAssociatedWithCommit,
                { owner, repo, commit_sha: sha, per_page: 100 },
              );
              if (byCommit.some(pr => isMergedPullFor(pr, sha))) {
                return true;
              }
              const closed = await github.paginate(
                github.rest.pulls.list,
                {
                  owner,
                  repo,
                  state: "closed",
                  base: defaultBranch,
                  sort: "updated",
                  direction: "desc",
                  per_page: 100,
                },
              );
              return closed.some(pr => isMergedPullFor(pr, sha));
            }

            if (!before || /^0+$/.test(before) || !after || before === after) {
              core.info("No restorable branch transition was present.");
              return;
            }

            let mergedThroughPull = false;
            for (let attempt = 1; attempt <= maxAttempts; attempt++) {
              mergedThroughPull = await mergedPullFor(after);
              if (mergedThroughPull) {
                break;
              }
              if (attempt < maxAttempts) {
                core.info(`Attempt ${attempt}: no merged pull request for ${after} yet; retrying.`);
                await new Promise(resolve => setTimeout(resolve, retryDelayMs));
              }
            }
            if (mergedThroughPull) {
              core.info(`${after} was produced by a pull request merged into ${defaultBranch}.`);
              return;
            }

            const trustedBefore = await mergedPullFor(before);

            if (!trustedBefore) {
              core.setFailed(
                `Unauthorized push ${after} detected, but previous SHA ${before} is not a verified ${defaultBranch} merge commit. Ref was not changed.`,
              );
              return;
            }

            await github.request("PATCH /repos/{owner}/{repo}/git/refs/{ref}", {
              owner,
              repo,
              ref: `heads/${defaultBranch}`,
              sha: before,
              force: true,
            });
            core.setFailed(
              `Unauthorized push ${after} was automatically rolled back to verified merge commit ${before} after ${maxAttempts} attempts.`,
            );
