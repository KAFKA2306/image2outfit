name: Restore unauthorized main pushes

on:
  push:
    branches: [main]

permissions:
  contents: "write"
  pull-requests: "read"

concurrency:
  group: direct-main-rollback-${{ github.repository }}
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Restore the last verified merge commit
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const defaultBranch = context.payload.repository.default_branch;
            const before = String(context.payload.before || "");
            const after = String(context.payload.after || "");

            if (!before || /^0+$/.test(before) || !after || before === after) {
              core.info("No restorable branch transition was present.");
              return;
            }

            const afterPulls = await github.paginate(
              github.rest.repos.listPullRequestsAssociatedWithCommit,
              { owner, repo, commit_sha: after, per_page: 100 },
            );
            const mergedThroughPull = afterPulls.some(pr =>
              Boolean(pr.merged_at) &&
              pr.base?.ref === defaultBranch &&
              pr.merge_commit_sha === after,
            );
            if (mergedThroughPull) {
              core.info(`${after} was produced by a pull request merged into ${defaultBranch}.`);
              return;
            }

            const beforePulls = await github.paginate(
              github.rest.repos.listPullRequestsAssociatedWithCommit,
              { owner, repo, commit_sha: before, per_page: 100 },
            );
            const trustedBefore = beforePulls.some(pr =>
              Boolean(pr.merged_at) &&
              pr.base?.ref === defaultBranch &&
              pr.merge_commit_sha === before,
            );

            if (!trustedBefore) {
              core.setFailed(
                `Unauthorized push ${after} detected, but previous SHA ${before} is not a verified ${defaultBranch} merge commit. Ref was not changed.`,
              );
              return;
            }

            await github.request("PATCH /repos/{owner}/{repo}/git/refs/{ref}", {
              owner,
              repo,
              ref: `heads/${defaultBranch}`,
              sha: before,
              force: true,
            });
            core.setFailed(
              `Unauthorized push ${after} was automatically rolled back to verified merge commit ${before}.`,
            );
