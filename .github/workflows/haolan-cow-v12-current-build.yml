name: Build current HAOLAN cow hood v1.2

on:
  push:
    branches:
      - agent/haolan-cow-hood-v12-current
    paths:
      - .github/run/haolan-cow-v12-current.txt

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/haolan-cow-hood-v12-current
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Restore audited v1.2 generator source
        run: |
          set -euo pipefail
          base='https://raw.githubusercontent.com/KAFKA2306/image2outfit/5d388b07ceee36a44e055f770755b24873ef041b'
          curl -fsSL "$base/tools/haolan_cow_generator_hosted.py" -o tools/haolan_cow_generator_hosted.py
          curl -fsSL "$base/tools/haolan_cow_hood_generator.py" -o tools/haolan_cow_hood_generator.py
          curl -fsSL "$base/tools/haolan_cow_v11_overrides.b85" -o tools/haolan_cow_v12_overrides.b85
          sed -i 's/haolan_cow_v11_overrides.b85/haolan_cow_v12_overrides.b85/g' tools/haolan_cow_generator_hosted.py tools/haolan_cow_hood_generator.py
      - name: Install generator dependencies
        run: python -m pip install --disable-pip-version-check numpy pillow trimesh scipy matplotlib
      - name: Generate and package into current canonical slug
        run: |
          set -euo pipefail
          rm -rf /tmp/haolan-cow-v12
          python -m py_compile tools/haolan_cow_generator_hosted.py tools/haolan_cow_hood_generator.py
          python tools/haolan_cow_generator_hosted.py --out /tmp/haolan-cow-v12
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, shutil
          from datetime import datetime, timezone
          from pathlib import Path

          repo = Path('.').resolve()
          src = Path('/tmp/haolan-cow-v12')
          root_rel = 'Assets/GenWorks/haolan-cow-hood-knit-set'
          root = repo / root_rel
          for name in ('Models','Prefab','Previews','Textures','Documentation/Audit','Documentation/Inspection'):
              (root / name).mkdir(parents=True, exist_ok=True)
          copies = {
              'HAOLAN_CowHoodKnitSet.fbx':'Models/HAOLAN_CowHoodKnitSet.fbx',
              'HAOLAN_CowHoodKnitSet.fbx.meta':'Models/HAOLAN_CowHoodKnitSet.fbx.meta',
              'HAOLAN_CowHoodKnitSet.prefab':'Prefab/HAOLAN_CowHoodKnitSet.prefab',
              'HAOLAN_CowHoodKnitSet.prefab.meta':'Prefab/HAOLAN_CowHoodKnitSet.prefab.meta',
              'HAOLAN_CowHoodKnitSet_preview.glb':'Documentation/Inspection/HAOLAN_CowHoodKnitSet_preview.glb',
              'Preview/front.png':'Previews/front.png',
              'Preview/back.png':'Previews/back.png',
              'Preview/left.png':'Previews/left.png',
              'Preview/right.png':'Previews/right.png',
              'Preview/three_quarter.png':'Previews/three-quarter.png',
              'HAOLAN_CowHoodKnitSet_preview.webp':'Previews/HAOLAN_CowHoodKnitSet_preview.webp',
              'AUDIT_REPORT.md':'Documentation/Audit/AUDIT_REPORT.md',
              'audit.json':'Documentation/Audit/audit.json',
          }
          for source, target in copies.items():
              shutil.copy2(src / source, root / target)
          shutil.copy2(src / 'Preview/right.png', root / 'Previews/side.png')
          for source in (src / 'Textures').glob('*'):
              if source.is_file(): shutil.copy2(source, root / 'Textures' / source.name)

          audit = json.loads((src / 'audit.json').read_text(encoding='utf-8'))
          metrics = audit['fbx']
          static = audit['staticGeometry']['metrics']
          assert (metrics['meshObjects'], metrics['vertices'], metrics['triangles']) == (24, 18394, 34778)
          assert not any(static[k] for k in ('nonFiniteValues','degenerateTriangles','unweightedVertices','weightSumErrors'))
          now = datetime.now(timezone.utc).isoformat()
          previews = {
              'front':f'{root_rel}/Previews/front.png',
              'back':f'{root_rel}/Previews/back.png',
              'left':f'{root_rel}/Previews/left.png',
              'right':f'{root_rel}/Previews/right.png',
              'three-quarter':f'{root_rel}/Previews/three-quarter.png',
          }
          manifest = {
              'schemaVersion':1,'productId':'haolan-cow-hood-knit-set','productName':'HAOLAN Cow Hood Knit Set v1.2',
              'version':'1.2','status':'WORKING','classification':'PARTIAL_CHECKPOINT','targetAdapterId':'haolan-v1.6',
              'productRoot':root_rel,'outfitPrefabPath':f'{root_rel}/Prefab/HAOLAN_CowHoodKnitSet.prefab',
              'modelPath':f'{root_rel}/Models/HAOLAN_CowHoodKnitSet.fbx','previewPaths':previews,
              'previewPath':f'{root_rel}/Previews/HAOLAN_CowHoodKnitSet_preview.webp',
              'documentationPath':f'{root_rel}/README.md','sourceJobPath':'config/products/haolan-cow-hood-knit-set/job.json',
              'metrics':{k:metrics[k] for k in ('meshObjects','vertices','triangles','materials','bones','maxBoneInfluences')},
              'technicalGates':{'blender':'NOT_RUN','fbx':'PASS','unityImport':'NOT_RUN','prefabSerialized':'PASS',
                  'prefabReload':'NOT_RUN','modularAvatar':'NOT_RUN','humanVisualReview':'PASS',
                  'humanPoseReview':'NOT_RUN','humanRuntimeReview':'NOT_RUN'},
              'handoff':{'resumable':True,'canonicalWorkspace':root_rel,'doNotRebuildFromZero':True,
                  'decision':'NO-GO','resumeFrom':f'{root_rel}/ProductManifest.json',
                  'blockers':['Pass Unity 2022.3.22f1 import/save-reload','Pass animated clipping and pose review',
                              'Create and validate the HAOLAN-integrated Modular Avatar prefab','Pass VRChat Build & Test and in-headset review']},
              'knownEvidence':{'staticGeometry':'PASS','manualVisualReview':'PASS_WITH_RUNTIME_GATES_OPEN',
                  'unityImport':'NOT_RUN','animatedClipping':'NOT_RUN','vrchatRuntime':'NOT_RUN'},
              'generatedAt':now,
          }
          (root / 'ProductManifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          (root / 'README.md').write_text('''# HAOLAN Cow Hood Knit Set v1.2\n\nCanonical resumable checkpoint for HAOLAN. The nested Legacy snapshot has been removed; this directory is the only active workspace.\n\n- Model: `Models/HAOLAN_CowHoodKnitSet.fbx`\n- Prefab: `Prefab/HAOLAN_CowHoodKnitSet.prefab`\n- Five-view evidence: `Previews/front.png`, `back.png`, `left.png`, `right.png`, `three-quarter.png`\n- Multiview: `Previews/HAOLAN_CowHoodKnitSet_preview.webp`\n\nThe hood, detached sleeves, cuffs, skirt silhouette and preview shading were rebuilt in v1.2. Static geometry and visual checkpoint pass. Customer release remains **NO-GO** until Unity import/reload, animated clipping, Modular Avatar, VRChat Build & Test and in-headset review pass.\n\nHAOLAN credit: かなﾘぁさんち / HAOLAN. HAOLAN source files are not redistributed.\n''',encoding='utf-8')
          visual = '''# HAOLAN Cow Hood Knit Set v1.2 — Visual Review\n\n**Canonical static checkpoint: PASS. Customer release: NO-GO.**\n\n- `Previews/back.png` is a true rear view at the canonical product path.\n- Rebuilt the hood as a dense inner/outer shell with thickness and a lower rear drape.\n- Rebuilt detached sleeves with curved centerlines, elbow drop, bell flare, gathering and shaped cuffs.\n- Lengthened and widened the pleated skirt, added top/skirt hems, subdivided ears and drawstrings.\n- Replaced faceted per-triangle shading with smoothed normals and rounded continuous cow patches.\n- Five distinct views are tracked: front, back, left, right and three-quarter.\n\nStatic result: 24 objects, 18,394 vertices, 34,778 triangles. Non-finite values, degenerate triangles, unweighted vertices and weight-sum errors are all zero.\n\nUnity import, pose clipping, Modular Avatar, VRChat Build & Test and in-headset material review remain open.\n'''
          (root / 'Documentation/Audit/VISUAL_REVIEW.md').write_text(visual,encoding='utf-8')
          audit.update({'product':'HAOLAN Cow Hood Knit Set v1.2','productRoot':root_rel,'decision':'NO-GO',
              'decisionScope':'customer release; canonical static checkpoint PASS',
              'pathReview':{'canonicalRoot':'PASS','canonicalPrefabPattern':'PASS','frontBackLabelsCorrected':True,'legacyRemoved':True}})
          (root / 'Documentation/Audit/audit.json').write_text(json.dumps(audit,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          job_path = repo / 'config/products/haolan-cow-hood-knit-set/job.json'
          job = json.loads(job_path.read_text(encoding='utf-8'))
          job.update({'productName':'HAOLAN Cow Hood Knit Set v1.2','renderLoopRevision':'v1.2-smooth-shading-rounded-patches-refined-silhouette',
              'buildScript':'tools/haolan_cow_hood_generator.py','hostedPoseScript':'tools/haolan_cow_generator_hosted.py',
              'blendPath':f'{root_rel}/Documentation/Inspection/HAOLAN_CowHoodKnitSet_preview.glb','previewPaths':previews})
          delivery = [p.relative_to(repo).as_posix() for p in sorted(root.rglob('*')) if p.is_file()]
          job['deliveryAssets'] = delivery
          job_path.write_text(json.dumps(job,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          catalog_path = repo / 'Assets/GenWorks/OutfitCatalog.json'
          catalog = json.loads(catalog_path.read_text(encoding='utf-8'))
          for key in ('activeProducts','assetBackedProducts','plannedProducts'):
              values = catalog.get(key,[])
              for item in values:
                  if item.get('productId') == 'haolan-cow-hood-knit-set':
                      item.update({'productName':'HAOLAN Cow Hood Knit Set v1.2','status':'WORKING',
                          'classification':'PARTIAL_CHECKPOINT','productRoot':root_rel,
                          'configuredPrefabPaths':[f'{root_rel}/Prefab/HAOLAN_CowHoodKnitSet.prefab'],
                          'trackedPrefabs':[f'{root_rel}/Prefab/HAOLAN_CowHoodKnitSet.prefab']})
          catalog_path.write_text(json.dumps(catalog,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          files = [p for p in sorted(root.rglob('*')) if p.is_file() and p.name != 'SOURCE_HASHES.txt']
          (root / 'SOURCE_HASHES.txt').write_text('\n'.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.relative_to(root).as_posix()}' for p in files)+'\n',encoding='utf-8')
          print(json.dumps({'root':root_rel,'metrics':manifest['metrics'],'status':'PASS'},indent=2))
          PY
      - name: Validate repository contracts
        run: |
          python tools/audit_repository_hygiene.py --root .
          python -m pytest -q tests/test_config_contracts.py tests/test_snapshot_paths.py
      - name: Commit generated checkpoint
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- Assets/GenWorks/haolan-cow-hood-knit-set Assets/GenWorks/OutfitCatalog.json config/products/haolan-cow-hood-knit-set tools/haolan_cow_generator_hosted.py tools/haolan_cow_hood_generator.py tools/haolan_cow_v12_overrides.b85
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Upgrade canonical HAOLAN cow hood checkpoint to v1.2'
          git push origin HEAD:agent/haolan-cow-hood-v12-current
