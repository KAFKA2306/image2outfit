name: Remove committed Python bytecode

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: remove-python-bytecode
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/consolidate-root-and-environment-contracts'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/consolidate-root-and-environment-contracts
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: astral-sh/setup-uv@v6

      - name: Remove bytecode residue and harden ignores
        shell: bash
        run: |
          set -euo pipefail
          find tools tests -type f -path '*/__pycache__/*.pyc' -print -delete
          find tools tests -type d -name __pycache__ -empty -delete
          grep -qxF '__pycache__/' .gitignore || printf '\n__pycache__/\n' >> .gitignore
          grep -qxF '*.py[cod]' .gitignore || printf '*.py[cod]\n' >> .gitignore
          git rm -f .github/workflows/one-time-remove-python-bytecode.yml

      - name: Validate clean tree
        shell: bash
        run: |
          set -euo pipefail
          python tools/audit_repository_hygiene.py
          python tools/audit_genworks_layout.py
          python -m unittest discover -s tests -v
          uv run --group dev ruff check \
            --ignore S102,EXE001,UP017,BLE001,SIM103,I001,RUF100 \
            tools/audit_repository_hygiene.py \
            tools/audit_toolchain.py \
            tools/blender_python_env.py \
            tools/release_gate.py \
            tools/siroino_wide_cargo_release_refit_v23.py \
            tests/test_release_gate.py \
            tests/test_toolchain.py
          test -z "$(find tools tests -type f -path '*/__pycache__/*.pyc' -print)"
          git diff --check

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: remove Python bytecode residue'
          git push origin HEAD:agent/consolidate-root-and-environment-contracts
