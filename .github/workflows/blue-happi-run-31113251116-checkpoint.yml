name: Publish blue happi run 31113251116 checkpoint

on:
  push:
    branches:
      - feat/196-siroino-blue-happi
    paths:
      - .github/workflows/blue-happi-run-31113251116-checkpoint.yml

permissions:
  actions: read
  contents: write

concurrency:
  group: blue-happi-run-31113251116-checkpoint
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/196-siroino-blue-happi
          fetch-depth: 0

      - name: Download exact hosted Blender artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: '8972668547'
        run: |
          set -euo pipefail
          mkdir -p /tmp/blue-happi-artifact
          curl --fail-with-body --location --retry 4 --retry-all-errors \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            --output /tmp/blue-happi-artifact.zip
          unzip -q /tmp/blue-happi-artifact.zip -d /tmp/blue-happi-artifact
          test -f /tmp/blue-happi-artifact/Assets/GenWorks/siroino-blue-happi/Previews/front.png
          test -f /tmp/blue-happi-artifact/Assets/GenWorks/siroino-blue-happi/Previews/siroino-blue-happi-pose-review.webp
          test -f /tmp/blue-happi-artifact/Assets/GenWorks/siroino-blue-happi/Evidence/Build/product-build-report.json

      - name: Preserve rejected render and repair Ruff findings
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import shutil
          from pathlib import Path

          root = Path.cwd()
          product_root = root / 'Assets/GenWorks/siroino-blue-happi'
          source = Path('/tmp/blue-happi-artifact/Assets/GenWorks/siroino-blue-happi')
          destination = product_root / 'Evidence/Rejected/run-31113251116'
          if destination.exists():
              shutil.rmtree(destination)
          destination.mkdir(parents=True)
          shutil.copytree(source / 'Previews', destination / 'Previews')
          shutil.copytree(source / 'Evidence' / 'Build', destination / 'Build')

          report = json.loads((destination / 'Build/product-build-report.json').read_text())
          review_path = root / 'config/products/siroino-blue-happi/reviews/v2-direct-review-fail-run-31113251116.json'
          review = {
              'schemaVersion': 1,
              'productId': 'siroino-blue-happi',
              'reviewMethod': 'direct-image-inspection',
              'decision': 'FAIL',
              'reviewedRevision': 'v2-blue-happi-shaped-shell',
              'reviewedHeadSha': '895fc3efd8ec74a89c5fadaba2643ac26a3a5dbf',
              'workflowRun': 31113251116,
              'artifact': {
                  'id': 8972668547,
                  'name': 'image2outfit-hosted-siroino-blue-happi-31113251116',
                  'sha256': 'f5b8643c88cd997f059187ea4243fc4ef84f6f36232801bec7d821de5a846e41',
              },
              'measuredEvidence': {
                  'frontOpeningM': report['frontOpeningM'],
                  'clearanceP01M': report['fitEnvelope']['clearanceP01M'],
                  'meanClearanceM': report['fitEnvelope']['meanClearanceM'],
                  'degenerateTriangles': report['metrics']['degenerateTriangles'],
                  'unweightedVertices': report['metrics']['unweightedVertices'],
                  'maximumBoneInfluences': report['metrics']['maxBoneInfluences'],
              },
              'imageEvidence': {
                  'multiviewSha256': '31bc5461e3bfc8259a3b9115eb097b7a6f27a8422b4b4da0b23744337b927613',
                  'poseReviewSha256': '01beca5ca7a6be1c3d2b18b55f4469228fc8775c414bd534a27fc795c8a021c0',
                  'fiveViews': ['front', 'back', 'left', 'right', 'three-quarter'],
                  'sixPoses': ['neutral', 'arms-up', 'arm-cross', 'crouch', 'sit', 'prone'],
              },
              'findings': [
                  {
                      'axis': 'seam',
                      'status': 'FAIL',
                      'reason': 'Both sleeve heads remain visibly detached from the shoulder panels in the five-view evidence.',
                  },
                  {
                      'axis': 'silhouette',
                      'status': 'FAIL',
                      'reason': 'The shoulder line forms pointed fins and the collar bridge floats instead of reading as a sewn happi collar.',
                  },
                  {
                      'axis': 'pose',
                      'status': 'FAIL',
                      'reason': 'The arms-up pose collapses the sleeve and collar structures around the neck; arm-cross also exposes disconnected sleeve deformation.',
                  },
                  {
                      'axis': 'fit',
                      'status': 'PASS_NUMERIC_ONLY',
                      'reason': 'The clearance and front-opening measurements pass, but those metrics do not prove sewn continuity or acceptable pose deformation.',
                  },
              ],
              'nextRevision': 'v3-connected-shoulder-sleeve-collar',
              'activeVisualReview': False,
          }
          review_path.write_text(json.dumps(review, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          checkpoint = {
              'schemaVersion': 1,
              'productId': 'siroino-blue-happi',
              'status': 'REJECTED',
              'sourceCommit': '895fc3efd8ec74a89c5fadaba2643ac26a3a5dbf',
              'sourceWorkflowRun': 31113251116,
              'sourceArtifactId': 8972668547,
              'sourceArtifactDigest': 'sha256:f5b8643c88cd997f059187ea4243fc4ef84f6f36232801bec7d821de5a846e41',
              'reviewResult': 'FAIL',
              'reviewPath': 'config/products/siroino-blue-happi/reviews/v2-direct-review-fail-run-31113251116.json',
              'evidence': {
                  'fiveViews': [f'Previews/{name}.png' for name in ['front', 'back', 'left', 'right', 'three-quarter']],
                  'sixPoses': [f'Previews/Poses/{name}.png' for name in ['neutral', 'arms-up', 'arm-cross', 'crouch', 'sit', 'prone']],
                  'contactSheets': ['Previews/siroino-blue-happi-multiview.webp', 'Previews/siroino-blue-happi-pose-review.webp'],
                  'reports': ['Build/product-build-report.json', 'Build/cloth-simulation.json', 'Build/quality-audit.json'],
              },
          }
          (destination / 'render-checkpoint.json').write_text(
              json.dumps(checkpoint, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          (destination / 'README.md').write_text(
              '# Rejected render checkpoint: run 31113251116\n\n'
              'The complete five-view and six-pose Blender 4.4.3 output is preserved here. '
              'Numeric fit gates passed, but direct image inspection failed: sleeve heads are '
              'detached from the shoulders, the collar bridge floats, and the arms-up and '
              'arm-cross poses produce unacceptable deformation. These files are evidence of '
              'a rejected iteration, not approved product previews.\n',
              encoding='utf-8',
          )

          manifest_path = product_root / 'ProductManifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['status'] = 'WORKING'
          manifest['handoff']['lastAttempt'] = {
              'result': 'DIRECT_VISUAL_REVIEW_FAIL',
              'visualRevision': 'v2-blue-happi-shaped-shell',
              'workflowRun': 31113251116,
              'review': 'config/products/siroino-blue-happi/reviews/v2-direct-review-fail-run-31113251116.json',
          }
          manifest['handoff']['blockers'] = [
              'Join each sleeve head to the shoulder/armscye construction without visible gaps.',
              'Replace the floating collar bridge with a sewn collar path continuous with the front bands.',
              'Rebuild pose deformation and rerun all five views and six required poses.',
              'Create visual-review.json only after direct review passes the current revision.',
          ]
          manifest['technicalGates']['fiveViewEvidence'] = 'FAIL_REJECTED_EVIDENCE_SAVED'
          manifest['technicalGates']['poseEvidence'] = 'FAIL_REJECTED_EVIDENCE_SAVED'
          manifest['technicalGates']['tenAxisAudit'] = 'WORKING'
          manifest['technicalGates']['visualAppearanceReview'] = 'PENDING'
          manifest['outputs']['rejectedV2Evidence'] = 'Assets/GenWorks/siroino-blue-happi/Evidence/Rejected/run-31113251116'
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          hash_paths = [
              ('ProductManifest.json', product_root / 'ProductManifest.json'),
              ('README.md', product_root / 'README.md'),
              ('Source/Patterns/blue-happi.pattern.json', product_root / 'Source/Patterns/blue-happi.pattern.json'),
          ]
          lines = [f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {label}" for label, path in hash_paths]
          (product_root / 'SOURCE_HASHES.txt').write_text('\n'.join(lines) + '\n', encoding='utf-8')

          builder = root / 'tools/siroino_blue_happi_v2_build.py'
          text = builder.read_text(encoding='utf-8')
          for unused in ('import json\n', 'import sys\n', 'from pathlib import Path\n'):
              text = text.replace(unused, '', 1)
          builder.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/blue-happi-run-31113251116-checkpoint.yml

      - name: Commit and push exact render evidence
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            Assets/GenWorks/siroino-blue-happi/Evidence/Rejected/run-31113251116 \
            Assets/GenWorks/siroino-blue-happi/ProductManifest.json \
            Assets/GenWorks/siroino-blue-happi/SOURCE_HASHES.txt \
            config/products/siroino-blue-happi/reviews/v2-direct-review-fail-run-31113251116.json \
            tools/siroino_blue_happi_v2_build.py \
            .github/workflows/blue-happi-run-31113251116-checkpoint.yml
          git diff --cached --stat
          git commit -m 'Record rejected v2 blue happi render checkpoint'
          git push origin HEAD:feat/196-siroino-blue-happi
