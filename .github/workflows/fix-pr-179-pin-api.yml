name: Fix PR 179 Blender pin API

on:
  pull_request:
    paths:
      - ".github/workflows/fix-pr-179-pin-api.yml"

permissions:
  contents: write

jobs:
  fix:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/issue-143-material-blender-calibration-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Remove obsolete Blender pin flag
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("tools/material_drape_calibration.py")
          text = path.read_text(encoding="utf-8")
          target = '    cloth_values["use_pin_cloth"] = True\n'
          if text.count(target) != 1:
              raise SystemExit("expected exactly one obsolete pin flag")
          path.write_text(text.replace(target, ""), encoding="utf-8")
          PY
      - name: Commit API correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/material_drape_calibration.py
          git commit -m "fix: use Blender 4.4 vertex_group_mass pin API"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
