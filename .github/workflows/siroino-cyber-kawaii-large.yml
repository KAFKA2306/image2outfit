name: Build Siroino Cyber Kawaii Large

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/siroino-cyber-kawaii-large.yml
      - config/siroino-cyber-kawaii-large-job.json
      - config/siroino-cyber-kawaii-large-license.json
      - tools/genworks_product_common.py
      - tools/siroino_cyber_kawaii_large_build.py

permissions:
  contents: write

concurrency:
  group: image2outfit-siroino-cyber-kawaii-large
  cancel-in-progress: true

jobs:
  build:
    runs-on: [self-hosted, windows, x64, image2outfit]
    timeout-minutes: 240

    steps:
      - name: Checkout without deleting private avatar sources
        uses: actions/checkout@v4
        with:
          clean: false
          persist-credentials: true
          fetch-depth: 0

      - uses: arduino/setup-task@v2

      - name: Resolve official Siroino Large target
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $artifactDir = 'Artifacts/siroino-cyber-kawaii-large'
          $jobDir = 'Assets/_Local/Jobs/siroino-cyber-kawaii-large'
          New-Item -ItemType Directory -Force -Path $artifactDir, $jobDir | Out-Null

          $prefabs = Get-ChildItem -LiteralPath Assets -Recurse -File -Filter '*.prefab' -ErrorAction SilentlyContinue |
            Where-Object {
              $_.FullName -notmatch '\\Assets\\GenWorks\\' -and
              $_.FullName -match '(?i)(siroino|sotai)'
            }
          $largePrefabs = @($prefabs | Where-Object {
            $_.FullName -match '(?i)(^|[_\\/.-])large([_\\/.-]|$)' -or
            (Select-String -LiteralPath $_.FullName -Pattern '(^|[^A-Za-z])_?Large([^A-Za-z]|$)' -Quiet -ErrorAction SilentlyContinue)
          })
          if ($largePrefabs.Count -eq 0) {
            throw 'No official Siroino Large-labelled prefab was found. A normal-size fallback is forbidden.'
          }
          $largePrefab = $largePrefabs |
            Sort-Object @{Expression={
              $score = 0
              if ($_.Name -match '(?i)_Large') { $score += 100 }
              if ($_.FullName -match '(?i)SiroinoSotai') { $score += 50 }
              if ($_.FullName -match '(?i)Prefab') { $score += 20 }
              -$score
            }}, FullName |
            Select-Object -First 1

          $fbxFiles = Get-ChildItem -LiteralPath Assets -Recurse -File -Filter '*.fbx' -ErrorAction SilentlyContinue |
            Where-Object {
              $_.FullName -notmatch '\\Assets\\GenWorks\\' -and
              $_.FullName -match '(?i)(siroino|sotai)'
            }
          $largeFbx = $fbxFiles | Where-Object { $_.FullName -match '(?i)(^|[_\\/.-])large([_\\/.-]|$)' } | Select-Object -First 1
          $sourceFbx = if ($largeFbx) {
            $largeFbx
          } else {
            $fbxFiles | Where-Object { $_.Name -match '(?i)^SiroinoSotai_PC\.fbx$' } | Select-Object -First 1
          }
          if (-not $sourceFbx) {
            throw 'Siroino PC source FBX was not found on the self-hosted runner.'
          }

          $root = (Get-Location).Path
          $prefabRel = [IO.Path]::GetRelativePath($root, $largePrefab.FullName).Replace('\', '/')
          $fbxRel = [IO.Path]::GetRelativePath($root, $sourceFbx.FullName).Replace('\', '/')
          $job = Get-Content -LiteralPath 'config/siroino-cyber-kawaii-large-job.json' -Raw | ConvertFrom-Json
          $job.targetAvatarAssetPath = $prefabRel
          $job.targetSourcePath = $fbxRel
          $job.resolvedTarget = [ordered]@{
            profile = 'Siroino _Large'
            prefab = $prefabRel
            sourceFbx = $fbxRel
            normalSizeFallbackAllowed = $false
          }
          $jobPath = "$jobDir/job.json"
          $job | ConvertTo-Json -Depth 30 | Set-Content -LiteralPath $jobPath -Encoding utf8
          $job.resolvedTarget | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath "$artifactDir/resolved-target.json" -Encoding utf8

          "JOB_PATH=$jobPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PRODUCT_ROOT=$($job.productRoot)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ARTIFACT_DIR=$artifactDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CANDIDATE_DIR=$($job.candidateDir)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "IMAGE2OUTFIT_RUN_ID=$env:GITHUB_RUN_ID" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Restore pinned VPM packages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Command vpm -ErrorAction SilentlyContinue)) {
            throw 'The official VPM CLI is required on the image2outfit runner'
          }
          $repoOutput = (& vpm list repos 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) { throw "vpm list repos failed: $repoOutput" }
          foreach ($repo in @('https://vpm.nadena.dev/vpm.json', 'https://vpm.anatawa12.com/vpm.json')) {
            if ($repoOutput -notmatch [regex]::Escape($repo)) {
              & vpm add repo $repo
              if ($LASTEXITCODE -ne 0) { throw "Could not add VPM repository: $repo" }
            }
          }
          & vpm resolve project .
          if ($LASTEXITCODE -ne 0) { throw 'vpm resolve project failed' }

      - name: Build candidate and run technical gates
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          task candidate JOB="$env:JOB_PATH"
          if ($LASTEXITCODE -ne 0) { throw 'Candidate build or technical gate failed' }

      - name: Verify Large target and generated deliverables
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $report = Get-Content -LiteralPath "$env:ARTIFACT_DIR/product-build-report.json" -Raw | ConvertFrom-Json
          if (-not [bool]$report.passed) { throw 'Product build report is not PASS' }
          if ([string]$report.targetProfile.profile -ne 'Siroino _Large') { throw 'Build did not use the Siroino _Large profile' }
          if ([string]$report.targetAvatarAssetPath -notmatch '(?i)large|siroino') { throw 'Resolved target prefab is not a verified Siroino Large target' }

          $audit = Get-Content -LiteralPath "$env:ARTIFACT_DIR/audit.json" -Raw | ConvertFrom-Json
          if ([string]$audit.decision -ne 'REVIEW_REQUIRED') {
            throw "Expected REVIEW_REQUIRED candidate boundary, got $($audit.decision)"
          }
          $required = @(
            "$env:PRODUCT_ROOT/Models/SiroinoCyberKawaiiLarge.fbx",
            "$env:PRODUCT_ROOT/Prefabs/Outfit/SiroinoCyberKawaiiLarge.prefab",
            "$env:PRODUCT_ROOT/Prefabs/Integrated/Siroino_Large/Siroino_Large_CyberKawaii.prefab",
            "$env:PRODUCT_ROOT/Previews/siroino-cyber-kawaii-large-multiview.webp",
            "$env:PRODUCT_ROOT/Previews/siroino-cyber-kawaii-large-pose-review.webp"
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Missing deliverable: $path" }
            if ((Get-Item -LiteralPath $path).Length -le 0) { throw "Empty deliverable: $path" }
          }

      - name: Commit generated public product assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- $env:PRODUCT_ROOT
          if (git diff --cached --quiet) {
            Write-Host 'Generated product already matches main.'
            exit 0
          }
          git commit -m 'Build Siroino Cyber Kawaii Large candidate'
          for ($attempt = 1; $attempt -le 6; $attempt++) {
            git pull --rebase --autostash origin main
            if ($LASTEXITCODE -eq 0) {
              git push origin HEAD:main
              if ($LASTEXITCODE -eq 0) { exit 0 }
            }
            Start-Sleep -Seconds ($attempt * 3)
          }
          throw 'Could not push generated product assets after retries'

      - name: Upload FBX, Prefabs, renders, and audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: siroino-cyber-kawaii-large-${{ github.run_id }}
          path: |
            ${{ env.PRODUCT_ROOT }}
            ${{ env.ARTIFACT_DIR }}
            ${{ env.CANDIDATE_DIR }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
