name: Apply Material Convergence Audit

on:
  push:
    branches:
      - feat/issue-143-material-convergence-audit
    paths:
      - "tools/apply_material_convergence_patch.py"
      - ".github/workflows/tmp-apply-material-convergence.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/issue-143-material-convergence-audit
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.32"
      - name: Apply temporal convergence patch
        run: python tools/apply_material_convergence_patch.py
      - name: Format and verify
        run: |
          uv run --locked --no-default-groups --group dev ruff format tools/material_drape_calibration.py
          uv run --locked --no-default-groups --group dev ruff check \
            --select E4,E7,E9,F --ignore E402 tools/material_drape_calibration.py
          python -m py_compile tools/material_drape_calibration.py
          python -m json.tool config/materials/blender-4.4-kes-calibration.v1.json >/dev/null
          git diff --check
      - name: Commit audited implementation
        run: |
          git restore .github/workflows/material-drape-calibration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/material_drape_calibration.py \
            config/materials/blender-4.4-kes-calibration.v1.json
          git commit -m "test(material): require temporal convergence before calibration"
          git push origin HEAD:feat/issue-143-material-convergence-audit
