name: PR merge gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: '0.11.32'
          enable-cache: true

      - name: Verify lockfile
        run: uv lock --check

      - name: Compile reusable Python
        run: uv run --locked --no-default-groups python -m compileall -q src tools tests

      - name: Audit repository contracts
        run: uv run --locked --no-default-groups python tools/manage.py audit all

      - name: Run merge and release boundary contract tests
        run: >-
          uv run --locked --no-default-groups
          python -m unittest
          tests.test_merge_release_separation
          tests.test_release_provenance_gate
          tests.test_repository_policies
          tests.test_release_contracts
          tests.test_candidate_manifest
          -v

      - name: Verify PR merge and product release separation
        run: uv run --locked --no-default-groups python tools/pr_merge_gate.py

      - name: Parse tracked contracts
        run: |
          uv run --locked --no-default-groups python - <<'PY'
          import json
          import tomllib
          from pathlib import Path

          roots = (
              Path("config"),
              Path("examples"),
              Path("Packages"),
              Path("Assets/GenWorks"),
          )
          paths = sorted(
              path
              for root in roots
              if root.exists()
              for path in root.rglob("*.json")
          )
          if not paths:
              raise SystemExit("No JSON contracts found")
          for path in paths:
              json.loads(path.read_text(encoding="utf-8-sig"))
              print(f"{path}: PASS")

          with Path("pyproject.toml").open("rb") as stream:
              project = tomllib.load(stream)
          dependencies = project.get("project", {}).get("dependencies", [])
          if "Pillow==12.3.0" not in dependencies:
              raise SystemExit("Pillow==12.3.0 must be declared")
          uv = project.get("tool", {}).get("uv", {})
          if uv.get("package") is not False:
              raise SystemExit("image2outfit must remain a non-package uv project")
          if uv.get("default-groups") != []:
              raise SystemExit("dependency groups must remain explicit opt-ins")
          print("pyproject.toml: PASS")
          PY

      - name: Resolve changed Python files
        id: changed-python
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
            head="$PR_HEAD_SHA"
          else
            base="$BEFORE_SHA"
            head="$CURRENT_SHA"
            if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
              base="${CURRENT_SHA}^"
            fi
          fi
          git diff --diff-filter=ACMRT --name-only "$base" "$head" -- '*.py' > /tmp/changed-python.txt
          {
            echo 'files<<EOF'
            cat /tmp/changed-python.txt
            echo EOF
          } >> "$GITHUB_OUTPUT"
          echo "Changed Python files:"
          cat /tmp/changed-python.txt || true

      - name: Ruff lint changed Python
        if: steps.changed-python.outputs.files != ''
        shell: bash
        run: |
          mapfile -t files < /tmp/changed-python.txt
          uv run --locked --no-default-groups --group dev ruff check \
            --select E4,E7,E9,F --ignore E402 "${files[@]}"

      - name: Ruff format changed Python
        if: steps.changed-python.outputs.files != ''
        shell: bash
        run: |
          mapfile -t files < /tmp/changed-python.txt
          uv run --locked --no-default-groups --group dev ruff format --check "${files[@]}"
