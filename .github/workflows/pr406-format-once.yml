name: PR 406 one-shot formatter

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/pr406-format-once.yml
  push:
    branches:
      - fix/tuxedo-real-reference-proof
    paths:
      - .github/workflows/pr406-format-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tuxedo-real-reference-proof
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: '0.11.32'
      - name: Format changed Python
        run: |
          uv run --locked --no-default-groups --group dev ruff format \
            src/image2outfit/cloth_evidence.py \
            src/image2outfit/stage_contracts.py \
            tests/test_variant_production.py \
            tools/run_reference_product_stage.py \
            tools/run_variant_production.py \
            tools/siroino_tuxedo_halter_dress_large_build.py \
            tools/verify_cloth_cache_snapshot.py
      - name: Commit formatting only
        run: |
          set -euo pipefail
          files=(
            src/image2outfit/cloth_evidence.py
            src/image2outfit/stage_contracts.py
            tests/test_variant_production.py
            tools/run_reference_product_stage.py
            tools/run_variant_production.py
            tools/siroino_tuxedo_halter_dress_large_build.py
            tools/verify_cloth_cache_snapshot.py
          )
          if git diff --quiet -- "${files[@]}"; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "${files[@]}"
          git commit -m 'style: format Tuxedo proof changes'
          git push origin HEAD:fix/tuxedo-real-reference-proof
