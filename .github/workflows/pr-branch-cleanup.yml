name: PR branch cleanup

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/pr-branch-cleanup.yml

permissions:
  contents: write

concurrency:
  group: pr-branch-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Delete stale ephemeral branches
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t open_heads < <(
            gh api --paginate "repos/${REPOSITORY}/pulls?state=open&per_page=100" \
              --jq '.[].head.ref' | sort -u
          )

          is_open_head() {
            local candidate="$1"
            local open_head
            for open_head in "${open_heads[@]}"; do
              if [[ "$open_head" == "$candidate" ]]; then
                return 0
              fi
            done
            return 1
          }

          deleted=0
          while IFS= read -r branch; do
            [[ -n "$branch" ]] || continue
            [[ "$branch" =~ ^agent/ || "$branch" =~ ^trigger- ]] || continue
            if is_open_head "$branch"; then
              echo "keep active PR branch: $branch"
              continue
            fi

            echo "delete stale branch: $branch"
            gh api --method DELETE "repos/${REPOSITORY}/git/refs/heads/${branch}"
            deleted=$((deleted + 1))
          done < <(
            gh api --paginate "repos/${REPOSITORY}/branches?per_page=100" \
              --jq '.[].name' | sort -u
          )

          echo "deleted_branches=${deleted}" >> "$GITHUB_STEP_SUMMARY"
