name: Temporary issue 143 friction adapter fix

on:
  pull_request:
    branches: [main]
    paths:
      - "src/image2outfit/material_blender.py"
      - "tools/material_drape_calibration.py"
      - "tests/test_material_blender.py"
      - "config/materials/blender-4.4-kes-calibration.v1.json"
      - ".github/workflows/tmp-issue-143-friction-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/issue-143-material-blender-calibration-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.32"
      - name: Apply exact friction adapter patch
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> bool:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if old in text:
                  if text.count(old) != 1:
                      raise SystemExit(f"expected one match in {path}: {old!r}")
                  file.write_text(text.replace(old, new), encoding="utf-8")
                  return True
              if new in text:
                  return False
              raise SystemExit(f"neither old nor new text found in {path}: {old!r}")

          changed = False
          changed |= replace_once(
              "src/image2outfit/material_blender.py",
              "def _range_map(normalized: float, limits: tuple[float, float]) -> float:\n"
              "    if not 0 <= normalized <= 1:\n"
              "        raise ValueError(\"normalized value must be between zero and one\")\n"
              "    return limits[0] + normalized * (limits[1] - limits[0])\n\n\n",
              "def _range_map(normalized: float, limits: tuple[float, float]) -> float:\n"
              "    if not 0 <= normalized <= 1:\n"
              "        raise ValueError(\"normalized value must be between zero and one\")\n"
              "    return limits[0] + normalized * (limits[1] - limits[0])\n\n\n"
              "def blender_collider_friction_percent(coefficient: float) -> float:\n"
              "    \"\"\"Map a Coulomb coefficient to Blender's collider percentage scale.\"\"\"\n\n"
              "    if not math.isfinite(coefficient) or not 0 <= coefficient <= 0.8:\n"
              "        raise ValueError(\n"
              "            \"Blender collider friction requires a coefficient in [0, 0.8]\"\n"
              "        )\n"
              "    return coefficient * 100.0\n\n\n",
          )
          changed |= replace_once(
              "src/image2outfit/material_blender.py",
              "            \"compression_stiffness is an in-plane buckling proxy derived from stretch stiffness; through-thickness compressionKpa is not mapped.\",\n"
              "        ]",
              "            \"compression_stiffness is an in-plane buckling proxy derived from stretch stiffness; through-thickness compressionKpa is not mapped.\",\n"
              "            \"CollisionSettings.cloth_friction uses Blender's 0-80 percentage scale, so the stored Coulomb coefficient is multiplied by 100 explicitly.\",\n"
              "        ]",
          )
          changed |= replace_once(
              "src/image2outfit/material_blender.py",
              '                    "cloth_friction": profile.contact.static_friction,',
              '                    "cloth_friction": blender_collider_friction_percent(\n'
              '                        profile.contact.static_friction\n'
              '                    ),',
          )
          changed |= replace_once(
              "tools/material_drape_calibration.py",
              "    BlenderMaterialProjection,\n"
              "    load_blender_calibration_profile,\n",
              "    BlenderMaterialProjection,\n"
              "    blender_collider_friction_percent,\n"
              "    load_blender_calibration_profile,\n",
          )
          changed |= replace_once(
              "tools/material_drape_calibration.py",
              '            "cloth_friction": profile.contact.static_friction,',
              '            "cloth_friction": blender_collider_friction_percent(\n'
              '                profile.contact.static_friction\n'
              '            ),',
          )
          changed |= replace_once(
              "tools/material_drape_calibration.py",
              '            "cloth_friction": projection.contact_hypothesis.static_friction,',
              '            "cloth_friction": float(\n'
              '                projection.collider_settings["cloth_friction"]\n'
              '            ),',
          )
          changed |= replace_once(
              "tests/test_material_blender.py",
              "            self.assertEqual(\n"
              "                projection.contact_hypothesis.static_friction,\n"
              "                projection.collider_settings[\"cloth_friction\"],\n"
              "            )",
              "            self.assertEqual(\n"
              "                projection.contact_hypothesis.static_friction * 100.0,\n"
              "                projection.collider_settings[\"cloth_friction\"],\n"
              "            )\n"
              "            self.assertLessEqual(\n"
              "                projection.collider_settings[\"cloth_friction\"], 80.0\n"
              "            )",
          )

          profile_path = Path("config/materials/blender-4.4-kes-calibration.v1.json")
          profile = json.loads(profile_path.read_text(encoding="utf-8"))
          desired = {
              "profileId": "blender-4.4.3-kes-cusick-calibration-v6-friction-scale",
              "mappingStatus": "free-fall-friction-scale-corrected-search",
              "elasticScaleSearch": [0.001, 0.01, 0.1],
          }
          for key, value in desired.items():
              if profile.get(key) != value:
                  profile[key] = value
                  changed = True
          semantics = profile["propertySemantics"]
          value = (
              "static Coulomb coefficient mapped to Blender's 0-80 percentage "
              "scale as 100 * coefficient, verified against Blender 4.4.3 source"
          )
          if semantics.get("collisionObject.collision.cloth_friction") != value:
              semantics["collisionObject.collision.cloth_friction"] = value
              changed = True
          search_policy = {
              "spacing": "logarithmic-after-friction-unit-fix",
              "policy": "restart a broad three-point elastic sweep after correcting the collider friction unit conversion; geometry, targets, metrics, and acceptance thresholds remain unchanged",
              "reason": "previous runs used an effective collision coefficient of 0.0035 instead of the declared 0.35 and are invalid for calibration",
          }
          if profile.get("searchPolicy") != search_policy:
              profile["searchPolicy"] = search_policy
              changed = True
          profile_path.write_text(
              json.dumps(profile, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(f"patch changed={changed}")
          PY
      - name: Format and verify the exact patch
        run: |
          uv run --locked --no-default-groups --group dev ruff format \
            src/image2outfit/material_blender.py \
            tools/material_drape_calibration.py \
            tests/test_material_blender.py
          uv run --locked --no-default-groups --group dev ruff check \
            --select E4,E7,E9,F --ignore E402 \
            src/image2outfit/material_blender.py \
            tools/material_drape_calibration.py \
            tests/test_material_blender.py
          uv run --locked --no-default-groups python -m unittest tests/test_material_blender.py -v
      - name: Commit only the friction adapter fix
        run: |
          if git diff --quiet -- \
            src/image2outfit/material_blender.py \
            tools/material_drape_calibration.py \
            tests/test_material_blender.py \
            config/materials/blender-4.4-kes-calibration.v1.json; then
            echo "Patch is already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/image2outfit/material_blender.py \
            tools/material_drape_calibration.py \
            tests/test_material_blender.py \
            config/materials/blender-4.4-kes-calibration.v1.json
          git commit -m "fix(material): map collider friction to Blender percent scale"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
