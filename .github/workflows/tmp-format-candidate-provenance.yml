name: Temporary format candidate provenance

on:
  push:
    branches: [fix/candidate-provenance-fail-closed]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/candidate-provenance-fail-closed
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: '0.11.32'
      - name: Format changed Python
        run: |
          uv run --locked --no-default-groups --group dev ruff format tools/candidate_manifest.py tests/test_candidate_input_provenance.py
          if git diff --quiet; then
            echo 'Already formatted'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/candidate_manifest.py tests/test_candidate_input_provenance.py
          git commit -m 'style: format candidate provenance change'
          git push origin HEAD:fix/candidate-provenance-fail-closed
