name: Temporary issue 143 per-material calibration patch v3

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/tmp-issue-143-per-material-calibration-v3.yml"

permissions:
  contents: write

jobs:
  patch:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/issue-143-material-blender-calibration-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.32"
      - name: Apply patch without double indentation removal
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path(
              ".github/workflows/tmp-issue-143-per-material-calibration.yml"
          ).read_text(encoding="utf-8")
          script = source.split("python - <<'PY'\n", 1)[1].split("\n          PY", 1)[0]
          script = textwrap.dedent(script)
          script = script.replace(
              'new_simulate = "\\n".join(line[10:] if line.startswith("          ") else line for line in new_simulate.splitlines())\n',
              "",
              1,
          )
          script = script.replace(
              'new_search = "\\n".join(line[10:] if line.startswith("          ") else line for line in new_search.splitlines())\n',
              "",
              1,
          )
          compile(script, "issue143_patch.py", "exec")
          exec(script, {})
          PY
      - name: Show generated transition region
        run: nl -ba tools/material_drape_calibration.py | sed -n '790,850p'
      - name: Format and verify patch
        run: |
          uv run --locked --no-default-groups --group dev ruff format \
            tools/material_drape_calibration.py
          uv run --locked --no-default-groups --group dev ruff check \
            --select E4,E7,E9,F --ignore E402 \
            tools/material_drape_calibration.py
          uv run --locked --no-default-groups python -m py_compile \
            tools/material_drape_calibration.py
          uv run --locked --no-default-groups python -m unittest \
            tests/test_material_blender.py -v
      - name: Commit only calibration changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tools/material_drape_calibration.py \
            config/materials/blender-4.4-kes-calibration.v1.json \
            .github/workflows/material-drape-calibration.yml
          git commit -m "feat(material): calibrate Blender scale per material"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
