name: Build HAOLAN cow hood v1.2 branch candidate

on:
  push:
    branches:
      - agent/fix-haolan-cow-hood-v12
    paths:
      - .github/run/haolan-cow-v12.txt

permissions:
  contents: write

concurrency:
  group: haolan-cow-v12-branch-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-haolan-cow-hood-v12
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install generator dependencies
        run: python -m pip install --disable-pip-version-check numpy pillow trimesh scipy matplotlib
      - name: Generate and validate v1.2 canonical checkpoint
        run: |
          set -euo pipefail
          rm -rf /tmp/cow-hood-knit-set-v12
          python -m py_compile tools/haolan_cow_generator_hosted.py tools/package_haolan_cow_v11.py
          python tools/haolan_cow_generator_hosted.py --out /tmp/cow-hood-knit-set-v12
          python tools/package_haolan_cow_v11.py --generated /tmp/cow-hood-knit-set-v12 --repo .
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('Assets/GenWorks/cow-hood-knit-set-v1')
          manifest = json.loads((root / 'ProductManifest.json').read_text())
          audit = json.loads((root / 'audit.json').read_text())
          assert manifest['version'] == '1.2'
          assert manifest['metrics']['meshObjects'] == 24
          assert manifest['metrics']['vertices'] == 18394
          assert manifest['metrics']['triangles'] == 34778
          assert set(manifest['previewPaths']) == {'front','back','left','right','three-quarter'}
          assert audit['staticGeometry']['passed'] is True
          for view in ('front','back','left','right','three_quarter'):
              assert (root / 'Previews' / f'{view}.png').stat().st_size > 10000
          PY
      - name: Commit generated checkpoint to branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- Assets/GenWorks/cow-hood-knit-set-v1 Assets/GenWorks/OutfitCatalog.json config/products/cow-hood-knit-set-v1
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Generate canonical HAOLAN cow hood v1.2 checkpoint'
          git push origin HEAD:agent/fix-haolan-cow-hood-v12
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: haolan-cow-hood-v12-${{ github.run_id }}
          path: |
            Assets/GenWorks/cow-hood-knit-set-v1/Previews
            Assets/GenWorks/cow-hood-knit-set-v1/audit.json
            Assets/GenWorks/cow-hood-knit-set-v1/ProductManifest.json
          retention-days: 14
          if-no-files-found: error
