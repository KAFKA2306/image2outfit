name: Publish blue happi render checkpoint

on:
  push:
    branches:
      - feat/196-siroino-blue-happi
    paths:
      - .github/workflows/blue-happi-render-checkpoint.yml

permissions:
  actions: read
  contents: write

concurrency:
  group: blue-happi-render-checkpoint
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/196-siroino-blue-happi
          fetch-depth: 0

      - name: Download exact hosted Blender artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: '8964130652'
        run: |
          set -euo pipefail
          mkdir -p /tmp/blue-happi-artifact
          curl --fail-with-body --location --retry 4 --retry-all-errors \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            --output /tmp/blue-happi-artifact.zip
          unzip -q /tmp/blue-happi-artifact.zip -d /tmp/blue-happi-artifact
          test -f /tmp/blue-happi-artifact/Assets/GenWorks/siroino-blue-happi/Previews/front.png
          test -f /tmp/blue-happi-artifact/Assets/GenWorks/siroino-blue-happi/Previews/siroino-blue-happi-pose-review.webp

      - name: Record rejected render and stabilize the v2 build
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import shutil
          from pathlib import Path

          root = Path.cwd()
          source = Path('/tmp/blue-happi-artifact/Assets/GenWorks/siroino-blue-happi')
          destination = root / 'Assets/GenWorks/siroino-blue-happi/Evidence/Rejected/run-31092626753'
          if destination.exists():
              shutil.rmtree(destination)
          destination.mkdir(parents=True)
          shutil.copytree(source / 'Previews', destination / 'Previews')
          shutil.copytree(source / 'Evidence' / 'Build', destination / 'Build')

          job_path = root / 'config/products/siroino-blue-happi/job.json'
          job = json.loads(job_path.read_text(encoding='utf-8-sig'))
          job['buildScript'] = 'tools/siroino_blue_happi_product.py'
          job_path.write_text(
              json.dumps(job, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )

          request_path = root / 'config/pipeline/requests/siroino-blue-happi.json'
          request = json.loads(request_path.read_text(encoding='utf-8'))
          request['revisionId'] = 'v2-blue-happi-shaped-shell'
          request_path.write_text(
              json.dumps(request, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )

          wrapper = root / 'tools/siroino_blue_happi_product.py'
          wrapper.write_text(
              '#!/usr/bin/env python3\n'
              '"""Stable product entrypoint for the SiroinoSotai_PC blue happi."""\n\n'
              'from __future__ import annotations\n\n'
              'from siroino_blue_happi_v2_build import main\n\n\n'
              'if __name__ == "__main__":\n'
              '    raise SystemExit(main())\n',
              encoding='utf-8',
          )

          checkpoint = {
              'schemaVersion': 1,
              'productId': 'siroino-blue-happi',
              'status': 'REJECTED',
              'sourceCommit': '153c24996795e0363343a17f1e7c48c0992049c7',
              'sourceWorkflowRun': 31092626753,
              'sourceArtifactId': 8964130652,
              'sourceArtifactDigest': 'sha256:57b4dd1785d5e960c2aaa34998f1c5f879c5920cd673e279bb7ce05706a62e69',
              'reviewedAt': '2026-08-06T14:36:00Z',
              'reviewResult': 'FAIL',
              'reasons': [
                  'The body clearance is excessive and reads as a rigid rectangular box.',
                  'The sleeves separate and fold incorrectly around the shoulders and arm poses.',
                  'The collar and shoulder construction float away from the body.',
                  'This evidence is retained as a rejected render checkpoint and is not a release candidate.',
              ],
              'evidence': {
                  'fiveViews': [
                      'Previews/front.png',
                      'Previews/back.png',
                      'Previews/left.png',
                      'Previews/right.png',
                      'Previews/three-quarter.png',
                  ],
                  'sixPoses': [
                      'Previews/Poses/neutral.png',
                      'Previews/Poses/arms-up.png',
                      'Previews/Poses/arm-cross.png',
                      'Previews/Poses/crouch.png',
                      'Previews/Poses/sit.png',
                      'Previews/Poses/prone.png',
                  ],
                  'contactSheets': [
                      'Previews/siroino-blue-happi-multiview.webp',
                      'Previews/siroino-blue-happi-pose-review.webp',
                  ],
                  'reports': [
                      'Build/product-build-report.json',
                      'Build/cloth-simulation.json',
                      'Build/quality-audit.json',
                  ],
              },
          }
          (destination / 'render-checkpoint.json').write_text(
              json.dumps(checkpoint, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          (destination / 'README.md').write_text(
              '# Rejected render checkpoint: run 31092626753\n\n'
              'This directory preserves the complete five-view and six-pose render output. '
              'Direct visual review failed because the body is excessively box-shaped, the '
              'sleeves separate during poses, and the collar/shoulder construction floats. '
              'The images are evidence of a failed iteration, not approved product previews.\n',
              encoding='utf-8',
          )
          PY
          rm .github/workflows/blue-happi-render-checkpoint.yml

      - name: Commit and push exact render evidence
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            Assets/GenWorks/siroino-blue-happi/Evidence/Rejected/run-31092626753 \
            config/products/siroino-blue-happi/job.json \
            config/pipeline/requests/siroino-blue-happi.json \
            tools/siroino_blue_happi_product.py \
            .github/workflows/blue-happi-render-checkpoint.yml
          git diff --cached --stat
          git commit -m 'Record rejected blue happi render and stabilize v2 entrypoint'
          git push origin HEAD:feat/196-siroino-blue-happi
