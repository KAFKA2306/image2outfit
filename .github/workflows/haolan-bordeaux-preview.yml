name: Render HAOLAN Bordeaux five-view preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/run/haolan-bordeaux-preview.txt

permissions:
  contents: write

concurrency:
  group: haolan-bordeaux-five-view-preview
  cancel-in-progress: false

jobs:
  render:
    runs-on: [self-hosted, windows]
    timeout-minutes: 120

    steps:
      - name: Checkout without deleting local licensed sources
        uses: actions/checkout@v4
        with:
          clean: false
          persist-credentials: true
          fetch-depth: 0

      - name: Locate Blender and exact HAOLAN source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $blenderCandidates = @()
          if ($env:BLENDER_EXE) { $blenderCandidates += $env:BLENDER_EXE }
          $command = Get-Command blender -ErrorAction SilentlyContinue
          if ($command) { $blenderCandidates += $command.Source }
          $blenderCandidates += @(
            'C:/Program Files/Blender Foundation/Blender 4.4/blender.exe',
            'C:/Program Files/Blender Foundation/Blender 4.3/blender.exe',
            'C:/Program Files/Blender Foundation/Blender 4.2/blender.exe'
          )
          $blender = $blenderCandidates | Where-Object { $_ -and (Test-Path -LiteralPath $_ -PathType Leaf) } | Select-Object -First 1
          if (-not $blender) { throw 'Blender executable was not found on the self-hosted runner' }

          $avatar = Get-ChildItem -Path . -Filter 'HAOLAN_Lowpoly.fbx' -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object {
              $_.FullName -notmatch '\\Published\\' -and
              $_.FullName -notmatch '\\Delivery\\' -and
              $_.FullName -notmatch '\\Assets\\GenWorks\\Legacy\\'
            } |
            Select-Object -First 1
          if (-not $avatar) { throw 'Local licensed HAOLAN_Lowpoly.fbx was not found' }

          "BLENDER_EXE=$blender" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "HAOLAN_AVATAR=$($avatar.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Locate or reproducibly rebuild Bordeaux candidate FBX
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expectedHash = '02df9c5c8223f1c9b146cc8db2f2648d5bd1ef185569851f6603a0b67099b69a'
          $outfit = $null
          $candidates = Get-ChildItem -Path . -Filter 'HAOLAN_BordeauxKnitSet.fbx' -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch '\\.git\\' }
          foreach ($candidate in $candidates) {
            $hash = (Get-FileHash -LiteralPath $candidate.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($hash -eq $expectedHash) {
              $outfit = $candidate
              break
            }
          }

          if (-not $outfit) {
            $jobDir = 'Assets/_Local/Jobs/haolan-bordeaux-preview'
            $generatedDir = 'Assets/_Local/Generated/haolan-bordeaux-preview'
            New-Item -ItemType Directory -Force -Path $jobDir, $generatedDir | Out-Null
            $jobPath = Join-Path $jobDir 'job.json'
            $job = [ordered]@{
              targetSourcePath = $env:HAOLAN_AVATAR
              blendPath = "$generatedDir/HAOLAN_BordeauxKnitSet.blend"
              fbxAssetPath = "$generatedDir/HAOLAN_BordeauxKnitSet.fbx"
            }
            $job | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath $jobPath -Encoding utf8
            & $env:BLENDER_EXE --background --factory-startup --python-exit-code 1 --python tools/haolan_knit_build.py -- --job $jobPath
            if ($LASTEXITCODE -ne 0) { throw "Bordeaux candidate rebuild failed with exit code $LASTEXITCODE" }
            $outfit = Get-Item -LiteralPath "$generatedDir/HAOLAN_BordeauxKnitSet.fbx"
          }

          if (-not $outfit -or -not (Test-Path -LiteralPath $outfit.FullName -PathType Leaf)) {
            throw 'HAOLAN_BordeauxKnitSet.fbx is unavailable'
          }
          "HAOLAN_OUTFIT=$($outfit.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Render actual front, back, left, right, and three-quarter views
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = 'Published/haolan/candidate/Previews'
          if (Test-Path -LiteralPath $out) { Remove-Item -LiteralPath $out -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          & $env:BLENDER_EXE --background --factory-startup --python-exit-code 1 `
            --python tools/render_haolan_candidate_turnaround.py -- `
            --avatar $env:HAOLAN_AVATAR `
            --outfit $env:HAOLAN_OUTFIT `
            --outdir $out `
            --resolution 1024
          if ($LASTEXITCODE -ne 0) { throw "Five-view render failed with exit code $LASTEXITCODE" }

          uv run --no-cache --no-project --with pillow python tools/compose_turnaround.py `
            --input-dir $out `
            --output "$out/HAOLAN_BordeauxKnitSet_multiview.webp"
          if ($LASTEXITCODE -ne 0) { throw 'Five-view WebP composition failed' }

      - name: Verify preview evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'Published/haolan/candidate/Previews'
          $required = @(
            'front.png',
            'back.png',
            'left.png',
            'right.png',
            'three-quarter.png',
            'HAOLAN_BordeauxKnitSet_multiview.webp',
            'preview-manifest.json'
          )
          foreach ($name in $required) {
            $path = Join-Path $root $name
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Missing preview evidence: $path" }
            if ((Get-Item -LiteralPath $path).Length -le 0) { throw "Empty preview evidence: $path" }
          }
          $manifest = Get-Content -LiteralPath (Join-Path $root 'preview-manifest.json') -Raw | ConvertFrom-Json
          if ($manifest.renderType -ne 'actual-imported-candidate') { throw 'Preview is not an actual imported-candidate render' }
          foreach ($view in @('front', 'back', 'left', 'right', 'three-quarter')) {
            if (-not $manifest.views.$view) { throw "Manifest is missing view: $view" }
          }

      - name: Commit five-view preview
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'Published/haolan/candidate/Previews'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- $root
          if (git diff --cached --quiet) {
            Write-Host 'Five-view preview already matches the committed candidate.'
            exit 0
          }
          git commit -m 'Add HAOLAN Bordeaux five-view preview'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Upload preview evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: haolan-bordeaux-five-view-${{ github.run_id }}
          path: Published/haolan/candidate/Previews
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
