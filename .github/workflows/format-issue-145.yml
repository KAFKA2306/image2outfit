name: Format issue 145

on:
  pull_request:
    paths:
      - ".github/workflows/format-issue-145.yml"
      - "src/image2outfit/quality.py"
      - "tests/test_quality_spec.py"
      - "tests/test_review_console_v2.py"
      - "tools/release_orchestrator.py"
      - "tools/review_console.py"

permissions:
  contents: write

concurrency:
  group: format-issue-145-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  format:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/issue-145-quality-spec'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.32"

      - name: Format exact QualitySpec change set
        run: |
          uv run --locked --no-default-groups --group dev ruff format \
            src/image2outfit/quality.py \
            tests/test_quality_spec.py \
            tests/test_review_console_v2.py \
            tools/release_orchestrator.py \
            tools/review_console.py

      - name: Commit formatting only when needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/image2outfit/quality.py \
            tests/test_quality_spec.py \
            tests/test_review_console_v2.py \
            tools/release_orchestrator.py \
            tools/review_console.py
          git commit -m "style: apply Ruff formatting to QualitySpec changes"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
