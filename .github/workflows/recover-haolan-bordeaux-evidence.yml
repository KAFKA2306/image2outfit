name: Recover HAOLAN Bordeaux render evidence

on:
  pull_request:
    paths:
      - .github/workflows/recover-haolan-bordeaux-evidence.yml

permissions:
  contents: write

concurrency:
  group: recover-haolan-bordeaux-evidence
  cancel-in-progress: false

jobs:
  recover:
    runs-on: [self-hosted, windows]
    timeout-minutes: 120
    steps:
      - name: Check out PR head without deleting licensed local sources
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          clean: false
          persist-credentials: true
          fetch-depth: 0

      - name: Locate Blender and exact HAOLAN source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $blenderCandidates = @()
          if ($env:BLENDER_EXE) { $blenderCandidates += $env:BLENDER_EXE }
          $command = Get-Command blender -ErrorAction SilentlyContinue
          if ($command) { $blenderCandidates += $command.Source }
          $blenderCandidates += @(
            'C:/Program Files/Blender Foundation/Blender 4.4/blender.exe',
            'C:/Program Files/Blender Foundation/Blender 4.3/blender.exe',
            'C:/Program Files/Blender Foundation/Blender 4.2/blender.exe'
          )
          $blender = $blenderCandidates |
            Where-Object { $_ -and (Test-Path -LiteralPath $_ -PathType Leaf) } |
            Select-Object -First 1
          if (-not $blender) { throw 'Blender executable was not found on the self-hosted runner' }

          $avatar = Get-ChildItem -Path . -Filter 'HAOLAN_Lowpoly.fbx' -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object {
              $_.FullName -notmatch '\\Assets\\GenWorks\\' -and
              $_.FullName -notmatch '\\.git\\'
            } |
            Select-Object -First 1
          if (-not $avatar) { throw 'Local licensed HAOLAN_Lowpoly.fbx was not found' }

          "BLENDER_EXE=$blender" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "HAOLAN_AVATAR=$($avatar.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Rebuild exact Bordeaux candidate when needed
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expectedHash = '02df9c5c8223f1c9b146cc8db2f2648d5bd1ef185569851f6603a0b67099b69a'
          $outfit = $null
          $candidates = Get-ChildItem -Path . -Filter 'HAOLAN_BordeauxKnitSet.fbx' -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch '\\.git\\' }
          foreach ($candidate in $candidates) {
            $hash = (Get-FileHash -LiteralPath $candidate.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($hash -eq $expectedHash) {
              $outfit = $candidate
              break
            }
          }

          if (-not $outfit) {
            $jobDir = 'Assets/_Local/Jobs/haolan-bordeaux-recovery'
            $generatedDir = 'Assets/_Local/Generated/haolan-bordeaux-recovery'
            New-Item -ItemType Directory -Force -Path $jobDir, $generatedDir | Out-Null
            $jobPath = Join-Path $jobDir 'job.json'
            $job = [ordered]@{
              targetSourcePath = $env:HAOLAN_AVATAR
              blendPath = "$generatedDir/HAOLAN_BordeauxKnitSet.blend"
              fbxAssetPath = "$generatedDir/HAOLAN_BordeauxKnitSet.fbx"
            }
            $job | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath $jobPath -Encoding utf8
            & $env:BLENDER_EXE --background --factory-startup --python-exit-code 1 --python tools/haolan_knit_build.py -- --job $jobPath
            if ($LASTEXITCODE -ne 0) { throw "Bordeaux candidate rebuild failed with exit code $LASTEXITCODE" }
            $outfit = Get-Item -LiteralPath "$generatedDir/HAOLAN_BordeauxKnitSet.fbx"
          }

          if (-not $outfit) { throw 'HAOLAN_BordeauxKnitSet.fbx is unavailable' }
          "HAOLAN_OUTFIT=$($outfit.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Render actual five-view rejected evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $run = "2026-09-05-recovered-$env:GITHUB_RUN_ID"
          $root = "Assets/GenWorks/haolan-bordeaux-knit-set/Evidence/Rejected/$run"
          $out = Join-Path $root 'Previews'
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          & $env:BLENDER_EXE --background --factory-startup --python-exit-code 1 `
            --python tools/render_haolan_candidate_turnaround.py -- `
            --avatar $env:HAOLAN_AVATAR `
            --outfit $env:HAOLAN_OUTFIT `
            --outdir $out `
            --resolution 1024
          if ($LASTEXITCODE -ne 0) { throw "Five-view render failed with exit code $LASTEXITCODE" }

          uv run --no-cache --no-project --with pillow python tools/compose_turnaround.py `
            --input-dir $out `
            --output "$out/HAOLAN_BordeauxKnitSet_multiview.webp"
          if ($LASTEXITCODE -ne 0) { throw 'Five-view WebP composition failed' }

          $provenance = [ordered]@{
            schemaVersion = 1
            productId = 'haolan-bordeaux-knit-set'
            classification = 'recovered-real-render-evidence'
            recoveredAt = (Get-Date).ToUniversalTime().ToString('o')
            sourceAvatarRedistributed = $false
            expectedOutfitSha256 = '02df9c5c8223f1c9b146cc8db2f2648d5bd1ef185569851f6603a0b67099b69a'
            productStateUnaffected = $true
            visualGateUnaffected = $true
            reason = 'Production Pages had no render evidence for this REJECTED manual-recovery product.'
          }
          $provenance | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $root 'publication-evidence.json') -Encoding utf8
          "RECOVERY_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Commit recovered evidence to the PR branch
        shell: pwsh
        env:
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- $env:RECOVERY_ROOT
          if (git diff --cached --quiet) {
            Write-Host 'Recovered render evidence already matches the branch.'
            exit 0
          }
          git commit -m 'Recover HAOLAN Bordeaux real render evidence'
          git push origin "HEAD:$env:PR_BRANCH"
