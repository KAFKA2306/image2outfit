name: Temporary merge-release formatter

on:
  push:
    branches: [ci/merge-release-boundary-v2]
    paths:
      - .github/workflows/tmp-format-merge-release.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: '0.11.32'
          enable-cache: true

      - name: Restore narrow branch-governance diff
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:.github/workflows/branch-hygiene.yml > .github/workflows/branch-hygiene.yml
          python - <<'PY'
          import json
          from pathlib import Path

          workflow = Path('.github/workflows/branch-hygiene.yml')
          text = workflow.read_text(encoding='utf-8')
          replacements = (
              ('async function releasePolicyState(pr)', 'async function mergeGateState(pr)'),
              ('.filter(run => run.name === "Release policy tests")', '.filter(run => run.name === "PR merge gate")'),
              ('policy: await releasePolicyState(pr),', 'policy: await mergeGateState(pr),'),
              ('Release policy tests check', 'PR merge gate check'),
          )
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'missing expected branch-hygiene token: {old}')
              text = text.replace(old, new)
          workflow.write_text(text, encoding='utf-8')

          policy = Path('config/pr-merge-policy.json')
          payload = json.loads(policy.read_text(encoding='utf-8'))
          payload.pop('branchLifecycle', None)
          policy.write_text(json.dumps(payload, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Apply Ruff formatting
        run: >-
          uv run --locked --no-default-groups --group dev ruff format
          tests/test_release_provenance_gate.py
          tools/audit_repository_hygiene.py
          tools/pr_merge_gate.py

      - name: Commit canonicalized result and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-format-merge-release.yml
          git add .github/workflows/branch-hygiene.yml config/pr-merge-policy.json \
            tests/test_release_provenance_gate.py tools/audit_repository_hygiene.py \
            tools/pr_merge_gate.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style: canonicalize merge-release boundary'
          git push origin HEAD:ci/merge-release-boundary-v2
