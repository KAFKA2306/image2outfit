name: Rename Legacy Published folder to Snapshots

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/run/rename-published-folder.txt

permissions:
  contents: write

concurrency:
  group: rename-legacy-published-to-snapshots
  cancel-in-progress: false

jobs:
  rename:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
          fetch-depth: 0

      - name: Rename Unity-visible legacy folder and references
        shell: bash
        run: |
          set -euo pipefail

          src='Assets/GenWorks/Legacy/Published'
          dst='Assets/GenWorks/Legacy/Snapshots'

          if [ -d "$src" ]; then
            mkdir -p "$dst"
            rm -rf "$dst/haolan" "$dst/LegacyManifest.json" "$dst/README.md" "$dst/.gitkeep"
            shopt -s dotglob nullglob
            git mv "$src"/* "$dst"/
            rmdir "$src"
          fi

          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          replacements = {
              'Assets/GenWorks/Legacy/Published': 'Assets/GenWorks/Legacy/Snapshots',
              'Legacy/Published': 'Legacy/Snapshots',
              r'\\Assets\\GenWorks\\Legacy\\Published\\': r'\\Assets\\GenWorks\\Legacy\\Snapshots\\',
          }

          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              updated = text
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding='utf-8', newline='')

          manifest = Path('Assets/GenWorks/Legacy/Snapshots/LegacyManifest.json')
          manifest.write_text(
              json.dumps(
                  {
                      'schemaVersion': 1,
                      'canonicalPath': 'Assets/GenWorks/Legacy/Snapshots',
                      'migratedFrom': 'Published',
                      'migratedOn': '2026-08-02',
                      'unityVisible': True,
                      'classification': 'legacy-snapshot',
                      'releaseEligible': False,
                      'decision': 'NO-GO',
                      'reason': 'Historical snapshots retained for Unity inspection and reproducibility without keeping a Unity-visible folder named Published; mandatory human review, pose, and VRChat runtime gates are incomplete.',
                  },
                  ensure_ascii=False,
                  indent=2,
              ) + '\n',
              encoding='utf-8',
              newline='',
          )

          readme = Path('Assets/GenWorks/Legacy/Snapshots/README.md')
          readme.write_text(
              '# Legacy snapshots\n\n'
              'This directory contains historical image2outfit snapshots moved from the repository-root `Published/` directory so Unity can import and inspect them under `Assets/` without keeping a Unity-visible folder named `Published`.\n\n'
              '- Existing file blobs and committed Unity `.meta` files are preserved.\n'
              '- These files are retained for reproducibility, visual inspection, and hash verification.\n'
              '- They are not current customer releases and must not be promoted automatically.\n'
              '- New products belong in `Assets/GenWorks/Products/<product-slug>/` and require the full release evidence gates.\n',
              encoding='utf-8',
              newline='',
          )
          PY

          test ! -d Assets/GenWorks/Legacy/Published
          test -f Assets/GenWorks/Legacy/Snapshots/haolan/cow-hood-knit-set-v1/HAOLAN_CowHoodKnitSet.prefab
          test -f Assets/GenWorks/Legacy/Snapshots/haolan/cow-hood-knit-set-v1/HAOLAN_CowHoodKnitSet.fbx
          test -f Assets/GenWorks/Legacy/Snapshots/haolan/cow-hood-knit-set-v1/audit.json

          if find Assets/GenWorks/Legacy -type d -name Published | grep -q .; then
            echo 'Published directory still exists under Assets/GenWorks/Legacy' >&2
            exit 1
          fi

      - name: Validate references
        shell: bash
        run: |
          set -euo pipefail
          if grep -R "Assets/GenWorks/Legacy/Published\|Legacy/Published" -n README.md Taskfile.yml docs .github Assets/GenWorks config tools tests 2>/dev/null; then
            echo 'Stale Legacy/Published references remain' >&2
            exit 1
          fi
          python -m json.tool Assets/GenWorks/Legacy/Snapshots/LegacyManifest.json >/dev/null

      - name: Commit rename
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No rename changes to commit.'
            exit 0
          fi
          git commit -m 'Rename legacy Published folder to Snapshots'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 2))
          done
          exit 1
