name: Remote static verification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/run/haolan-static.txt

permissions:
  contents: write

concurrency:
  group: haolan-remote-static
  cancel-in-progress: true

jobs:
  verify:
    runs-on: [self-hosted, windows]
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
          persist-credentials: true
          fetch-depth: 1

      - uses: arduino/setup-task@v2

      - name: Require ignored HAOLAN source
        shell: pwsh
        run: |
          if (!(Test-Path -LiteralPath "Assets/HAOLAN_Quest/FBX/HAOLAN_Lowpoly.fbx")) { throw "HAOLAN source is required under the ignored Assets/HAOLAN_Quest path" }
          if (!(Test-Path -LiteralPath "Assets/HAOLAN_Quest/HAOLAN_Lowpoly Variant.prefab")) { throw "HAOLAN prefab is required under the ignored Assets/HAOLAN_Quest path" }
          foreach ($generatedPath in @("Assets/_Local/Generated/haolan", "Artifacts/haolan", "Delivery/haolan")) {
            if (Test-Path -LiteralPath $generatedPath) {
              Remove-Item -LiteralPath $generatedPath -Recurse -Force
            }
          }
          New-Item -ItemType Directory -Force -Path "Assets/_Local/Jobs/haolan" | Out-Null
          New-Item -ItemType Directory -Force -Path "Artifacts/haolan" | Out-Null
          Copy-Item -LiteralPath "config/haolan-job.template.json" -Destination "Assets/_Local/Jobs/haolan/job.json" -Force
          Copy-Item -LiteralPath "config/haolan-license.json" -Destination "Artifacts/haolan/license.json" -Force

      - name: Run Blender and Unity static verification
        shell: pwsh
        run: task verify:static JOB=Assets/_Local/Jobs/haolan/job.json

      - name: Publish verified delivery candidate
        shell: pwsh
        run: |
          $sourceRoot = "Delivery/haolan"
          $sourceAssets = Join-Path $sourceRoot "UnityAssets"
          $sourceAudit = Join-Path $sourceRoot "audit.json"
          $publishRoot = "Published/haolan/latest"

          if (!(Test-Path -LiteralPath $sourceAssets)) { throw "Generated UnityAssets were not produced" }
          if (!(Test-Path -LiteralPath $sourceAudit)) { throw "Generated audit.json was not produced" }

          if (Test-Path -LiteralPath $publishRoot) {
            Remove-Item -LiteralPath $publishRoot -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $publishRoot | Out-Null
          Copy-Item -LiteralPath $sourceAssets -Destination (Join-Path $publishRoot "UnityAssets") -Recurse -Force
          Copy-Item -LiteralPath $sourceAudit -Destination (Join-Path $publishRoot "audit.json") -Force
          Copy-Item -LiteralPath "config/haolan-license.json" -Destination (Join-Path $publishRoot "license.json") -Force

          $forbiddenNames = @("HAOLAN_Lowpoly.fbx", "HAOLAN_Lowpoly Variant.prefab")
          $leaks = Get-ChildItem -LiteralPath $publishRoot -Recurse -File | Where-Object { $forbiddenNames -contains $_.Name }
          if ($leaks) {
            $leakList = ($leaks.FullName -join ", ")
            throw "Licensed avatar source leaked into publish tree: $leakList"
          }

          $audit = Get-Content -LiteralPath $sourceAudit -Raw | ConvertFrom-Json
          $decision = if ($audit.decision) { [string]$audit.decision } else { "UNSPECIFIED" }
          $status = @(
            "# HAOLAN delivery candidate",
            "",
            "- Generated by GitHub Actions run: $env:GITHUB_RUN_ID",
            "- Source commit: $env:GITHUB_SHA",
            "- Published at UTC: $([DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ'))",
            "- Audit decision: $decision",
            "- Licensed HAOLAN avatar source included: no",
            "",
            "This directory contains generated garment assets and audit evidence only. It is a delivery candidate until all runtime and VRChat gates in audit.json pass."
          ) -join "`n"
          Set-Content -LiteralPath (Join-Path $publishRoot "STATUS.md") -Value $status -Encoding utf8

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f -- $publishRoot
          git commit -m "Publish HAOLAN delivery candidate"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Upload generated outfit and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: haolan-static-outfit-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            Artifacts/haolan
            Delivery/haolan/audit.json
            Delivery/haolan/UnityAssets
            Published/haolan/latest
