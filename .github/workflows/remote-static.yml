name: Remote static verification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/run/haolan-static.txt

permissions:
  contents: read

concurrency:
  group: haolan-remote-static
  cancel-in-progress: false

jobs:
  verify:
    runs-on: [self-hosted, windows]
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
          persist-credentials: false
          fetch-depth: 1

      - uses: arduino/setup-task@v2

      - name: Require ignored HAOLAN source
        shell: pwsh
        run: |
          if (!(Test-Path -LiteralPath "Assets/HAOLAN_Quest/FBX/HAOLAN_Lowpoly.fbx")) { throw "HAOLAN source is required under the ignored Assets/HAOLAN_Quest path" }
          if (!(Test-Path -LiteralPath "Assets/HAOLAN_Quest/HAOLAN_Lowpoly Variant.prefab")) { throw "HAOLAN prefab is required under the ignored Assets/HAOLAN_Quest path" }
          New-Item -ItemType Directory -Force -Path "Assets/_Local/Jobs/haolan" | Out-Null
          Copy-Item -LiteralPath "config/haolan-job.template.json" -Destination "Assets/_Local/Jobs/haolan/job.json" -Force

      - name: Run Blender and Unity static verification
        shell: pwsh
        run: task verify:static JOB=Assets/_Local/Jobs/haolan/job.json

      - name: Upload generated outfit and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: haolan-static-outfit-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            Artifacts/haolan
            Delivery/haolan/audit.json
            Delivery/haolan/UnityAssets
