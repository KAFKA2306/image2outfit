name: GenWorks Siroino Render Loop

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/genworks-siroino-render-loop.yml
      - tools/siroino_wide_cargo_release_refit.py
      - config/siroino-wide-cargo-job.json

permissions:
  contents: write

concurrency:
  group: genworks-siroino-render-loop
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record render run start
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/status
          cat > .github/status/genworks-siroino-render-loop.json <<JSON
          {
            "schemaVersion": 1,
            "runId": ${GITHUB_RUN_ID},
            "runAttempt": ${GITHUB_RUN_ATTEMPT},
            "headSha": "${GITHUB_SHA}",
            "status": "running",
            "url": "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          }
          JSON
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/status/genworks-siroino-render-loop.json
          git commit -m "Record GenWorks Siroino render ${GITHUB_RUN_ID} start" || exit 0
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      - name: Install Blender runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xz-utils libxi6 libxrender1 libxfixes3 libxkbcommon0 libsm6 \
            libgl1 libegl1 libx11-6 libxxf86vm1

      - name: Download pinned Blender 4.4.3
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-all-errors \
            https://download.blender.org/release/Blender4.4/blender-4.4.3-linux-x64.tar.xz \
            --output blender.tar.xz
          mkdir -p .image2outfit/blender
          tar -xJf blender.tar.xz --strip-components=1 -C .image2outfit/blender
          .image2outfit/blender/blender --background --factory-startup --python-expr \
            "import bpy,platform; assert bpy.app.version_string.split()[0]=='4.4.3'; assert platform.python_version()=='3.11.11'"

      - name: Restore pinned Blender Python packages
        run: |
          set -euo pipefail
          python_exe=.image2outfit/blender/4.4/python/bin/python3.11
          "$python_exe" -m ensurepip
          "$python_exe" -m pip install --disable-pip-version-check --no-deps --only-binary=:all: \
            -r config/blender-python-requirements.txt

      - name: Generate meshes and five-view renders
        id: generate
        shell: bash
        run: |
          set -o pipefail
          mkdir -p Artifacts/siroino-wide-cargo
          .image2outfit/blender/blender \
            --background \
            --factory-startup \
            --python-exit-code 1 \
            --python tools/siroino_wide_cargo_release_refit.py \
            -- \
            --job config/siroino-wide-cargo-job.json \
            2>&1 | tee Artifacts/siroino-wide-cargo/hosted-blender.log

      - name: Render exact-body poses when blend exists
        if: always()
        shell: bash
        run: |
          set -o pipefail
          blend=Assets/GenWorks/Products/siroino-wide-cargo/Source/Blender/SiroinoWideCargo.blend
          if [ ! -f "$blend" ]; then
            echo "Blend file was not generated; pose render skipped."
            exit 0
          fi
          .image2outfit/blender/blender \
            --background "$blend" \
            --python-exit-code 1 \
            --python tools/siroino_required_pose_entry.py \
            -- \
            --job config/siroino-wide-cargo-job.json \
            2>&1 | tee Artifacts/siroino-wide-cargo/hosted-poses.log

      - name: Upload render evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genworks-siroino-render-${{ github.run_id }}
          path: |
            Artifacts/siroino-wide-cargo
            Assets/GenWorks/Products/siroino-wide-cargo
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Commit passing modeled assets
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          python tools/update_product_hashes.py \
            --root Assets/GenWorks/Products/siroino-wide-cargo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f Assets/GenWorks/Products/siroino-wide-cargo
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Model Siroino wide cargo outfit"
          for attempt in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 3))
          done
          exit 1
