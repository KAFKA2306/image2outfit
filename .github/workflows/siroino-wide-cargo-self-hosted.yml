name: Build Siroino Wide Cargo

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/run/siroino-wide-cargo.txt

permissions:
  contents: write

concurrency:
  group: image2outfit-siroino-wide-cargo-v4
  cancel-in-progress: true

jobs:
  build:
    runs-on: [self-hosted, windows]
    timeout-minutes: 180

    steps:
      - name: Checkout without deleting local avatar sources
        uses: actions/checkout@v4
        with:
          clean: false
          persist-credentials: true
          fetch-depth: 0

      - uses: arduino/setup-task@v2

      - name: Prepare full and bootstrap jobs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $jobRoot = 'Assets/_Local/Jobs/siroino-wide-cargo'
          $evidenceRoot = 'Assets/_Local/Evidence/siroino-wide-cargo'
          New-Item -ItemType Directory -Force -Path $jobRoot, $evidenceRoot, 'Artifacts/siroino-wide-cargo' | Out-Null
          Copy-Item -LiteralPath 'config/siroino-wide-cargo-job.json' -Destination "$jobRoot/job.json" -Force
          $job = Get-Content -LiteralPath "$jobRoot/job.json" -Raw | ConvertFrom-Json
          $job.deliveryAssets = @($job.deliveryAssets | Where-Object { $_ -notmatch '/Materials/' })
          $job | ConvertTo-Json -Depth 20 | Set-Content -LiteralPath "$jobRoot/job.bootstrap.json" -Encoding utf8
          "JOB_FULL=$jobRoot/job.json" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "JOB_BOOTSTRAP=$jobRoot/job.bootstrap.json" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PRODUCT_ROOT=Assets/GenWorks/Products/siroino-wide-cargo" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ARTIFACT_DIR=Artifacts/siroino-wide-cargo" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "IMAGE2OUTFIT_RUN_ID=$env:GITHUB_RUN_ID" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Restore pinned VPM packages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Command vpm -ErrorAction SilentlyContinue)) {
            throw 'The official VPM CLI is required on the image2outfit runner'
          }
          $repoOutput = (& vpm list repos 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) { throw "vpm list repos failed: $repoOutput" }
          foreach ($repo in @('https://vpm.nadena.dev/vpm.json', 'https://vpm.anatawa12.com/vpm.json')) {
            if ($repoOutput -notmatch [regex]::Escape($repo)) {
              & vpm add repo $repo
              if ($LASTEXITCODE -ne 0) { throw "Could not add VPM repository: $repo" }
            }
          }
          & vpm resolve project .
          if ($LASTEXITCODE -ne 0) { throw 'vpm resolve project failed' }

      - name: Build Blender and Modular Avatar candidate
        shell: pwsh
        run: task candidate JOB="$env:JOB_BOOTSTRAP"

      - name: Render all release-policy poses
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $blender = if ($env:BLENDER_EXE) { $env:BLENDER_EXE } else { 'C:/Program Files/Blender Foundation/Blender 4.4/blender.exe' }
          if (-not (Test-Path -LiteralPath $blender -PathType Leaf)) { throw "Blender not found: $blender" }
          $dependencyTarget = Join-Path (Get-Location) '.image2outfit/blender-python'
          $env:PYTHONPATH = if ($env:PYTHONPATH) { "$dependencyTarget;$env:PYTHONPATH" } else { $dependencyTarget }
          $blend = "$env:PRODUCT_ROOT/Source/Blender/SiroinoWideCargo.blend"
          & $blender --python-use-system-env --background $blend --python-exit-code 1 --python tools/siroino_required_pose_render.py -- --job $env:JOB_FULL
          if ($LASTEXITCODE -ne 0) { throw 'Required pose rendering failed' }

      - name: Run VRChat SDK Build and Test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $unity = if ($env:UNITY_EXE) { $env:UNITY_EXE } else { 'C:/Program Files/Unity/Hub/Editor/2022.3.22f1/Editor/Unity.exe' }
          if (-not (Test-Path -LiteralPath $unity -PathType Leaf)) { throw "Unity not found: $unity" }
          & $unity -batchmode -projectPath . -executeMethod Image2Outfit.Editor.Pipeline.Run -image2outfitJob $env:JOB_FULL -logFile "$env:ARTIFACT_DIR/unity-build-test.log"
          if ($LASTEXITCODE -ne 0) { throw "VRChat Build and Test failed with exit code $LASTEXITCODE" }
          $runtime = Get-Content -LiteralPath "$env:ARTIFACT_DIR/vrchat-build-test.json" -Raw | ConvertFrom-Json
          if (-not [bool]$runtime.passed) { throw "VRChat Build and Test report is not PASS: $($runtime.error)" }

      - name: Extract external product materials
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $unity = if ($env:UNITY_EXE) { $env:UNITY_EXE } else { 'C:/Program Files/Unity/Hub/Editor/2022.3.22f1/Editor/Unity.exe' }
          & $unity -batchmode -projectPath . -executeMethod GenWorks.Editor.GenWorksMaterialExtractor.RunFromCommandLine -image2outfitJob $env:JOB_FULL -image2outfitArtifactDir $env:ARTIFACT_DIR -logFile "$env:ARTIFACT_DIR/unity-materials.log"
          if ($LASTEXITCODE -ne 0) { throw "Material extraction failed with exit code $LASTEXITCODE" }
          $report = Get-Content -LiteralPath "$env:ARTIFACT_DIR/materials.json" -Raw | ConvertFrom-Json
          if (-not [bool]$report.passed) { throw "Material extraction report is not PASS: $($report.errors -join '; ')" }

      - name: Capture local VRChat runtime screen
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Start-Sleep -Seconds 8
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          $bounds = [System.Windows.Forms.SystemInformation]::VirtualScreen
          $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          try {
            $graphics.CopyFromScreen($bounds.Left, $bounds.Top, 0, 0, $bitmap.Size)
            $path = Join-Path (Get-Location) "$env:PRODUCT_ROOT/Previews/runtime-vrchat.png"
            $bitmap.Save($path, [System.Drawing.Imaging.ImageFormat]::Png)
          } finally {
            $graphics.Dispose()
            $bitmap.Dispose()
          }
          if (-not (Test-Path -LiteralPath "$env:PRODUCT_ROOT/Previews/runtime-vrchat.png" -PathType Leaf)) {
            throw 'VRChat runtime screenshot was not created'
          }

      - name: Mark product review required
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import json
          from pathlib import Path
          path = Path('Assets/GenWorks/Products/siroino-wide-cargo/ProductManifest.json')
          data = json.loads(path.read_text(encoding='utf-8-sig'))
          data['status'] = 'REVIEW_REQUIRED'
          data['technicalGates'] = {
              'blender': 'PASS',
              'unityImport': 'PASS',
              'modularAvatar': 'PASS',
              'vrchatBuildAndTest': 'PASS',
              'humanVisualReview': 'PENDING',
              'humanPoseReview': 'PENDING',
              'humanRuntimeReview': 'PENDING',
          }
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          '@ | python -

      - name: Refresh product source hashes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          uv run --no-cache --no-project python tools/update_product_hashes.py --root $env:PRODUCT_ROOT
          if ($LASTEXITCODE -ne 0) { throw 'Product hash inventory failed' }

      - name: Commit generated public product assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- $env:PRODUCT_ROOT
          if (git diff --cached --quiet) { throw 'Build produced no changed product assets' }
          git commit -m 'Build Siroino wide cargo candidate'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          "BUILT_COMMIT=$(git rev-parse HEAD)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Refresh immutable candidate after post-processing
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:GITHUB_SHA = $env:BUILT_COMMIT
          uv run --no-cache --no-project python tools/refresh_candidate_manifest.py --job $env:JOB_FULL |
            Tee-Object -FilePath "$env:ARTIFACT_DIR/candidate-sha256.txt"
          if ($LASTEXITCODE -ne 0) { throw 'Candidate manifest refresh failed' }

      - name: Upload candidate and review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: siroino-wide-cargo-${{ github.run_id }}
          path: |
            Artifacts/siroino-wide-cargo
            Candidates/siroino-wide-cargo
            Assets/GenWorks/Products/siroino-wide-cargo/Previews
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
