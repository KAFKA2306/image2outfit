name: Materialize reviewed Cyber Kawaii v5 artifact once

on:
  push:
    branches:
      - work/cyber-kawaii-shape-profile-v3
    paths:
      - .github/workflows/materialize-cyber-kawaii-v5.yml

permissions:
  actions: read
  contents: write

concurrency:
  group: materialize-cyber-kawaii-v5
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/cyber-kawaii-shape-profile-v3
          fetch-depth: 0
          persist-credentials: true

      - name: Download reviewed hosted artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-all-errors \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/8830723589/zip" \
            --output /tmp/cyber-kawaii-v5.zip
          rm -rf /tmp/cyber-kawaii-v5
          mkdir -p /tmp/cyber-kawaii-v5
          unzip -q /tmp/cyber-kawaii-v5.zip -d /tmp/cyber-kawaii-v5

      - name: Verify shape profile, weights, geometry, and clearance
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import shutil
          from pathlib import Path

          extracted = Path('/tmp/cyber-kawaii-v5')
          report = json.loads(
              (extracted / 'Artifacts/siroino-cyber-kawaii-large/product-build-report.json')
              .read_text(encoding='utf-8')
          )
          if report.get('passed') is not True:
              raise SystemExit('Hosted product build did not pass')
          expected = {
              'All_L': 1.0,
              'Chest_L': 1.0,
              'Hips_01_L': 1.0,
              'UpperLeg_L': 1.0,
              'Breasts_L': 0.65,
          }
          profile = report.get('targetProfile', {})
          if profile.get('profileMode') != 'shape-key-bake':
              raise SystemExit(f'Unexpected profile mode: {profile}')
          if profile.get('appliedShapeKeys') != expected:
              raise SystemExit(f'Shape-profile mismatch: {profile.get("appliedShapeKeys")}')
          metrics = report.get('metrics', {})
          required = {
              'unweightedVertices': 0,
              'weightSumErrors': 0,
              'degenerateTriangles': 0,
          }
          for name, expected_value in required.items():
              if metrics.get(name) != expected_value:
                  raise SystemExit(f'{name}: {metrics.get(name)}')
          if metrics.get('maxBoneInfluences', 99) > 4:
              raise SystemExit(f'More than four bone influences: {metrics.get("maxBoneInfluences")}')
          audits = report.get('skirtWeightTransfer', {})
          if len(audits) != 4:
              raise SystemExit(f'Expected four skirt audits: {audits}')
          for name, audit in audits.items():
              if audit.get('fallbackVertices') != 0:
                  raise SystemExit(f'{name} has fallback vertices: {audit}')
              if audit.get('maximumInfluences', 99) > 4:
                  raise SystemExit(f'{name} exceeds four influences: {audit}')
          clearance = report.get('improvementLoop', [])[-1].get('clearance', {}).get('p01', 0)
          if clearance < 0.005:
              raise SystemExit(f'p01 clearance below 5 mm: {clearance}')

          source = extracted / 'Assets/GenWorks/siroino-cyber-kawaii-large'
          target = Path('Assets/GenWorks/siroino-cyber-kawaii-large')
          shutil.rmtree(target, ignore_errors=True)
          shutil.copytree(source, target)
          PY

      - name: Commit reviewed checkpoint and remove one-shot workflow
        run: |
          set -euo pipefail
          rm -f .github/workflows/materialize-cyber-kawaii-v5.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- Assets/GenWorks/siroino-cyber-kawaii-large .github/workflows/materialize-cyber-kawaii-v5.yml
          git commit -m 'build: materialize reviewed Cyber Kawaii Large shape-profile checkpoint'
          git push origin HEAD:work/cyber-kawaii-shape-profile-v3
