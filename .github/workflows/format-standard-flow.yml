name: One-shot standard flow formatter

on:
  push:
    branches:
      - "feat/standard-flow-380"

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/standard-flow-380
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: python -m pip install "uv>=0.8,<0.9"
      - name: Format changed Python
        run: |
          uv run --locked --no-default-groups --group dev ruff format             src/image2outfit/garment_flow.py             tests/test_standard_garment_flow.py             tools/run_reference_product_stage.py             tools/siroino_tuxedo_halter_dress_large_build.py
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             src/image2outfit/garment_flow.py             tests/test_standard_garment_flow.py             tools/run_reference_product_stage.py             tools/siroino_tuxedo_halter_dress_large_build.py
          git commit -m "style: format standard flow"
          git push origin HEAD:feat/standard-flow-380
