name: Branch hygiene

on:
  push:
    branches: [main]
  pull_request:
    types: [closed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: branch-hygiene
  cancel-in-progress: false

jobs:
  delete-merged-branches:
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Fetch all branches
        shell: bash
        run: git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune

      - name: Delete merged pull-request branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$HEAD_BRANCH" ] && [ "$HEAD_BRANCH" != 'main' ]; then
            git push origin --delete "$HEAD_BRANCH" || true
          fi

      - name: Delete every branch already contained in main
        shell: bash
        run: |
          set -euo pipefail
          git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin/ |
            while IFS= read -r branch; do
              if [ -z "$branch" ] || [ "$branch" = 'main' ] || [ "$branch" = 'HEAD' ]; then
                continue
              fi

              if git merge-base --is-ancestor "origin/$branch" origin/main; then
                echo "Deleting merged branch: $branch"
                git push origin --delete "$branch"
              fi
            done
