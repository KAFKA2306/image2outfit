name: Branch hygiene

on:
  push:
    branches: [main]
  pull_request:
    types: [closed]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

# This permission is used only by the Git refs delete API. The workflow never
# edits repository files, creates commits, or pushes content.
permissions:
  "contents": "write"

concurrency:
  group: branch-hygiene
  cancel-in-progress: false

jobs:
  delete-closed-and-merged-branches:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Delete closed or merged branches through GitHub API
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const protectedBranches = new Set(['main']);

            async function deleteBranch(branch, reason) {
              if (!branch || protectedBranches.has(branch)) return;
              try {
                await github.rest.git.deleteRef({
                  owner,
                  repo,
                  ref: `heads/${branch}`,
                });
                core.info(`Deleted ${reason} branch: ${branch}`);
              } catch (error) {
                if (error.status === 422 || error.status === 404) {
                  core.info(`Branch already absent or not deletable: ${branch}`);
                  return;
                }
                throw error;
              }
            }

            if (context.eventName === 'pull_request') {
              const pullRequest = context.payload.pull_request;
              if (
                pullRequest?.state === 'closed' &&
                pullRequest.head.repo.full_name === context.payload.repository.full_name
              ) {
                await deleteBranch(
                  pullRequest.head.ref,
                  pullRequest.merged ? 'merged' : 'closed/superseded',
                );
              }
              return;
            }

            const branches = await github.paginate(github.rest.repos.listBranches, {
              owner,
              repo,
              per_page: 100,
            });

            for (const branch of branches) {
              if (protectedBranches.has(branch.name) || branch.protected) continue;

              const pulls = await github.paginate(github.rest.pulls.list, {
                owner,
                repo,
                state: 'all',
                head: `${owner}:${branch.name}`,
                per_page: 100,
              });
              const hasOpenPullRequest = pulls.some((pull) => pull.state === 'open');
              const hasClosedPullRequest = pulls.some((pull) => pull.state === 'closed');

              if (hasOpenPullRequest) {
                core.info(`Keeping branch with open PR: ${branch.name}`);
                continue;
              }
              if (hasClosedPullRequest) {
                await deleteBranch(branch.name, 'closed/superseded');
                continue;
              }

              const comparison = await github.rest.repos.compareCommitsWithBasehead({
                owner,
                repo,
                basehead: `${branch.name}...main`,
              });

              if (comparison.data.status === 'ahead' || comparison.data.status === 'identical') {
                await deleteBranch(branch.name, 'merged');
              }
            }
