name: PR convergence and branch hygiene

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, edited, closed]
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report governance actions without mutating PRs or branches
        required: false
        type: boolean
        default: false

permissions:
  actions: read
  checks: read
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: pr-convergence-${{ github.repository }}
  cancel-in-progress: false

jobs:
  govern:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Detect direct main pushes, converge workstreams, and remove stale branches
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const dryRun = context.eventName === "workflow_dispatch" && core.getInput("dry_run") === "true";
            const allowedPrefixes = [
              "agent/",
              "fix/",
              "feat/",
              "work/",
              "release/",
              "ops/",
              "chore/",
              "ci/",
              "dependabot/",
            ];
            const protectedBranches = new Set(["main", "master", "gh-pages"]);
            const supersededMarker = "<!-- pr-convergence:superseded -->";
            const invalidBranchMarker = "<!-- pr-convergence:invalid-branch -->";
            const workstreamPlaceholder = "replace-with-product-slug-or-repository-scope";

            const repository = (await github.rest.repos.get({ owner, repo })).data;
            const defaultBranch = repository.default_branch;
            protectedBranches.add(defaultBranch);

            function isAllowedBranch(ref) {
              return allowedPrefixes.some(prefix => String(ref || "").startsWith(prefix));
            }

            async function allOpenPulls() {
              return github.paginate(github.rest.pulls.list, {
                owner,
                repo,
                state: "open",
                base: defaultBranch,
                per_page: 100,
              });
            }

            async function changedFiles(prNumber) {
              return github.paginate(github.rest.pulls.listFiles, {
                owner,
                repo,
                pull_number: prNumber,
                per_page: 100,
              });
            }

            function explicitWorkstream(body) {
              const match = String(body || "").match(/<!--\s*workstream:\s*([a-z0-9][a-z0-9._/-]*)\s*-->/i);
              const value = match ? match[1].toLowerCase() : null;
              return value && value !== workstreamPlaceholder ? value : null;
            }

            function supersededPullNumbers(body) {
              const values = new Set();
              const pattern = /<!--\s*supersedes:\s*#?(\d+)\s*-->/gi;
              for (const match of String(body || "").matchAll(pattern)) {
                values.add(Number(match[1]));
              }
              return values;
            }

            function normalizeBranch(ref) {
              let value = String(ref || "").toLowerCase().replace(/_/g, "-");
              value = value.replace(/^(agent|fix|feat|work|release|ops|chore|ci|dependabot)\//, "");
              value = value.replace(/^(re-?run|run|continue|finalize|validate|build|fix)-/, "");
              let previous;
              do {
                previous = value;
                value = value
                  .replace(/-(goal\d+)(?:-v?\d+)?$/, "")
                  .replace(/-(?:v|r)\d+(?:-final)?$/, "")
                  .replace(/-(?:final|release|checkpoint|retry|rerun|latest)$/, "");
              } while (value !== previous);
              return value || String(ref || "").toLowerCase();
            }

            async function workstreamKey(pr) {
              const files = await changedFiles(pr.number);
              const products = new Set();
              for (const file of files) {
                const path = file.filename;
                let match = path.match(/^Assets\/GenWorks\/(?:Products\/)?([^/]+)\//);
                if (!match) match = path.match(/^config\/products\/([^/]+)\//);
                if (match && !["legacy", "shared", "editor", "products"].includes(match[1].toLowerCase())) {
                  products.add(match[1].toLowerCase());
                }
              }

              // Product ownership is authoritative. A PR cannot evade convergence by choosing another marker.
              if (products.size === 1) return `product:${[...products][0]}`;

              const explicit = explicitWorkstream(pr.body);
              if (explicit) return `explicit:${explicit}`;
              return `branch:${normalizeBranch(pr.head.ref)}`;
            }

            async function releasePolicyState(pr) {
              const response = await github.rest.actions.listWorkflowRunsForRepo({
                owner,
                repo,
                event: "pull_request",
                head_sha: pr.head.sha,
                per_page: 100,
              });
              const runs = response.data.workflow_runs
                .filter(run => run.name === "Release policy tests")
                .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
              const latest = runs[0];
              if (!latest) return { state: "missing", url: null };
              if (latest.status !== "completed") return { state: "pending", url: latest.html_url };
              return { state: latest.conclusion === "success" ? "success" : "failure", url: latest.html_url };
            }

            async function deleteBranch(ref, reason, openPulls) {
              if (!ref || protectedBranches.has(ref)) return;
              if (openPulls.some(pr => pr.head.repo?.full_name === `${owner}/${repo}` && pr.head.ref === ref)) return;
              if (dryRun) {
                core.info(`[dry-run] delete branch ${ref}: ${reason}`);
                return;
              }
              try {
                await github.rest.git.deleteRef({ owner, repo, ref: `heads/${ref}` });
                core.info(`Deleted branch ${ref}: ${reason}`);
              } catch (error) {
                if (error.status === 404 || error.status === 422) {
                  core.info(`Branch ${ref} already absent or protected`);
                } else {
                  throw error;
                }
              }
            }

            async function ensureComment(prNumber, marker, body) {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: prNumber,
                per_page: 100,
              });
              if (!comments.some(comment => String(comment.body || "").includes(marker))) {
                await github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body });
              }
            }

            async function closePull(pr, reason, marker, openPulls) {
              if (dryRun) {
                core.info(`[dry-run] close #${pr.number}: ${reason}`);
              } else {
                await ensureComment(pr.number, marker, `${marker}\n${reason}`);
                await github.rest.pulls.update({ owner, repo, pull_number: pr.number, state: "closed" });
                core.info(`Closed PR #${pr.number}: ${reason}`);
              }
              const remainingOpen = openPulls.filter(candidate => candidate.number !== pr.number);
              if (pr.head.repo?.full_name === `${owner}/${repo}`) {
                await deleteBranch(pr.head.ref, `pull request #${pr.number} closed`, remainingOpen);
              }
              return remainingOpen;
            }

            async function guardDefaultBranchPush() {
              if (context.eventName !== "push" || context.ref !== `refs/heads/${defaultBranch}`) return false;
              const before = String(context.payload.before || "");
              const after = String(context.payload.after || "");
              if (!before || /^0+$/.test(before) || !after || before === after) return false;

              const associated = await github.paginate(
                github.rest.repos.listPullRequestsAssociatedWithCommit,
                { owner, repo, commit_sha: after, per_page: 100 },
              );
              const mergedThroughPull = associated.some(pr =>
                Boolean(pr.merged_at) && pr.base?.ref === defaultBranch && pr.merge_commit_sha === after,
              );
              if (mergedThroughPull) return false;

              const message = `Direct push ${after} to ${defaultBranch} was not produced by a merged pull request.`;
              if (dryRun) {
                core.warning(`[dry-run] ${message}`);
                return false;
              }
              await github.rest.issues.create({
                owner,
                repo,
                title: `Direct push detected on ${defaultBranch}: ${after.slice(0, 12)}`,
                body: [
                  "<!-- pr-governance:direct-push -->",
                  message,
                  `Previous SHA: \`${before}\``,
                  `Actor: \`${context.actor}\``,
                  "Enable a GitHub branch ruleset requiring pull requests and the Release policy tests check to block this before the ref moves.",
                ].join("\n\n"),
              });
              core.setFailed(message);
              return true;
            }

            if (await guardDefaultBranchPush()) return;

            let openPulls = await allOpenPulls();

            // Same-repository pull requests must use a managed branch namespace.
            for (const pr of [...openPulls]) {
              if (pr.head.repo?.full_name !== `${owner}/${repo}` || isAllowedBranch(pr.head.ref)) continue;
              const reason = `Branch \`${pr.head.ref}\` is not allowed. Use one of: ${allowedPrefixes.map(prefix => `\`${prefix}\``).join(", ")}.`;
              openPulls = await closePull(pr, reason, invalidBranchMarker, openPulls);
            }

            const keyed = [];
            for (const pr of openPulls) {
              keyed.push({
                pr,
                key: await workstreamKey(pr),
                policy: await releasePolicyState(pr),
                supersedes: supersededPullNumbers(pr.body),
              });
            }

            const groups = new Map();
            for (const entry of keyed) {
              const group = groups.get(entry.key) || [];
              group.push(entry);
              groups.set(entry.key, group);
            }

            for (const [key, entries] of groups) {
              if (entries.length < 2) continue;

              const explicitSuccessors = entries
                .filter(entry => [...entry.supersedes].some(number => entries.some(candidate => candidate.pr.number === number)))
                .sort((a, b) => b.pr.number - a.pr.number);
              const successful = entries
                .filter(entry => entry.policy.state === "success")
                .sort((a, b) => Number(a.pr.draft) - Number(b.pr.draft) || b.pr.number - a.pr.number);

              let winner = null;
              let losers = [];
              if (explicitSuccessors.length > 0) {
                winner = explicitSuccessors[0];
                losers = entries.filter(entry =>
                  entry.pr.number !== winner.pr.number &&
                  (winner.policy.state === "success" || winner.supersedes.has(entry.pr.number)),
                );
              } else if (successful.length > 0) {
                winner = successful[0];
                losers = entries.filter(entry => entry.pr.number !== winner.pr.number);
              }

              if (!winner || losers.length === 0) {
                core.warning(`Keeping ${entries.length} PRs for ${key}: no successful policy run or explicit supersedes marker.`);
                continue;
              }

              for (const loser of losers) {
                const reason = `${supersededMarker}\nSuperseded by #${winner.pr.number}. Product paths take precedence over free-form workstream names. Winner policy state: \`${winner.policy.state}\`.`;
                openPulls = await closePull(loser.pr, reason, supersededMarker, openPulls);
              }
            }

            if (context.eventName === "pull_request_target" && context.payload.action === "closed") {
              const closed = context.payload.pull_request;
              if (closed.head.repo?.full_name === `${owner}/${repo}`) {
                openPulls = await allOpenPulls();
                await deleteBranch(closed.head.ref, `pull request #${closed.number} closed`, openPulls);
              }
            }

            openPulls = await allOpenPulls();
            const openHeads = new Set(
              openPulls
                .filter(pr => pr.head.repo?.full_name === `${owner}/${repo}`)
                .map(pr => pr.head.ref),
            );
            const branches = await github.paginate(github.rest.repos.listBranches, { owner, repo, per_page: 100 });

            for (const branch of branches) {
              const ref = branch.name;
              if (branch.protected || protectedBranches.has(ref) || openHeads.has(ref)) continue;

              // Any branch whose latest PR is closed is disposable, even if an older process used no prefix.
              const related = await github.paginate(github.rest.pulls.list, {
                owner,
                repo,
                state: "closed",
                head: `${owner}:${ref}`,
                per_page: 100,
              });
              if (related.length > 0) {
                related.sort((a, b) => b.number - a.number);
                await deleteBranch(ref, `latest related PR #${related[0].number} is closed`, openPulls);
                continue;
              }

              if (!isAllowedBranch(ref)) {
                core.warning(`Keeping invalid orphan branch for manual recovery: ${ref}`);
                continue;
              }

              const comparison = await github.rest.repos.compareCommitsWithBasehead({
                owner,
                repo,
                basehead: `${defaultBranch}...${ref}`,
              });
              if (comparison.data.ahead_by === 0) {
                await deleteBranch(ref, "contains no commits outside the default branch", openPulls);
              } else {
                core.warning(`Keeping orphan branch with ${comparison.data.ahead_by} unique commit(s): ${ref}`);
              }
            }

            const finalOpen = await allOpenPulls();
            core.summary
              .addHeading("PR convergence")
              .addRaw(`Open PRs after convergence: ${finalOpen.length}\n`)
              .addRaw(`Mode: ${dryRun ? "dry-run" : "apply"}\n`)
              .write();
