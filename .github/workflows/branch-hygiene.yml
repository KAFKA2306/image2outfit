name: Branch hygiene

on:
  push:
    branches: [main]
  pull_request:
    types: [closed]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  "contents": write

concurrency:
  group: branch-hygiene
  cancel-in-progress: false

jobs:
  delete-merged-branches:
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Delete merged branches through GitHub API
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const protectedBranches = new Set(['main']);

            async function deleteBranch(branch) {
              if (!branch || protectedBranches.has(branch)) return;
              try {
                await github.rest.git.deleteRef({
                  owner,
                  repo,
                  ref: `heads/${branch}`,
                });
                core.info(`Deleted merged branch: ${branch}`);
              } catch (error) {
                if (error.status === 422 || error.status === 404) {
                  core.info(`Branch already absent or not deletable: ${branch}`);
                  return;
                }
                throw error;
              }
            }

            if (context.eventName === 'pull_request') {
              const pullRequest = context.payload.pull_request;
              if (pullRequest?.merged && pullRequest.head.repo.full_name === context.payload.repository.full_name) {
                await deleteBranch(pullRequest.head.ref);
              }
              return;
            }

            const branches = await github.paginate(github.rest.repos.listBranches, {
              owner,
              repo,
              per_page: 100,
            });

            for (const branch of branches) {
              if (protectedBranches.has(branch.name) || branch.protected) continue;

              const comparison = await github.rest.repos.compareCommitsWithBasehead({
                owner,
                repo,
                basehead: `${branch.name}...main`,
              });

              if (comparison.data.status === 'ahead' || comparison.data.status === 'identical') {
                await deleteBranch(branch.name);
              }
            }
