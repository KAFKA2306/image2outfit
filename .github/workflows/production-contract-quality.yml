name: Production contract quality

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: '0.11.32'
          enable-cache: true

      - name: Verify lock and compile
        run: |
          uv lock --check
          uv run --locked --no-default-groups python -m compileall -q src tools tests

      - name: Run all repository audits
        run: uv run --locked --no-default-groups python tools/manage.py audit all

      - name: Run all unit tests
        run: uv run --locked --no-default-groups python -m unittest discover -s tests -v

