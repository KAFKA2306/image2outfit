name: Production contract quality

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tools/**'
      - 'tests/**'
      - 'config/**'
      - 'Taskfile.yml'
      - 'README.md'
      - 'AGENTS.md'
      - 'ARCHITECTURE.md'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/production-contract-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: '0.11.32'
          enable-cache: true

      - name: Verify lock and compile
        run: |
          uv lock --check
          uv run --locked --no-default-groups python -m compileall -q src tools tests

      - name: Run all repository audits
        run: uv run --locked --no-default-groups python tools/manage.py audit all

      - name: Run all unit tests
        run: uv run --locked --no-default-groups python -m unittest discover -s tests -v

      - name: Resolve changed Python files
        id: changed-python
        shell: bash
        run: |
          set -euo pipefail
          base_ref="${{ github.base_ref }}"
          if [ -z "$base_ref" ]; then base_ref=main; fi
          git diff --diff-filter=ACMRT --name-only \
            "origin/$base_ref...HEAD" -- '*.py' > /tmp/changed-python.txt
          uv run --locked --no-default-groups python - <<'PY'
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path("tools").resolve()))
          import audit_tool_ownership

          report = audit_tool_ownership.audit(Path.cwd())
          graph = {
              item["path"]: set(item["imports"])
              for item in report["inventory"]
          }
          product_tools = set()
          stack = [
              chain["entrypoint"]
              for chain in report["productImportChains"]
          ]
          while stack:
              path = stack.pop()
              if path in product_tools:
                  continue
              product_tools.add(path)
              stack.extend(graph.get(path, ()))

          changed = [
              line.strip()
              for line in Path("/tmp/changed-python.txt")
              .read_text(encoding="utf-8")
              .splitlines()
              if line.strip()
          ]
          reusable = [
              path
              for path in changed
              if path.startswith(("src/", "tests/"))
              or (path.startswith("tools/") and path not in product_tools)
          ]
          Path("/tmp/format-python.txt").write_text(
              "".join(f"{path}\n" for path in reusable),
              encoding="utf-8",
          )
          print("Changed Python files:")
          print("\n".join(changed) or "(none)")
          print("Reusable files requiring Ruff format:")
          print("\n".join(reusable) or "(none)")
          PY
          {
            echo 'files<<EOF'
            cat /tmp/changed-python.txt
            echo EOF
            echo 'format_files<<EOF'
            cat /tmp/format-python.txt
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Run stable Ruff lint on this change
        if: steps.changed-python.outputs.files != ''
        shell: bash
        run: |
          mapfile -t files < /tmp/changed-python.txt
          uv run --locked --no-default-groups --group dev ruff check \
            --select E4,E7,E9,F --ignore E402 "${files[@]}"

      - name: Verify Ruff formatting for reusable code
        if: steps.changed-python.outputs.format_files != ''
        shell: bash
        run: |
          mapfile -t files < /tmp/format-python.txt
          uv run --locked --no-default-groups --group dev ruff format --diff "${files[@]}"
