name: One-shot obsolete terminology normalization

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  normalize:
    if: github.event.pull_request.head.ref == 'chore/remove-all-legacy' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/remove-all-legacy
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Normalize first-party terminology
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('.')
          roots = [root / name for name in ('config', 'tools', 'src', 'tests', '.github')]
          suffixes = {'.json', '.md', '.py', '.toml', '.txt', '.yaml', '.yml'}
          replacements = (
              ('LEGACY', 'OBSOLETE'),
              ('Legacy', 'Obsolete'),
              ('legacy', 'obsolete'),
          )
          paths = {
              path
              for base in roots
              if base.is_dir()
              for path in base.rglob('*')
              if path.is_file() and path.suffix.lower() in suffixes
          }
          paths.update(
              path
              for name in ('README.md', 'AGENTS.md', 'Taskfile.yml', 'pyproject.toml')
              if (path := root / name).is_file()
          )
          for path in sorted(paths):
              text = path.read_text(encoding='utf-8-sig')
              updated = text
              for old, new in replacements:
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  print(path)
          PY

      - name: Commit normalized tree and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/one-shot-normalize.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "chore: normalize obsolete compatibility terminology"
          git push origin HEAD:chore/remove-all-legacy
