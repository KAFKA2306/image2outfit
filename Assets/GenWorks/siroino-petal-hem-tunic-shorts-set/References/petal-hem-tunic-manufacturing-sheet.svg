<text x="1210" y="315" class="t">Tunic: matte compact twill</text><text x="1210" y="340" class="t">Inner: cotton poplin</text><text x="1210" y="365" class="t">Petals: structured woven</text><text x="1210" y="390" class="t">Shorts: matte twill</text>
