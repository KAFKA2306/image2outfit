<rect x="1100" y="765" width="470" height="305" rx="14" class="p"/><text x="1120" y="800" class="s">MANUFACTURING TARGET</text>
<text x="1120" y="845" class="t">• Avatar: Siroino canonical adapter first</text><text x="1120" y="875" class="t">• Topology: panel-first, quad-dominant deformation zones</text><text x="1120" y="905" class="t">• UV0: unique islands for petal_A..E and overlap_flap_R</text><text x="1120" y="935" class="t">• Rig: reuse Siroino armature; no new deform skeleton</text><text x="1120" y="965" class="t">• Physics: NOT_REQUIRED for first technical pass</text><text x="1120" y="995" class="t">• LOD0 target: <= 24k garment triangles</text><text x="1120" y="1025" class="t">• Preserve: silhouette > petal rhythm > accent flap > micro trim</text>
