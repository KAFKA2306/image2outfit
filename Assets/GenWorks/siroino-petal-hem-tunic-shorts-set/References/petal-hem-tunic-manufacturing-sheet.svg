<text x="1210" y="515" class="t">tunic_front_L/R</text><text x="1210" y="545" class="t">tunic_back</text><text x="1210" y="575" class="t">sleeve_L/R</text><text x="1210" y="605" class="t">inner_front/back</text><text x="1390" y="515" class="t">shorts_front/back L/R</text><text x="1390" y="545" class="t">waistband</text><text x="1390" y="575" class="t">petal_A..E</text><text x="1390" y="605" class="t">overlap_flap_R</text><text x="1210" y="675" class="t">Hero geometry must remain real panel structure,</text><text x="1210" y="700" class="t">not a printed scallop or texture-only accent.</text>
