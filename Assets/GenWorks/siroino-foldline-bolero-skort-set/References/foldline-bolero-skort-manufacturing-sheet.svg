<path d="M795 285 Q830 280 850 295 L855 435 L795 435 Z" class="light"/>
<path d="M800 295 Q825 320 845 350 L838 390 L798 380 Z" class="cloth"/>
<path d="M798 435 L855 435 L865 545 L785 545 Z" class="dark"/>
