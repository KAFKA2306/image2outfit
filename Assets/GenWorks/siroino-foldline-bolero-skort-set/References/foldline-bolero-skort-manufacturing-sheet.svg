<path d="M560 285 L640 285 L655 435 L545 435 Z" class="light"/>
<path d="M550 290 L600 330 L650 290 L636 380 L565 380 Z" class="cloth"/>
<path d="M555 290 Q600 335 635 395" class="thin"/>
<path d="M548 435 L652 435 L670 545 L530 545 Z" class="dark"/>
<path d="M545 445 L610 510 L660 450" class="accent"/>
