<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
<rect width="1600" height="1100" fill="#f3f1ec"/>
<style>text{font-family:Arial,sans-serif;fill:#20252a}.h{font-size:36px;font-weight:700}.s{font-size:20px;font-weight:700}.t{font-size:16px}.line{stroke:#26333d;stroke-width:4;fill:none}.cloth{fill:#7f93a1;stroke:#26333d;stroke-width:3}.light{fill:#e7e1d5;stroke:#26333d;stroke-width:3}.dark{fill:#34414c;stroke:#26333d;stroke-width:3}.accent{fill:#b36f61;stroke:#26333d;stroke-width:3}.thin{stroke:#8b5c52;stroke-width:3;fill:none}.dash{stroke:#65727b;stroke-width:2;stroke-dasharray:10 8;fill:none}</style>
<text x="55" y="60" class="h">FOLDLINE BOLERO-SKORT SET • manufacturing sheet</text>
<text x="55" y="92" class="t">One VRChat outfit / Siroino • Hero Detail: continuous folded diagonal panel from left shoulder to right waist</text>

<!-- finished look -->
<text x="70" y="145" class="s">DESIGN COMPLETION</text>
<circle cx="250" cy="230" r="55" fill="#d8d1c5" stroke="#26333d" stroke-width="3"/>
<path d="M190 295 Q250 270 310 295 L335 470 Q305 500 250 500 Q195 500 165 470 Z" class="light"/>
<path d="M178 300 L250 355 L322 300 L305 410 L195 410 Z" class="cloth"/>
<path d="M180 305 Q225 340 285 390 L305 420" class="thin"/>
<path d="M155 320 L110 470 L145 485 L205 350" class="light"/>
<path d="M345 320 L390 470 L355 485 L295 350" class="light"/>
<path d="M185 410 L315 410 L345 590 L155 590 Z" class="dark"/>
<path d="M180 420 L250 500 L320 420" class="accent" opacity="0.9"/>
<line x1="250" y1="410" x2="250" y2="590" class="dash"/>
<text x="70" y="625" class="t">Cropped bolero + fitted inner top + asymmetric wrap skort. No shoes, hair, bag or avatar accessories in SKU.</text>

<!-- orthographic -->
<text x="520" y="145" class="s">THREE-VIEW ORTHOGRAPHIC</text>
<text x="545" y="180" class="t">FRONT</text><text x="785" y="180" class="t">SIDE</text><text x="1015" y="180" class="t">BACK</text>
