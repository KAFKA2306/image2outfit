<text x="520" y="580" class="t">Bolero ends above waist. Fold panel is front-led; back remains quiet. Skort wraps on wearer-right.</text>

<!-- hero detail -->
<text x="1240" y="145" class="s">HERO DETAIL</text>
<rect x="1230" y="175" width="300" height="380" rx="18" fill="#ebe7df" stroke="#26333d" stroke-width="3"/>
<path d="M1270 220 L1470 220 L1450 310 L1340 420 L1270 380 Z" class="cloth"/>
<path d="M1288 238 Q1365 275 1435 360" class="thin"/>
<path d="M1300 260 Q1370 300 1420 380" class="thin"/>
<text x="1255" y="465" class="t">Fold is real bounded geometry:</text><text x="1255" y="490" class="t">outer fold + inner facing + seam</text><text x="1255" y="515" class="t">No texture-only fake diagonal.</text>

