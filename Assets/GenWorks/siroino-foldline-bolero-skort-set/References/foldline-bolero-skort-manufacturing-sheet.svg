<!-- palette/material -->
<text x="70" y="970" class="s">MATERIAL / PALETTE</text>
<rect x="70" y="995" width="90" height="55" fill="#e7e1d5" stroke="#26333d"/><text x="175" y="1028" class="t">ivory matte twill</text>
<rect x="360" y="995" width="90" height="55" fill="#7f93a1" stroke="#26333d"/><text x="465" y="1028" class="t">slate cotton-nylon</text>
<rect x="690" y="995" width="90" height="55" fill="#34414c" stroke="#26333d"/><text x="795" y="1028" class="t">ink woven skort</text>
<rect x="1010" y="995" width="90" height="55" fill="#b36f61" stroke="#26333d"/><text x="1115" y="1028" class="t">brick fold facing</text>
<text x="70" y="1080" class="t">Construction priority: silhouette > diagonal fold > wrap overlap > sleeve shape > micro hardware. Opaque materials; restrained sheen.</text>
</svg>