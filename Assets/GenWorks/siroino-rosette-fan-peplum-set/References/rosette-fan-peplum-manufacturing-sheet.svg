/text><text x="1290" y="310" class="b">Slate blue</text><text x="1405" y="310" class="b">Dust rose</text><text x="1520" y="310" class="b">Charcoal</text><text x="1635" y="310" class="b">Gunmetal</text><text x="1175" y="355" class="b">Jacket: compact twill | Inner: cotton poplin | Fan: structured woven</text><text x="1175" y="385" class="b">Shorts: matte twill | Hardware: restrained gunmetal</text><rect x="1145" y="455" width="620" height="305" rx="14" class="box"/><text x="1165" y="495" class="t">PARTS BREAKDOWN</text><text x="1175" y="540" class="b">jacket_front_L/R | jacket_back | sleeve_L/R</text><text x="1175" y="575" class="b">inner_front/back | shorts_front/back_L/R | waistband</text><text x="1175" y="610" class="b">fan_A | fan_B | fan_C | fan_D | fan_E | fan_F</text><text x="1175" y="645" class="b">overlap_flap_R | closure_tabs | small gunmetal hardware</text><text x="1175" y="700" class="b" fill="#a97976">Hero geometry must be real panel geometry, never texture-only.</text><rect x="35" y="800" width="1090" height="350" rx="14" class="box"/><text x="55" y="840" class="t">PATTERN / PANEL FLATS</text><g transform="translate(80,875)"><path d="M0 30 L45 0 L85 25 L75 145 L20 145 Z" fill="#f1f3f4" stroke="#29333d" stroke-width="2"/><text x="0" y="175" class="b">JACKET FRONT L/R</text><path d="M250 15 L290 0 L335 15 L350 145 L235 145 Z" fill="#f1f3f4" stroke="#29333d" stroke-width="2"/><text x="240" y="175" class="b">JACKET BACK</text><path d="M485 0 L535 15 L555 150 L505 160 L470 40 Z" fill="#f1f3f4" stroke="#29333d" stroke-width="2"/><text x="475" y="190" class="b">SLEEVE L/R</text><path d="M710 0 L790 0 L780 145 L750 145 L742 75 L732 145 L700 145 Z" fill="#f1f3f4" stroke="#29333d" stroke-width="2"/><text x="700" y="175" class="b">SHORTS PANELS</text><path d="M900 0 L960 0 L990 120 L870 120 Z" fill="#f1f3f4" stroke="#29333d" stroke-width="2"/><text x="875" y="150" class="b">FAN A-F</text></g><rect x="1145" y="800" width="620" height="350" rx="14" class="box"/><text x="1165" y="840" class="t">MANUFACTURING TARGET</text><text x="1175" y="885" class="b">Avatar: Siroino canonical adapter first</text><text x="1175" y="920" class="b">Topology: panel-first; quad-dominant deformation zones</text><text x="1175" y="955" class="b">UV0: unique islands for fan + overlap Hero Detail</text><text x="1175" y="990" class="b">Rig: reuse Siroino armature; no new deform skeleton</text><text x="1175" y="1025" class="b">Physics: NOT_REQUIRED for first technical pass</text><text x="1175" y="1060" class="b">LOD0 target: &lt;= 24k garment triangles</text><text x="1175" y="1095" class="b">Evidence: Blender build + 5 views + 6 poses; unrun layers UNVERIFIED</text></svg>