Z" class="hero"/><text x="48" y="610" class="b">Cropped tailored vest + fitted inner + straight ankle trousers</text><text x="48" y="635" class="b">Hero: paired 3-stage Telescope Cuffs on both forearms</text><rect x="434" y="102" width="522" height="548" rx="14" class="panel"/><text x="454" y="136" class="h2">FRONT / SIDE / BACK</text><circle cx="556" cy="205" r="19" fill="#ead8ce" stroke="#20262c"/><path d="M514 236 L598 236 L592 326 L520 326 Z" class="shell"/><path d="M516 337 L552 337 L548 510 L519 510 Z" class="bottom"/><path d="M560 337 L596 337 L593 510 L565 510 Z" class="bottom"/><path d="M500 270 L526 286 L522 360 L498 350 Z" class="slate"/><path d="M612 270 L586 286 L590 360 L614 350 Z" class="slate"/><path d="M498 322 L524 318 L525 334 L499 338 Z" class="hero"/><path d="M497 338 L525 334 L526 351 L498 355 Z" class="accent"/><path d="M496 355 L526 351 L527 369 L497 373 Z" class="hero"/><path d="M588 318 L614 322 L613 338 L587 334 Z" class="hero"/><path d="M587 334 L615 338 L614 355 L586 351 Z" class="accent"/><path d="M586 351 L616 355 L615 373 L585 369 Z" class="hero"/><text x="531" y="550" class="b">FRONT</text><circle cx="695" cy="205" r="19" fill="#ead8ce" stroke="#20262c"/><path d="M670 236 L720 244 L716 327 L672 324 Z" class="shell"/><path d="M677 337 L716 340 L712 510 L686 510 Z" class="bottom"/><path d="M691 280 L732 299 L727 365 L697 355 Z" class="slate"/><path d="M702 320 L735 326 L733 346 L699 340 Z" class="hero"/><path d="M700 343 L735 350 L732 370 L698 363 Z" class="accent"/><path d="M698 366 L735 374 L732 394 L696 386 Z" class="hero"/><text x="679" y="550" class="b">SIDE</text><circle cx="832" cy="205" r="19" fill="#ead8ce" stroke="#20262c"/><path d="M790 236 L874 236 L868 326 L796 326 Z" class="shell"/><path d="M796 337 L831 337 L826 510 L798 510 Z" class="bottom"/><path d="M838 337 L873 337 L870 510 L842 510 Z" class="bottom"/><path d="M790 270 L764 289 L768 356 L797 350 Z" class="slate"/><path d="M874 270 L900 289 L896 356 L867 350 Z" class="slate"/><line x1="802" y1="272" x2="832" y2="294" class="thin"/><line x1="862" y1="272" x2="832" y2="294" class="thin"/><text x="808" y="550" class="b">BACK</text><text x="468" y="600" class="b">Upper torso stays quiet; product identity lives at the articulated forearm volume.</text><text x="468" y="625" class="b">No hood, cape, harness, pleat stack, knee bellow, long ribbon or physics-dependent tail.</text><rect x="976" y="102" width="536" height="548" rx="14" class="panel"/><text x="996" y="136" class="h2">HERO DETAIL / COLOR / MATERIAL</text><text x="996" y="172" class="b">Telescope Cuff: three nested bounded shells per forearm + inner facing</text><path d="M1000 198 L1225 188 L1238 220 L1012 232 Z" class="hero"/><path d="M1008 242 L1234 230 L1248 264 L1018 276 Z" class="accent"/><path d="M1016 288 L1244 274 L1260 310 L1028 324 Z" class="hero"/><line x1="1020" y1="216" x2="1205" y2="206" class="line"/><line x1="1028" y1="259" x2="1216" y2="248" class="line"/><line x1="1036" y1="306" x2="1227" y2="294" class="line"/><text x="1280" y="205" class="s">stage A / fixed</text><text x="1280" y="251" class="s">stage B / overlap</text><text x="1280" y="297" class="s">stage C / outer lip</text><text x="996" y="362" class="s">Real silhouette geometry. No texture-only rings, no floating bands, no PhysBone requirement.</text><text x="996" y="410" class="h2">Palette</text><rect x="1000" y="432" width="58" height="42" rx="6" fill="#ece6dc" stroke="#20262c"/><text x="1000" y="492" class="s">Ivory</text><rect x="1080" y="432" width="58" height="42" rx="6" fill="#718492" stroke="#20262c"/><text x="1080" y="492" class="s">Slate</text><rect x="1160" y="432" width="58" height="42" rx="6" fill="#343b40" stroke="#20262c"/><text x="1160" y="492" class="s">Charcoal</text><rect x="1240" y="432" width="58" height="42" rx="6" fill="#83a7a2" stroke="#20262c"/><text x="1240" y="492" class="s">Mist</text><rect x="1320" y="432" width="58" height="42" rx="6" fill="#aa7063" stroke="#20262c"/><text x="1320" y="492" class="s">Brick</text><rect x="1400" y="432" width="58" height="42" rx="6" fill="#aeb4b8" stroke="#20262c"/><text x="1400" y="492" class="s">Metal</text><text x="996" y="536" class="h2">Materials</text><text x="1010" y="568" class="s">• compact matte tailoring twill / vest</text><text x="1010" y="590" class="s">• stretch jersey / inner</text><text x="1010" y="612" class="s">• matte trouser twill / bottoms</text><text x="1252" y="568" class="s">• firm-faced cuff shells</text><text x="1252" y="590" class="s">• low-sheen grosgrain edge</text><text x="1252" y="612" class="s">• optional dark nickel micro hardware</text><rect x="24" y="676" width="1000" height="326" rx="14" class="panel"/><text x="44" y="712" class="h2">PATTERN / PARTS BREAKDOWN</text><text x="52" y="750" class="b">vest_front_L/R</text><path d="M52 770 L126 770 L138 842 L42 842 Z" class="shell"/><text x="174" y="750" class="b">vest_back</text><path d="M180 770 L256 770 L270 842 L166 842 Z" class="shell"/><text x="302" y="750" class="b">sleeve_L/R</text><path d="M312 770 L378 778 L392 842 L298 842 Z" class="slate"/><text x="430" y="750" class="b">inner_F/B</text><path d="M444 770 L502 770 L512 842 L434 842 Z" class="inner"/><text x="552" y="750" class="b">trouser_F_L/R</text><path d="M566 770 L626 770 L632 842 L558 842 Z" class="bottom"/><text x="682" y="750" class="b">trouser_B_L/R</text><path d="M698 770 L758 770 L766 842 L690 842 Z" class="bottom"/><text x="822" y="750" class="b">waistband</text><rect x="836" y="790" width="112" height="24" class="bottom"/><text x="52" y="884" class="b">cuff_L_A/B/C</text><path d="M56 904 L176 896 L182 918 L60 926 Z" class="hero"/><path d="M58 932 L180 924 L186 946 L62 954 Z" class="accent"/><path d="M60 960 L184 952 L190 974 L64 982 Z" class="hero"/><text x="230" y="884" class="b">cuff_R_A/B/C</text><path d="M236 896 L356 904 L352 926 L230 918 Z" class="hero"/><path d="M232 924 L354 932 L350 954 L226 946 Z" class="accent"/><path d="M228 952 L352 960