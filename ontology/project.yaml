purpose:
  problem: Convert a garment specification and traceable research evidence into an auditable VRChat customer-delivery candidate without confusing publication claims, implementation choices, structural validity, and product quality.
  intended_decisions: [ADOPT_PRINCIPLE, PROTOTYPE, BENCHMARK, WATCH, REVIEW_REQUIRED, NO-GO, GO, RELEASED]
  success_conditions:
    - Exact licensed target avatar is used locally without redistribution.
    - Blender and Unity artifacts are structurally valid and traceable.
    - Research-derived requirements identify their source publications and project adoption decisions.
    - Required visual, pose, dynamic, and runtime evidence passes the applicable human and automated reviews.
    - Release files match the reviewed candidate manifest hashes.
  falsification_conditions:
    - Missing rights evidence or target-avatar integration proof.
    - A research-derived requirement has no primary source, project assessment, or verification evidence.
    - Critical penetration, broken weighting, invalid import, or missing required views or motion evidence.
    - Candidate inputs or outputs change after review.

scope:
  included: [garment specification, research publications, project method assessments, research-derived requirements, Blender model, FBX, Unity Prefab, preview evidence, pose evidence, dynamic evidence, VRChat runtime evidence, release manifest]
  excluded: [redistribution of private avatars, automatic aesthetic approval, unverified reuse of publication code or models, legacy snapshots as customer releases]
  temporal: Publications, assessments, candidates, and evidence are versioned and bound to immutable identifiers or hashes at review time.
  abstraction_level: Research-informed customer-delivery pipeline and audit contract.

competency_questions:
  - Which exact avatar, garment candidate, tools, and versions produced this result?
  - Which publication supports each production requirement?
  - Which publication claim is reported fact, and which implementation or benchmark decision belongs to image2outfit?
  - Which part of a publication method is adopted, prototyped, benchmarked, watched, or rejected?
  - Which research-derived requirements apply to this candidate and immutable candidate-manifest hash?
  - What evidence supports structural, visual, pose, dynamic, and runtime claims?
  - Is a comparison with a publication method methodologically valid under the recorded conditions?
  - Can the release be reproduced without exposing private source assets or copying unverified code?
  - Has any reviewed input, output, source, assessment, or requirement changed since approval?

domain_mapping:
  System: AvatarGarmentIntegration
  State: [SpecificationState, ResearchBaselineState, ModelState, TechnicalState, VisualState, PoseState, DynamicState, RuntimeState, ReleaseState]
  Source: [ResearchPublication, PeerReviewedPublication, Preprint, OfficialCodeRepository, LicensedAvatarSource]
  Action: [AssessResearchMethod, DeriveProductionRequirement, ModelGarment, ExportFBX, ImportUnity, ReviewVisuals, ExecutePoseTest, ExecuteDynamicTest, ExecuteRuntimeTest, PromoteRelease]
  Process: [LiteratureSurvey, MethodScreening, ProjectMethodAssessment, ResearchDrivenImprovementLoop, BlenderBuild, UnityImport, StaticValidation, HumanReview, VRChatBuildAndTest, ReleasePromotion]
  Observation: [PublicationReportedClaim, MeshAuditResult, SeamConnectivityResult, TopologyUvAuditResult, PenetrationMeasurement, TextureConsistencyResult, DynamicDeformationResult, UnityImportResult, PreviewImage, PoseTestResult, RuntimeReview]
  Model: [ResearchMethod, PatternReconstructionMethod, StitchPredictionMethod, TopologyAdaptationMethod, TextureGenerationMethod, GarmentDeformationMethod, LinearBlendSkinning, MaterialModel, ClothOrPhysBoneConfiguration, CandidateStateMachine]
  Requirement: [ResearchTraceability, ResearchDerivedRequirement, RightsSeparation, StructuralValidity, FiveViewCoverage, VisualQuality, PoseIntegrity, DynamicIntegrity, RuntimeIntegrity, HashBinding]
  Claim: [ResearchBaselineCurrent, MethodImplemented, CandidateSatisfiesResearchRequirement, CandidateImprovesOnPreviousRevision, CandidateComparableToPublishedMethod, Importable, FitsTargetAvatar, ProductQuality, NoCriticalPenetration, RuntimeCompatible, Releasable]
  Test: [ResearchCatalogValidation, MethodImplementationAudit, CandidateResearchBenchmark, StaticValidation, HumanVisualReview, PoseReview, DynamicReview, RuntimeTest]
  Evidence: [ResearchBenchmarkEvidence, ResearchBaselineAudit, audit.json, candidate-manifest.json, release-manifest.json, preview files, human evidence files, Unity logs, VRChat runtime record]
  Decision: [ResearchAdoptionDecision, ADOPT_PRINCIPLE, PROTOTYPE, BENCHMARK, WATCH, REVIEW_REQUIRED, NO-GO, GO, RELEASED]

claims_and_evidence:
  assertion_types: [ReportedFact, ObservedFact, CalculatedValue, ModelEstimate, Hypothesis, RequirementAssertion, DecisionAssertion]
  required_evidence:
    ResearchBaselineCurrent: [official primary publication URLs, survey timestamp, source-selection policy, research baseline audit]
    MethodImplemented: [project method assessment, implementation path, implementation audit, exact source revision]
    CandidateSatisfiesResearchRequirement: [structured requirement ID, candidate-manifest hash, applicable benchmark protocol, verification evidence]
    CandidateComparableToPublishedMethod: [publication identity, reported experimental conditions, compatible project benchmark protocol, uncertainty or non-comparability statement]
    Importable: [Blender export log, Unity import log, Prefab validation]
    ProductQuality: [front preview, back preview, left preview, right preview, three-quarter preview, human approval]
    NoCriticalPenetration: [neutral, arms-up, arm-cross, crouch, sit, prone, penetration severity evidence]
    RuntimeCompatible: [VRChat SDK Build & Test, target-device measurement where applicable, in-client human check]
    Releasable: [all prior evidence, unchanged candidate manifest hash, rights separation]
  unknown_policy: Missing publication, assessment, implementation, human, target-avatar, rights, pose, dynamic, runtime, or hash evidence cannot produce a research adoption claim or GO.

decision_rules:
  - id: research-adopt-principle
    when: A primary publication supports a transferable production principle and no code or model reuse is required.
    result: ADOPT_PRINCIPLE
  - id: research-prototype
    when: A publication method is relevant but requires independent reproduction, licensing review, or feasibility evidence.
    result: PROTOTYPE
  - id: research-benchmark
    when: A publication defines a useful comparison target but is not selected as the production implementation.
    result: BENCHMARK
  - id: research-watch
    when: Evidence, applicability, rights, or implementation readiness is insufficient for current production use.
    result: WATCH
  - id: technical-to-review
    when: All structural and applicable research-derived checks pass but mandatory human evidence is not complete.
    result: REVIEW_REQUIRED
  - id: any-required-gate-fails
    when: Any non-waivable requirement fails or required evidence is missing.
    result: NO-GO
  - id: reviewed-candidate-go
    when: All applicable requirements pass and evidence hashes match the candidate manifest.
    result: GO
  - id: release-promotion
    when: A GO candidate is promoted without rebuilding and release hashes are recorded.
    result: RELEASED

provenance:
  sources: [official peer-reviewed publication pages, official preprint pages, local licensed avatar assets, garment job specification, Blender scene, Unity project]
  generated_artifacts: [research baseline JSON, research baseline audit, method assessment, structured production requirements, benchmark evidence, blend, FBX, Prefab, audit JSON, candidate manifest, previews, release manifest, ZIP]
  agents: [publication authors, image2outfit assessor, Blender, Unity 2022.3.22f1, GitHub Actions, human reviewer, VRChat client]
  lineage: Every research-derived requirement links to publication IDs and project assessments; every verification record and decision binds to candidate inputs, tool versions, and SHA-256 hashes.

validation:
  structural: Blender mesh checks, seam graph checks, topology and UV checks, FBX export checks, Unity import and Prefab checks.
  semantic: The research baseline keeps publication claims, project assessments, requirements, tests, evidence, and decisions as separate records with validated references.
  evidence: Mandatory source, assessment, view, pose, dynamic, human-review, runtime, and hash-binding records.
  publication: Release artifacts exist only after GO; Published snapshots are not treated as releases and unverified publication code is not copied.
