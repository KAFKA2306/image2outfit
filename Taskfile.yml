version: '3'

tasks:
  candidate:
    desc: Build a technically valid candidate. Never creates a customer release.
    requires:
      vars: [JOB]
    env:
      UV_CACHE_DIR: '{{.ROOT_DIR}}/Assets/_Local/.uv-cache'
      UV_PYTHON_INSTALL_DIR: '{{.ROOT_DIR}}/Assets/_Local/.uv-python'
      UV_PROJECT_ENVIRONMENT: '{{.ROOT_DIR}}/Assets/_Local/.venv'
    cmds:
      - uv run --no-cache --python 3.11 python tools/release_gate.py --mode candidate --job "{{.JOB}}"

  release:
    desc: Promote an unchanged reviewed candidate to Release/ after every mandatory evidence gate passes.
    requires:
      vars: [JOB]
    env:
      UV_CACHE_DIR: '{{.ROOT_DIR}}/Assets/_Local/.uv-cache'
      UV_PYTHON_INSTALL_DIR: '{{.ROOT_DIR}}/Assets/_Local/.uv-python'
      UV_PROJECT_ENVIRONMENT: '{{.ROOT_DIR}}/Assets/_Local/.venv'
    cmds:
      - uv run --no-cache --python 3.11 python tools/release_gate.py --mode release --job "{{.JOB}}"

  audit:repo:
    desc: Reject committed runtime state, product-specific global config, and self-mutating workflows.
    cmds:
      - uv run --no-cache --no-project python tools/audit_repository_hygiene.py

  audit:genworks:
    desc: Audit the canonical Assets/GenWorks product catalog and path containment.
    cmds:
      - uv run --no-cache --no-project python tools/audit_genworks_layout.py

  audit:snapshot:
    desc: Verify any preserved legacy snapshot against its original local source.
    requires:
      vars: [SNAPSHOT, SOURCE]
    cmds:
      - >-
        uv run --no-cache --group snapshot
        python tools/audit_snapshot.py
        --candidate "{{.SNAPSHOT}}"
        --source "{{.SOURCE}}"

  package:snapshot:
    desc: Rebuild a deterministic archive and source hash manifest for any legacy snapshot.
    requires:
      vars: [SNAPSHOT]
    cmds:
      - uv run --no-cache --no-project python tools/package_snapshot.py --root "{{.SNAPSHOT}}"

  maintenance:migrate:genworks:
    desc: Show the migration plan for legacy local image2outfit jobs.
    cmds:
      - uv run --no-cache --no-project python tools/migrate_jobs_to_genworks.py

  maintenance:migrate:genworks:apply:
    desc: Move legacy local job outputs and their Unity meta files into Assets/GenWorks.
    cmds:
      - uv run --no-cache --no-project python tools/migrate_jobs_to_genworks.py --apply
      - uv run --no-cache --no-project python tools/audit_genworks_layout.py
      - uv run --no-cache --no-project python tools/audit_repository_hygiene.py

  check:python:
    desc: Check repository contracts and generic reproducibility tooling.
    cmds:
      - uv run --no-cache --no-project python -m compileall -q tools tests
      - uv run --no-cache --no-project python tools/audit_repository_hygiene.py
      - uv run --no-cache --no-project python tools/audit_genworks_layout.py
      - uv run --no-cache --no-project python -m unittest discover -s tests -v
      - >-
        uv run --no-cache --group dev
        ruff check --ignore S102
        tools/audit_repository_hygiene.py
        tools/audit_genworks_layout.py
        tools/migrate_jobs_to_genworks.py
        tools/audit_snapshot.py
        tools/package_snapshot.py
        tests/test_repository_hygiene.py
        tests/test_config_contracts.py
        tests/test_documentation_contract.py
        tests/test_genworks_layout.py
        tests/test_snapshot_paths.py
      - >-
        uv run --no-cache --group dev
        ruff format --check
        tools/audit_repository_hygiene.py
        tools/audit_genworks_layout.py
        tools/migrate_jobs_to_genworks.py
        tools/audit_snapshot.py
        tools/package_snapshot.py
        tests/test_repository_hygiene.py
        tests/test_config_contracts.py
        tests/test_documentation_contract.py
        tests/test_genworks_layout.py
        tests/test_snapshot_paths.py

  format:python:
    desc: Format generic repository and GenWorks tooling.
    cmds:
      - >-
        uv run --no-cache --group dev
        ruff format
        tools/audit_repository_hygiene.py
        tools/audit_genworks_layout.py
        tools/migrate_jobs_to_genworks.py
        tools/audit_snapshot.py
        tools/package_snapshot.py
        tests/test_repository_hygiene.py
        tests/test_config_contracts.py
        tests/test_documentation_contract.py
        tests/test_genworks_layout.py
        tests/test_snapshot_paths.py
