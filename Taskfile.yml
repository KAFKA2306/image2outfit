version: '3'

tasks:
  candidate:
    desc: Build a candidate after validating its declared construction contract.
    requires:
      vars: [PRODUCT]
    env:
      UV_CACHE_DIR: '{{.ROOT_DIR}}/Assets/_Local/.uv-cache'
      UV_PYTHON_INSTALL_DIR: '{{.ROOT_DIR}}/Assets/_Local/.uv-python'
      UV_PROJECT_ENVIRONMENT: '{{.ROOT_DIR}}/Assets/_Local/.venv'
    cmds:
      - >-
        uv run --no-cache --locked --no-default-groups --python 3.11
        python tools/manage.py candidate --product "{{.PRODUCT}}"

  release:
    desc: Package the unchanged reviewed candidate through the single customer-quality validator.
    requires:
      vars: [PRODUCT]
    env:
      UV_CACHE_DIR: '{{.ROOT_DIR}}/Assets/_Local/.uv-cache'
      UV_PYTHON_INSTALL_DIR: '{{.ROOT_DIR}}/Assets/_Local/.uv-python'
      UV_PROJECT_ENVIRONMENT: '{{.ROOT_DIR}}/Assets/_Local/.venv'
    cmds:
      - >-
        uv run --no-cache --locked --no-default-groups --python 3.11
        python tools/manage.py release --product "{{.PRODUCT}}"

  explain:
    desc: Show the declared construction contract, research capabilities, poses, and required evidence.
    requires:
      vars: [PRODUCT]
    cmds:
      - >-
        uv run --no-cache --locked --no-default-groups
        python tools/manage.py explain --product "{{.PRODUCT}}"

  audit:repo:
    desc: Reject committed runtime state, product-specific global config, and self-mutating workflows.
    cmds:
      - uv run --no-cache --locked --no-default-groups python tools/manage.py audit repository

  audit:runtime:
    desc: Reject legacy output roots and product-configured runtime paths.
    cmds:
      - uv run --no-cache --locked --no-default-groups python tools/manage.py audit runtime

  audit:genworks:
    desc: Audit the canonical Assets/GenWorks product catalog and path containment.
    cmds:
      - uv run --no-cache --locked --no-default-groups python tools/manage.py audit genworks

  audit:tools:
    desc: Reject unowned, duplicate, opaque, cyclic, or excessively layered tools.
    cmds:
      - uv run --no-cache --locked --no-default-groups python tools/manage.py audit tools

  audit:methods:
    desc: Validate every declared construction contract and its research coverage.
    cmds:
      - uv run --no-cache --locked --no-default-groups python tools/manage.py audit methods

  audit:research:
    desc: Reject stale, incomplete, non-primary, or license-unsafe garment research baselines.
    cmds:
      - uv run --no-cache --locked --no-default-groups python tools/manage.py audit research

  maintenance:migrate:genworks:
    desc: Show the migration plan for local jobs outside canonical product roots.
    cmds:
      - >-
        uv run --no-cache --locked --no-default-groups
        python tools/manage.py migrate-genworks

  maintenance:migrate:genworks:apply:
    desc: Move local job outputs and Unity meta files into Assets/GenWorks/<slug>.
    cmds:
      - >-
        uv run --no-cache --locked --no-default-groups
        python tools/manage.py migrate-genworks --apply
      - uv run --no-cache --locked --no-default-groups python tools/manage.py audit all

  check:python:
    desc: Check repository contracts and generic reproducibility tooling.
    cmds:
      - uv lock --check
      - >-
        uv run --no-cache --locked --no-default-groups
        python -m compileall -q tools tests
      - uv run --no-cache --locked --no-default-groups python tools/manage.py audit all
      - >-
        uv run --no-cache --locked --no-default-groups
        python -m unittest discover -s tests -v
      - >-
        uv run --no-cache --locked --no-default-groups --group dev
        ruff check --ignore S102
        tools/manage.py
        tools/method_selection.py
        tools/runtime_paths.py
        tools/contract_io.py
        tools/workspace_transaction.py
        tools/release_packager.py
        tools/production_contract.py
        tools/runtime_transaction.py
        tools/candidate_manifest.py
        tools/technical_candidate.py
        tools/candidate_orchestrator.py
        tools/release_orchestrator.py
        tools/release_gate.py
        tools/audit_runtime_layout.py
        tools/audit_tool_ownership.py
        tools/audit_repository_hygiene.py
        tools/audit_genworks_layout.py
        tools/audit_research_baseline.py
        tools/migrate_jobs_to_genworks.py
        tools/customer_quality.py
        tools/production_gate.py
        tools/production_gate_core.py
        tests/test_runtime_paths.py
        tests/test_runtime_layout.py
        tests/test_method_selection.py
        tests/test_tool_ownership.py
        tests/test_repository_hygiene.py
        tests/test_config_contracts.py
        tests/test_documentation_contract.py
        tests/test_genworks_layout.py
        tests/test_canonical_paths.py
        tests/test_customer_quality.py
        tests/test_production_contract.py
        tests/test_production_gate.py
        tests/test_production_gate_commercial.py
        tests/test_research_baseline.py
      - >-
        uv run --no-cache --locked --no-default-groups --group dev
        ruff format --check
        tools/manage.py
        tools/method_selection.py
        tools/runtime_paths.py
        tools/contract_io.py
        tools/workspace_transaction.py
        tools/release_packager.py
        tools/production_contract.py
        tools/runtime_transaction.py
        tools/candidate_manifest.py
        tools/technical_candidate.py
        tools/candidate_orchestrator.py
        tools/release_orchestrator.py
        tools/release_gate.py
        tools/audit_runtime_layout.py
        tools/audit_tool_ownership.py
        tools/audit_repository_hygiene.py
        tools/audit_genworks_layout.py
        tools/audit_research_baseline.py
        tools/migrate_jobs_to_genworks.py
        tools/customer_quality.py
        tools/production_gate.py
        tools/production_gate_core.py
        tests/test_runtime_paths.py
        tests/test_runtime_layout.py
        tests/test_method_selection.py
        tests/test_tool_ownership.py
        tests/test_repository_hygiene.py
        tests/test_config_contracts.py
        tests/test_documentation_contract.py
        tests/test_genworks_layout.py
        tests/test_canonical_paths.py
        tests/test_customer_quality.py
        tests/test_production_contract.py
        tests/test_production_gate.py
        tests/test_production_gate_commercial.py
        tests/test_research_baseline.py

  format:python:
    desc: Format generic repository and GenWorks tooling.
    cmds:
      - >-
        uv run --no-cache --locked --no-default-groups --group dev
        ruff format
        tools/manage.py
        tools/method_selection.py
        tools/runtime_paths.py
        tools/contract_io.py
        tools/workspace_transaction.py
        tools/release_packager.py
        tools/production_contract.py
        tools/runtime_transaction.py
        tools/candidate_manifest.py
        tools/technical_candidate.py
        tools/candidate_orchestrator.py
        tools/release_orchestrator.py
        tools/release_gate.py
        tools/audit_runtime_layout.py
        tools/audit_tool_ownership.py
        tools/audit_repository_hygiene.py
        tools/audit_genworks_layout.py
        tools/audit_research_baseline.py
        tools/migrate_jobs_to_genworks.py
        tools/customer_quality.py
        tools/production_gate.py
        tools/production_gate_core.py
        tests/test_runtime_paths.py
        tests/test_runtime_layout.py
        tests/test_method_selection.py
        tests/test_tool_ownership.py
        tests/test_repository_hygiene.py
        tests/test_config_contracts.py
        tests/test_documentation_contract.py
        tests/test_genworks_layout.py
        tests/test_canonical_paths.py
        tests/test_customer_quality.py
        tests/test_production_contract.py
        tests/test_production_gate.py
        tests/test_production_gate_commercial.py
        tests/test_research_baseline.py
