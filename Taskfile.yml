version: '3'

tasks:
  candidate:
    desc: Build a technically valid candidate. Never creates a customer release.
    requires:
      vars: [JOB]
    vars:
      PYTHON: '{{.PYTHON | default "C:/Program Files/Blender Foundation/Blender 4.4/4.4/python/bin/python.exe"}}'
    cmds:
      - uv run --no-cache --no-managed-python --python "{{.PYTHON}}" --no-project python tools/release_gate.py --mode candidate --job "{{.JOB}}"

  release:
    desc: Promote an unchanged reviewed candidate to Release/ after every mandatory evidence gate passes.
    requires:
      vars: [JOB]
    vars:
      PYTHON: '{{.PYTHON | default "C:/Program Files/Blender Foundation/Blender 4.4/4.4/python/bin/python.exe"}}'
    cmds:
      - uv run --no-cache --no-managed-python --python "{{.PYTHON}}" --no-project python tools/release_gate.py --mode release --job "{{.JOB}}"

  audit:haolan:
    desc: Verify the committed HAOLAN candidate hashes, archive, and regeneration output.
    cmds:
      - uv run --no-cache --no-project --with numpy --with pillow --with trimesh --with scipy --with matplotlib python tools/audit_published.py --candidate Published/haolan/cow-hood-knit-set-v1 --source Assets/HAOLAN_Quest/FBX/HAOLAN_Lowpoly.fbx

  package:haolan:
    desc: Rebuild the deterministic HAOLAN candidate archive and source hash manifest.
    cmds:
      - uv run --no-cache --no-project python tools/package_published.py --root Published/haolan/cow-hood-knit-set-v1

  check:python:
    desc: Check the reproducibility tooling.
    cmds:
      - uv run --no-cache --no-project --with ruff --with ty ruff check --ignore S102 tools/audit_published.py tools/package_published.py tools/haolan_cow_hood_generator.py tools/haolan_cow_generator_hosted.py
      - uv run --no-cache --no-project --with ruff --with ty ruff format --check tools/audit_published.py tools/package_published.py
      - uv run --no-cache --no-project --with ruff --with ty ty check tools/audit_published.py tools/package_published.py

  format:python:
    desc: Format the reproducibility tooling.
    cmds:
      - uv run --no-cache --no-project --with ruff ruff format tools/audit_published.py tools/package_published.py
