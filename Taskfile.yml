version: '3'

tasks:
  candidate:
    desc: Build a candidate after validating its construction contract.
    requires:
      vars: [PRODUCT]
    env:
      UV_CACHE_DIR: '{{.ROOT_DIR}}/Assets/_Local/.uv-cache'
      UV_PYTHON_INSTALL_DIR: '{{.ROOT_DIR}}/Assets/_Local/.uv-python'
      UV_PROJECT_ENVIRONMENT: '{{.ROOT_DIR}}/Assets/_Local/.venv'
    cmds:
      - >-
        uv run --no-cache --locked --no-default-groups --python 3.11
        python tools/manage.py candidate --product "{{.PRODUCT}}"

  release:
    desc: Package the unchanged reviewed candidate through the release validator.
    requires:
      vars: [PRODUCT]
    env:
      UV_CACHE_DIR: '{{.ROOT_DIR}}/Assets/_Local/.uv-cache'
      UV_PYTHON_INSTALL_DIR: '{{.ROOT_DIR}}/Assets/_Local/.uv-python'
      UV_PROJECT_ENVIRONMENT: '{{.ROOT_DIR}}/Assets/_Local/.venv'
    cmds:
      - >-
        uv run --no-cache --locked --no-default-groups --python 3.11
        python tools/manage.py release --product "{{.PRODUCT}}"

  explain:
    desc: Show the selected construction method and required evidence.
    requires:
      vars: [PRODUCT]
    cmds:
      - >-
        uv run --no-cache --locked --no-default-groups
        python tools/manage.py explain --product "{{.PRODUCT}}"

  mcp:setup:
    desc: Prepare pinned Blender MCP and register Blender + Unity MCP with Codex on Windows.
    platforms: [windows]
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File tools/setup_mcp.ps1

  mcp:doctor:
    desc: Read-only report for Codex, Blender MCP, and Unity MCP local connectivity.
    platforms: [windows]
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File tools/setup_mcp.ps1 -DoctorOnly

  improve:
    desc: Advance defect diagnosis, targeted learning, measured experiments, adoption, regeneration, and re-evaluation until a real external boundary or no defect remains.
    requires:
      vars: [PRODUCT]
    cmds:
      - >-
        uv run --no-cache --locked --no-default-groups
        python tools/manage.py improve --product "{{.PRODUCT}}"

  audit:all:
    desc: Run every repository, runtime, toolchain, research, and method audit.
    cmds:
      - >-
        uv run --no-cache --locked --no-default-groups
        python tools/manage.py audit all

  audit:toolchain:
    desc: Audit pinned Python, Blender, Unity, VPM, and package contracts.
    cmds:
      - >-
        uv run --no-cache --locked --no-default-groups
        python tools/manage.py audit toolchain

  audit:repo:
    desc: Reject runtime residue, global product config, and mutating workflows.
    cmds:
      - >-
        uv run --no-cache --locked --no-default-groups
        python tools/manage.py audit repository

  audit:runtime:
    desc: Reject legacy output roots and product-configured runtime paths.
    cmds:
      - >-
        uv run --no-cache --locked --no-default-groups
        python tools/manage.py audit runtime

  audit:genworks:
    desc: Audit the canonical GenWorks catalog and product path containment.
    cmds:
      - >-
        uv run --no-cache --locked --no-default-groups
        python tools/manage.py audit genworks

  audit:tools:
    desc: Reject unowned, duplicate, cyclic, or excessively layered tools.
    cmds:
      - >-
        uv run --no-cache --locked --no-default-groups
        python tools/manage.py audit tools

  audit:methods:
    desc: Validate every declared construction contract and research coverage.
    cmds:
      - >-
        uv run --no-cache --locked --no-default-groups
        python tools/manage.py audit methods

  audit:research:
    desc: Reject stale, incomplete, non-primary, or license-unsafe research.
    cmds:
      - >-
        uv run --no-cache --locked --no-default-groups
        python tools/manage.py audit research

  maintenance:migrate:genworks:
    desc: Show the migration plan for jobs outside canonical product roots.
    cmds:
      - >-
        uv run --no-cache --locked --no-default-groups
        python tools/manage.py migrate-genworks

  maintenance:migrate:genworks:apply:
    desc: Move job outputs and Unity meta files into canonical product roots.
    cmds:
      - >-
        uv run --no-cache --locked --no-default-groups
        python tools/manage.py migrate-genworks --apply
      - >-
        uv run --no-cache --locked --no-default-groups
        python tools/manage.py audit all

  check:python:
    desc: Run the complete reusable Python verification suite.
    cmds:
      - uv lock --check
      - >-
        uv run --no-cache --locked --no-default-groups
        python -m compileall -q src tools tests
      - >-
        uv run --no-cache --locked --no-default-groups
        python tools/manage.py audit all
      - >-
        uv run --no-cache --locked --no-default-groups
        python -m unittest discover -s tests -v
      - >-
        uv run --no-cache --locked --no-default-groups --group dev
        ruff check --ignore S102 src tools tests

  format:python:
    desc: Format reusable source, tools, and tests discovered in the repository.
    cmds:
      - >-
        uv run --no-cache --locked --no-default-groups --group dev
        ruff format src tools tests
