version: '3'

tasks:
  candidate:
    desc: Build a candidate by product slug after deterministic method selection.
    requires:
      vars: [PRODUCT]
    env:
      UV_CACHE_DIR: '{{.ROOT_DIR}}/Assets/_Local/.uv-cache'
      UV_PYTHON_INSTALL_DIR: '{{.ROOT_DIR}}/Assets/_Local/.uv-python'
      UV_PROJECT_ENVIRONMENT: '{{.ROOT_DIR}}/Assets/_Local/.venv'
    cmds:
      - >-
        uv run --no-cache --locked --no-default-groups --python 3.11
        python tools/manage.py candidate --product "{{.PRODUCT}}"

  release:
    desc: Release only after commercial and customer-quality evidence pass.
    requires:
      vars: [PRODUCT]
    env:
      UV_CACHE_DIR: '{{.ROOT_DIR}}/Assets/_Local/.uv-cache'
      UV_PYTHON_INSTALL_DIR: '{{.ROOT_DIR}}/Assets/_Local/.uv-python'
      UV_PROJECT_ENVIRONMENT: '{{.ROOT_DIR}}/Assets/_Local/.venv'
    cmds:
      - >-
        uv run --no-cache --locked --no-default-groups --python 3.11
        python tools/manage.py release --product "{{.PRODUCT}}"

  explain:
    desc: Show the selected construction method and required evidence.
    requires:
      vars: [PRODUCT]
    cmds:
      - >-
        uv run --no-cache --locked --no-default-groups
        python tools/manage.py explain --product "{{.PRODUCT}}"

  audit:all:
    desc: Run every repository, toolchain, research, and method audit once.
    cmds:
      - >-
        uv run --no-cache --locked --no-default-groups
        python tools/manage.py audit all

  audit:toolchain:
    desc: Audit pinned Python, Blender, Unity, VPM, and package contracts.
    cmds:
      - >-
        uv run --no-cache --locked --no-default-groups
        python tools/manage.py audit toolchain

  audit:repo:
    desc: Reject runtime residue, global product config, and mutating workflows.
    cmds:
      - >-
        uv run --no-cache --locked --no-default-groups
        python tools/manage.py audit repository

  audit:genworks:
    desc: Audit the canonical GenWorks catalog and product path containment.
    cmds:
      - >-
        uv run --no-cache --locked --no-default-groups
        python tools/manage.py audit genworks

  audit:tools:
    desc: Reject unowned, duplicate, cyclic, or excessively layered tools.
    cmds:
      - >-
        uv run --no-cache --locked --no-default-groups
        python tools/manage.py audit tools

  audit:methods:
    desc: Reject missing, ambiguous, or unstable product method selection.
    cmds:
      - >-
        uv run --no-cache --locked --no-default-groups
        python tools/manage.py audit methods

  audit:research:
    desc: Reject stale, incomplete, non-primary, or license-unsafe research.
    cmds:
      - >-
        uv run --no-cache --locked --no-default-groups
        python tools/manage.py audit research

  maintenance:migrate:genworks:
    desc: Show the migration plan for jobs outside canonical product roots.
    cmds:
      - >-
        uv run --no-cache --locked --no-default-groups
        python tools/manage.py migrate-genworks

  maintenance:migrate:genworks:apply:
    desc: Move job outputs and Unity meta files into canonical product roots.
    cmds:
      - >-
        uv run --no-cache --locked --no-default-groups
        python tools/manage.py migrate-genworks --apply
      - >-
        uv run --no-cache --locked --no-default-groups
        python tools/manage.py audit all

  check:python:
    desc: Run the complete generic Python verification suite.
    cmds:
      - uv lock --check
      - >-
        uv run --no-cache --locked --no-default-groups
        python -m compileall -q tools tests
      - >-
        uv run --no-cache --locked --no-default-groups
        python tools/manage.py audit all
      - >-
        uv run --no-cache --locked --no-default-groups
        python -m unittest discover -s tests -v
      - >-
        uv run --no-cache --locked --no-default-groups --group dev
        ruff check --ignore S102 tools tests

  format:python:
    desc: Format every generic Python tool and test discovered in the repository.
    cmds:
      - >-
        uv run --no-cache --locked --no-default-groups --group dev
        ruff format tools tests
