version: '3'

tasks:
  candidate:
    desc: Build a technically valid candidate. Never creates a customer release.
    requires:
      vars: [JOB]
    vars:
      PYTHON: '{{.PYTHON | default "C:/Program Files/Blender Foundation/Blender 4.4/4.4/python/bin/python.exe"}}'
    cmds:
      - uv run --no-cache --no-managed-python --python "{{.PYTHON}}" --no-project python tools/release_gate.py --mode candidate --job "{{.JOB}}"

  release:
    desc: Promote an unchanged reviewed candidate to Release/ after every mandatory evidence gate passes.
    requires:
      vars: [JOB]
    vars:
      PYTHON: '{{.PYTHON | default "C:/Program Files/Blender Foundation/Blender 4.4/4.4/python/bin/python.exe"}}'
    cmds:
      - uv run --no-cache --no-managed-python --python "{{.PYTHON}}" --no-project python tools/release_gate.py --mode release --job "{{.JOB}}"
